# dbt_league -- transform layer for the Fantasy Beat Reporter pipeline.
# Layer conventions and the DAG walkthrough live in README.md alongside
# this file; the hosted catalog is linked from there.

name: 'dbt_league'
version: '1.0.2'
profile: 'dbt_league'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# Per-layer materialization defaults. Individual models override in their
# config() block: the weekly facts are incremental merges, two models pin
# to table for float determinism, and thin contract dims / windowed
# derivations stay views. marts/core (dims + facts) and marts/reporting
# (consumer marts) both inherit the marts default.
models:
  dbt_league:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table

# Project-level vars
vars:
  # When true (default), int_player_daily filters out stat rows whose
  # stat_category does not match the player's lineup_slot_category -- i.e.
  # a hitter's hitting stats only count when they're in a hitting slot, a
  # pitcher's pitching stats only count from a pitching slot. This matches
  # ESPN's team-scoring behavior. Set to false to credit cross-slot stats
  # (e.g., a hitter slotted at RP gets full credit for their hitting line).
  # Inactive rows (BE/IL/FA) bypass the filter regardless so the inactive
  # facts capture full stat lines.
  strict_slot_validity: true

  # THE HOLDING PEN (MLB-115). A synthetic franchise that catches production
  # we can attribute to a LEAGUE but not to a team: CBS's 2001-2002 zero-event
  # players, and any franchise-season the lineage seed declares unowned. Record
  # books fence it out of every TEAM aggregation (a holding pen is not a
  # franchise) and it gets no team page.
  #
  # The label is a pure placeholder. These two vars are the ONLY place it is
  # pinned in the transform layer, so swapping it -- if '####' ever trips a
  # parser, a formula bar, or a URL -- is a one-line edit here rather than a
  # hunt through models and seeds. Keep the id numeric: it lands in
  # franchise_id columns that are typed numeric.
  holding_pen_franchise_id: 9999
  holding_pen_label: '####'

seeds:
  dbt_league:
    # MLB-90: which recording of each draft season to trust, and how to
    # stitch the ones that ran two drafts. Curation, so it is data.
    draft_assembly_plan:
      +column_types:
        league_key: varchar
        season_year: integer
        part_seq: integer
        draft_key: varchar
        view: varchar
        part_role: varchar
        order_tier: varchar
        note: varchar
    matchup_schedule:
      +column_types:
        season_year: integer
        matchup_period: integer
        start_date: date
        end_date: date
        is_abnormal: boolean
        # Free text naming WHY a week is abnormal, blank on normal weeks.
        # Typed rather than inferred so the all-blank case doesn't sniff
        # as something other than text.
        abnormal_reason: varchar
        is_playoff: boolean
        playoff_round: varchar
    stat_classification:
      +column_types:
        # Identity
        stat_name: varchar
        espn_stat_id: integer
        stat_category: varchar
        # Display (Phase 7 B1: stat_description renamed to espn_stat_label
        # for platform neutrality; display_name + abbrev added)
        espn_stat_label: varchar
        display_name: varchar
        abbrev: varchar
        # Shape (Phase 7 B1: is_derived + derivation_expr added for mart
        # Jinja loop in sub-chunk F)
        is_counting: boolean
        is_derived: boolean
        derivation_expr: varchar
        # Record-surfacing rules (Phase 7 B1: is_record_candidate + polarity
        # added; collapse _IMPLICIT_POLARITY / should_track_record into seed.
        # v1.x: is_always_tracked renamed to auto_tracked -- the column flags
        # stats that are tracked regardless of league scoring settings, in
        # contrast to "is_scored" which would mark stats tracked because
        # they appear in scoring_settings.)
        auto_tracked: boolean
        is_record_candidate: boolean
        polarity: varchar
        # v1.1.1: rate-stat min-volume qualifier. qualifier_stat names the
        # denominator column (e.g. 'ab', 'outs') and qualifier_min is the
        # threshold below which the stat doesn't qualify as a record.
        # NULL on every non-rate stat -- mart_stat_leaderboard skips the
        # threshold filter when qualifier_min is NULL.
        qualifier_stat: varchar
        qualifier_min: integer
        notes: varchar
        # The platform-neutral key this ESPN stat bridges to -- the join
        # back to canonical_stats and, through it, cbs_stat_map.
        canonical_key: varchar
    player_nicknames:
      +column_types:
        player_id: integer
        player_name: varchar
        nickname: varchar
    canonical_stats:
      +column_types:
        canonical_key: varchar
        display_name: varchar
        stat_category: varchar
        bref_key: varchar
        is_derived: boolean
        notes: varchar
    cbs_stat_map:
      +column_types:
        cbs_key: varchar
        canonical_key: varchar
        stat_category: varchar
        disposition: varchar
        in_scoring_rules_2026: boolean
        # DOUBLE, not FLOAT: same 64-bit type on Snowflake, but FLOAT is
        # 32-bit on some engines and would narrow the scoring weights.
        points_2026: double
        appears_in: varchar
        needs_confirmation: boolean
        notes: varchar
    mlb_stat_map:
      +column_types:
        statsapi_key: varchar
        stat_group: varchar
        canonical_key: varchar
        stat_category: varchar
        disposition: varchar
        notes: varchar
    owner_nicknames:
      +column_types:
        # All varchar so the optional preferred_name (often blank) isn't
        # type-inferred as numeric -- which breaks the load the moment a
        # text value is added. owner_id is an ESPN member GUID string.
        owner_id: varchar
        first_name: varchar
        last_name: varchar
        preferred_name: varchar