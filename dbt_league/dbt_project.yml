
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'dbt_league'
version: '1.0.2'

# This setting configures which "profile" dbt uses for this project.
profile: 'dbt_league'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"


# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models

# In this example config, we tell dbt to build all models in the example/
# directory as views. These settings can be overridden in the individual model
# files using the `{{ config(...) }}` macro.
models:
  dbt_league:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table

# Project-level vars
vars:
  # When true (default), int_player_daily filters out stat rows whose
  # stat_category does not match the player's lineup_slot_category -- i.e.
  # a hitter's hitting stats only count when they're in a hitting slot, a
  # pitcher's pitching stats only count from a pitching slot. This matches
  # ESPN's team-scoring behavior. Set to false to credit cross-slot stats
  # (e.g., a hitter slotted at RP gets full credit for their hitting line).
  # Inactive rows (BE/IL/FA) bypass the filter regardless so the inactive
  # facts capture full stat lines.
  strict_slot_validity: true

seeds:
  dbt_league:
    matchup_schedule:
      +column_types:
        season_year: integer
        matchup_period: integer
        start_date: date
        end_date: date
        is_abnormal: boolean
        is_playoff: boolean
        playoff_round: varchar
    stat_classification:
      +column_types:
        # Identity
        stat_name: varchar
        espn_stat_id: integer
        stat_category: varchar
        # Display (Phase 7 B1: stat_description renamed to espn_stat_label
        # for platform neutrality; display_name + abbrev added)
        espn_stat_label: varchar
        display_name: varchar
        abbrev: varchar
        # Shape (Phase 7 B1: is_derived + derivation_expr added for mart
        # Jinja loop in sub-chunk F)
        is_counting: boolean
        is_derived: boolean
        derivation_expr: varchar
        # Record-surfacing rules (Phase 7 B1: is_record_candidate + polarity
        # added; collapse _IMPLICIT_POLARITY / should_track_record into seed.
        # v1.x: is_always_tracked renamed to auto_tracked -- the column flags
        # stats that are tracked regardless of league scoring settings, in
        # contrast to "is_scored" which would mark stats tracked because
        # they appear in scoring_settings.)
        auto_tracked: boolean
        is_record_candidate: boolean
        polarity: varchar
        # v1.1.1: rate-stat min-volume qualifier. qualifier_stat names the
        # denominator column (e.g. 'ab', 'outs') and qualifier_min is the
        # threshold below which the stat doesn't qualify as a record.
        # NULL on every non-rate stat -- mart_stat_leaderboard skips the
        # threshold filter when qualifier_min is NULL.
        qualifier_stat: varchar
        qualifier_min: integer
        notes: varchar
    player_nicknames:
      +column_types:
        player_id: integer
        player_name: varchar
        nickname: varchar
    owner_nicknames:
      +column_types:
        # All varchar so the optional preferred_name (often blank) isn't
        # type-inferred as numeric -- which breaks the load the moment a
        # text value is added. owner_id is an ESPN member GUID string.
        owner_id: varchar
        first_name: varchar
        last_name: varchar
        preferred_name: varchar