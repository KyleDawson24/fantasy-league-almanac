# dbt_league -- transform layer for the Fantasy League Almanac pipeline.
# Layer conventions and the DAG walkthrough live in README.md alongside
# this file; the hosted catalog is linked from there.

name: 'dbt_league'
version: '2.0.1'
profile: 'dbt_league'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
# TWO seed roots, because seeds do two unrelated jobs (MLB-114).
#
#   seeds/        REFERENCE VOCABULARY -- stat maps, MLB team abbrevs, the
#                 record-surfacing rules. Universal: identical for every
#                 league on a given platform, so it ships as real content
#                 and nobody edits it to run their own league.
#
#   league_config/  USER CONFIG -- the calendar, the franchise/owner
#                 registries, and the override seeds that rename and merge
#                 things. WHOSE league this is. Tracked content is blank
#                 templates; a maintainer's real content sits at this path
#                 under skip-worktree, and the demo fixture is an
#                 alternative directory selected by the env var.
#
# The split is what lets the fixture exist at all: dbt resolves a seed by
# FILENAME, so two active seed roots may not both carry owner_nicknames.csv.
# Swapping the whole league_config directory is therefore the only way to
# point the same models at different league content -- which is exactly the
# demo/real distinction. ref() is unaffected by which root a seed lives in,
# so no model changed when these moved.
seed-paths: ["seeds", "{{ env_var('DBT_LEAGUE_CONFIG', 'league_config') }}"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# Per-layer materialization defaults. Individual models override in their
# config() block: the weekly facts are incremental merges, two models pin
# to table for float determinism, and thin contract dims / windowed
# derivations stay views. marts/core (dims + facts) and marts/reporting
# (consumer marts) both inherit the marts default.
#
# staging/intermediate default to TABLE, not view (MLB-134). A view over
# fat JSON re-runs the whole reshape for every consumer AND every schema
# test that reads it. Snowflake's warehouse absorbed that cost quietly
# enough that it looked free; the MLB-9 spike put a number on it by
# running the same tests both ways on a laptop-class engine -- 25-80s
# each as views, 0.04-0.05s each as tables. Materialization is a
# decision, so it is made here rather than inherited.
#
# A model-level config() still wins, so this moves 14 staging models --
# including the fat-JSON reshapes stg_box_scores,
# stg_player_stat_breakdowns, stg_mlb__player_game and
# stg_cbs__ui_transactions, which are the ones that were paying the cost.
# The other 8 staging models pin `view` themselves and keep it.
#
# The intermediate line changes nothing TODAY -- all 15 intermediate
# models already pin their own materialization, int_player_daily among
# them (its header argues the daily grain reads fine live and the table
# cost belongs one layer up at the weekly grain). It is here so a new
# intermediate model added without a pin lands as a table rather than
# inheriting a view by accident.
models:
  dbt_league:
    staging:
      +materialized: table
    intermediate:
      +materialized: table
    marts:
      +materialized: table

# Project-level vars
vars:
  # When true (default), int_player_daily filters out stat rows whose
  # stat_category does not match the player's lineup_slot_category -- i.e.
  # a hitter's hitting stats only count when they're in a hitting slot, a
  # pitcher's pitching stats only count from a pitching slot. This matches
  # ESPN's team-scoring behavior. Set to false to credit cross-slot stats
  # (e.g., a hitter slotted at RP gets full credit for their hitting line).
  # Inactive rows (BE/IL/FA) bypass the filter regardless so the inactive
  # facts capture full stat lines.
  strict_slot_validity: true

  # THE HOLDING PEN (MLB-115). A synthetic franchise that catches production
  # we can attribute to a LEAGUE but not to a team: CBS's 2001-2002 zero-event
  # players, and any franchise-season the lineage seed declares unowned. Record
  # books fence it out of every TEAM aggregation (a holding pen is not a
  # franchise) and it gets no team page.
  #
  # The label is a pure placeholder. These two vars are the ONLY place it is
  # pinned in the transform layer, so swapping it -- if '####' ever trips a
  # parser, a formula bar, or a URL -- is a one-line edit here rather than a
  # hunt through models and seeds. Keep the id numeric: it lands in
  # franchise_id columns that are typed numeric.
  holding_pen_franchise_id: 9999
  holding_pen_label: '####'

  # WHAT A WITHHELD OWNER NAME IS CALLED (MLB-243). A public ESPN league
  # serves the stable member GUID and NULLs firstName / lastName /
  # displayName -- a platform privacy limitation, not an extraction gap
  # and never an invitation to guess. dim_owner falls back to this label
  # so the surface stays honest: the owner IS identified (by GUID, which
  # is what franchise continuity actually joins on); only the human-
  # readable name is unavailable. Pinned as a var so the wording has one
  # home -- it renders on Home, the team pages, the draft board and the
  # record book.
  owner_unavailable_label: 'Owner unavailable'

seeds:
  dbt_league:
    # ==================================================================
    # EVERY league_config SEED DECLARES ITS TYPES (MLB-235 rung 4B-2)
    # ==================================================================
    # Not a style preference -- a fresh clone does not build without it.
    #
    # The committed league_config templates are ALL header-only: a stranger
    # gets fourteen files with a header row and no data. An empty CSV has
    # nothing to infer a type FROM, so an undeclared column arrives as
    # whatever the loader guesses -- measured: `league_key` landing INTEGER,
    # then dying against the VARCHAR one from stg_box_scores. Three models
    # failed that way on the exact all-blank installation (int_franchise_
    # registry, int_cbs__team_owner_season, stg_cbs__mlbam_crosswalk), while
    # the maintainer's populated files inferred correctly and hid it. So
    # QUICKSTART could truthfully say "these can all stay blank" and the
    # unscoped `dbt seed && dbt run` it tells a stranger to type would not
    # run. tests/test_weekly_chain_without_seed.py builds that exact state.
    #
    # TYPES COME FROM DOWNSTREAM, NOT FROM TASTE. Every id that a model
    # casts to varchar before use is declared varchar here (franchise_id,
    # canonical_franchise_id, owner_id); every id that is coalesced with a
    # RAW-derived integer is declared integer (mlbam_id, player_id). The
    # populated demo fixture is the cross-check: same types, so a populated
    # install produces exactly what it did before.
    #
    # The COMMITTED PUBLIC TEMPLATE IS THE WHOLE SCHEMA. No column is
    # declared here that the template does not carry -- a private local
    # column would be a private local column documented in a public file.
    # tests/test_league_config_templates.py asserts both directions.
    #
    # Empty stays empty: nothing below gives an unfilled CBS seed ESPN
    # meaning, and no row is invented. These tables load EMPTY and correctly
    # typed, which is what lets the CBS-side models build to zero rows
    # instead of erroring.

    # -- CBS franchise / owner registries --------------------------------
    # Every franchise id is cast to varchar before it is used (see
    # int_franchise_registry and dim_franchise), so varchar is the type it
    # already had by the time anything compared it.
    cbs_franchises:
      +column_types:
        league_key: varchar
        franchise_id: varchar
        abbrev: varchar
        franchise_name: varchar
    cbs_team_owners:
      +column_types:
        league_key: varchar
        franchise_id: varchar
        owner_id: varchar
    team_owner_by_year:
      +column_types:
        league_key: varchar
        season_year: integer
        franchise_id: varchar
        owner_name: varchar
    # season_year is deliberately nullable: a lineage row with no season
    # means "always", and dim_franchise reads exactly that
    # (`nullif(cast(season_year as varchar), '') is null`).
    franchise_lineage:
      +column_types:
        league_key: varchar
        franchise_id: varchar
        season_year: integer
        canonical_franchise_id: varchar
        canonical_name: varchar
        canonical_abbrev: varchar
    owner_alias:
      +column_types:
        league_key: varchar
        owner_id: varchar
        canonical_owner_id: varchar
        preferred_name: varchar

    # -- player identity -------------------------------------------------
    # mlbam_id is integer because every consumer coalesces it with the
    # crosswalk's own RAW-derived mlbam_id.
    player_alias:
      +column_types:
        name_key: varchar
        mlbam_id: integer
        note: varchar
    player_identity_overrides:
      +column_types:
        platform: varchar
        cbs_name_key: varchar
        mlbam_id: integer
        mlbam_name: varchar
        note: varchar
    player_identity_context_overrides:
      +column_types:
        league_key: varchar
        season_year: integer
        franchise_id: varchar
        cbs_name_key: varchar
        mlbam_id: integer
        note: varchar

    # -- the early-anchor worklist ---------------------------------------
    # No model reads this one, and it is typed anyway: `dbt seed` loads every
    # seed whether a model refs it or not, so an untyped empty file fails the
    # stranger's very first command. `cbs_player_id` is varchar because CBS
    # ids include the synthetic `ui-only-*` form.
    cbs_early_anchors_backfill:
      +column_types:
        season: integer
        tier: varchar
        cbs_player_id: varchar
        player: varchar
        points: integer
        hr: integer
        team_abbrev_FILL_ME: varchar
        active_status: varchar

    # MLB-90: which recording of each draft season to trust, and how to
    # stitch the ones that ran two drafts. Curation, so it is data.
    draft_assembly_plan:
      +column_types:
        league_key: varchar
        season_year: integer
        part_seq: integer
        draft_key: varchar
        view: varchar
        part_role: varchar
        order_tier: varchar
        note: varchar
    # MLB-235 rung 4A. GENUINELY SPARSE: absence of a row means "use the
    # platform derivation", so an ordinary period must NOT appear here. It
    # exists for the commissioner-declared oddity whose scoring-period length
    # is normal -- the one class derivation structurally cannot see, because
    # nothing about the membership is unusual. Types are declared because the
    # file is empty on a fresh install and an empty CSV has nothing to infer
    # from.
    matchup_period_overrides:
      +column_types:
        league_key: varchar
        season_year: integer
        matchup_period: integer
        is_abnormal: boolean
        abnormal_reason: varchar
    matchup_schedule:
      +column_types:
        season_year: integer
        matchup_period: integer
        start_date: date
        end_date: date
        is_abnormal: boolean
        # Free text naming WHY a week is abnormal, blank on normal weeks.
        # Typed rather than inferred so the all-blank case doesn't sniff
        # as something other than text.
        abnormal_reason: varchar
        is_playoff: boolean
        playoff_round: varchar
    stat_classification:
      +column_types:
        # Identity
        stat_name: varchar
        espn_stat_id: integer
        stat_category: varchar
        # Display (Phase 7 B1: stat_description renamed to espn_stat_label
        # for platform neutrality; display_name + abbrev added)
        espn_stat_label: varchar
        display_name: varchar
        abbrev: varchar
        # Shape (Phase 7 B1: is_derived + derivation_expr added for mart
        # Jinja loop in sub-chunk F)
        is_counting: boolean
        is_derived: boolean
        derivation_expr: varchar
        # Record-surfacing rules (Phase 7 B1: is_record_candidate + polarity
        # added; collapse _IMPLICIT_POLARITY / should_track_record into seed.
        # v1.x: is_always_tracked renamed to auto_tracked -- the column flags
        # stats that are tracked regardless of league scoring settings, in
        # contrast to "is_scored" which would mark stats tracked because
        # they appear in scoring_settings.)
        auto_tracked: boolean
        is_record_candidate: boolean
        polarity: varchar
        # v1.1.1: rate-stat min-volume qualifier. qualifier_stat names the
        # denominator column (e.g. 'ab', 'outs') and qualifier_min is the
        # threshold below which the stat doesn't qualify as a record.
        # NULL on every non-rate stat -- mart_stat_leaderboard skips the
        # threshold filter when qualifier_min is NULL.
        qualifier_stat: varchar
        qualifier_min: integer
        notes: varchar
        # The platform-neutral key this ESPN stat bridges to -- the join
        # back to canonical_stats and, through it, cbs_stat_map.
        canonical_key: varchar
    player_nicknames:
      +column_types:
        player_id: integer
        player_name: varchar
        nickname: varchar
    canonical_stats:
      +column_types:
        canonical_key: varchar
        display_name: varchar
        stat_category: varchar
        bref_key: varchar
        is_derived: boolean
        notes: varchar
    cbs_stat_map:
      +column_types:
        cbs_key: varchar
        canonical_key: varchar
        stat_category: varchar
        disposition: varchar
        in_scoring_rules_2026: boolean
        # DOUBLE, not FLOAT: same 64-bit type on Snowflake, but FLOAT is
        # 32-bit on some engines and would narrow the scoring weights.
        points_2026: double
        appears_in: varchar
        needs_confirmation: boolean
        notes: varchar
    mlb_stat_map:
      +column_types:
        statsapi_key: varchar
        stat_group: varchar
        canonical_key: varchar
        stat_category: varchar
        disposition: varchar
        notes: varchar
    owner_nicknames:
      +column_types:
        # All varchar so the optional preferred_name (often blank) isn't
        # type-inferred as numeric -- which breaks the load the moment a
        # text value is added. owner_id is an ESPN member GUID string.
        owner_id: varchar
        first_name: varchar
        last_name: varchar
        preferred_name: varchar
        # These four columns ARE the seed, everywhere (MLB-114). The blank
        # template defines the schema, the demo fixture matches it, and the
        # maintainer's real copy matches it too -- contact details live in a
        # local sidecar this project never reads, so there is no seed shape
        # for dbt to know about but not document.
        #
        # This map used to carry email/phone_number as well, so that a
        # six-column local copy would satisfy dbt-duckdb's all-or-none rule.
        # That put the names of two contact columns in tracked config to
        # describe a file that must never be committed -- publishing the
        # shape of the thing being withheld. Making the template the schema
        # removes the reason those keys existed.
