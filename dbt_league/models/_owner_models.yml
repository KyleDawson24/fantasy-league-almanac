version: 2

# v1.2 owner-display models. Co-located here for the feature; can be
# folded into the per-directory schema.yml files later.

models:
  - name: stg_team_owners
    description: >
      Per-season team -> owner bridge, flattened from RAW.TEAM_OWNERS
      (latest snapshot per season). owner_id is the stable ESPN member
      GUID -- the join key dim_owner and the owner_nicknames seed use.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - season_year
              - team_id
              - owner_id
    columns:
      - name: season_year
        tests:
          - not_null
      - name: team_id
        tests:
          - not_null
      - name: owner_id
        tests:
          - not_null

  - name: dim_owner
    description: >
      Owner dimension. One row per owner_id, spined off stg_team_owners
      (every owner ever seen) LEFT JOIN the owner_nicknames seed for an
      optional preferred_name override. owner_display = preferred_name
      when set, else "First Last".
    columns:
      - name: owner_id
        description: 'Stable ESPN member GUID. Grain key.'
        tests:
          - not_null
          - unique
      - name: owner_display
        description: 'Nickname if set, else proper-cased "First Last".'
        tests:
          - not_null

  - name: int_team_owner_display
    description: >
      (season, team) -> owner_display label. Collapses co-owned teams to
      "Name / Name". Single join point consumers/marts use to attach
      owner_display alongside owner_name.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - season_year
              - team_id
    columns:
      - name: owner_display
        tests:
          - not_null
