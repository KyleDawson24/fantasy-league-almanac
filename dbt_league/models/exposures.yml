version: 2

# dbt exposures formally declare downstream consumers of the dbt models.
# They surface as terminal nodes in the dbt docs lineage graph, so anyone
# browsing the catalog can see "these models feed these external outputs."
# Each output script in output/ is declared here.

exposures:

  - name: weekly_recap
    label: Weekly Recap (BBCode)
    type: application
    maturity: high
    url: https://github.com/KyleDawson24/fantasy-league-almanac
    description: >
      Weekly fantasy-baseball recap rendered as BBCode for posting on
      ESPN's league front page. Generated by output/generate_summary.py
      and run manually each Sunday after the matchup period closes.

      Sections include matchup-level winner/loser callouts, top-contributor
      lines per team, "records set this week" highlights derived from the
      mart leaderboard, wasted-points callouts (active starters whose
      negative performances cost the manager points vs an empty slot),
      league-wide benchmarks line ("League This Week" from the benchmarks
      mart), and league-color callouts (no-hitters, milestones,
      streaks, etc.) from output/league_notes.py.
    depends_on:
      - ref('fct_team_weekly_active_performance')
      - ref('fct_player_weekly_active_performance')
      - ref('fct_player_weekly_inactive_performance')
      - ref('fct_player_daily_performance')
      - ref('mart_stat_leaderboard')
      - ref('mart_league_weekly_benchmarks')
      - ref('dim_stat')
      - ref('dim_matchup_period')
    owner:
      name: Kyle Dawson
      email: kpdawson24@gmail.com

  - name: records_report
    label: All-Time Records Report (BBCode)
    type: application
    maturity: high
    url: https://github.com/KyleDawson24/fantasy-league-almanac
    description: >
      Comprehensive top-5 leaderboard report across all tracked stats and
      grains (team and player), rendered as BBCode for posting on ESPN's
      league front page. Generated by output/generate_records_report.py.

      Each tracked stat surfaces its top-5 holders with player contributors,
      tie-collapse rendering for tiers that saturate past the display cap,
      and polarity-aware Best/Worst labeling. Pulls the mart's top-10
      buffer per (grain, stat, direction) so consumer-side tie-collapse
      can detect saturation accurately.
    depends_on:
      - ref('mart_stat_leaderboard')
      - ref('fct_player_weekly_active_performance')
      - ref('fct_team_weekly_active_performance')
      - ref('dim_stat')
      - ref('dim_matchup_period')
    owner:
      name: Kyle Dawson
      email: kpdawson24@gmail.com

  - name: records_sheet
    label: Legacy Records Dump to Google Sheets
    type: application
    maturity: medium
    description: >
      Legacy opt-in Google Sheets sink for the records report. Same underlying
      data as records_report but materialized into a 17-column, 3-tab
      workbook for offline analysis (All-Time Records / Current Season
      Records / Leaderboard Dump tabs, auto-created on first write).

      Triggered by running output/generate_records_report.py with a sheet
      target configured -- the dev sheet (SHEETS_DEV_ID) by default, or
      production via --prod (SHEETS_PROD_ID); writer logic lives in
      output/sheets_writer.py. Runs are no-op when no target is set, so the
      sink is opt-in by design.

      No url is declared. This exposure used to carry a link described as a
      read-only sample workbook, but the id it named resolves to the
      maintainer's own production sheet -- so the "sample" was the live
      league book, real names and all.

      An anonymized sample now exists for the ALMANAC (see league_almanac
      below), and it is deliberately not linked from here: this surface is
      a different artifact -- the 17-column, 3-tab records dump, not the
      almanac -- and pointing at the almanac sample would repeat the
      original error in a new costume. This sink gets a link when someone
      renders and anonymizes a sample of this workbook.
    depends_on:
      - ref('mart_stat_leaderboard')
      - ref('fct_player_weekly_active_performance')
      - ref('fct_team_weekly_active_performance')
      - ref('dim_stat')
      - ref('dim_matchup_period')
    owner:
      name: Kyle Dawson
      email: kpdawson24@gmail.com

  - name: league_almanac
    label: League Almanac (Google Sheets)
    type: application
    maturity: medium
    url: https://docs.google.com/spreadsheets/d/1gj4Lfp098asXtCRHmTzM6gWhzgfZiQ9urUMQ3oPqJzU
    description: >
      Browsable Google Sheets league archive generated by
      output/generate_almanac_sheet.py. The workbook includes a Home
      navigation-hub dashboard (nav band, points glossary, All-League
      teams), a curated current-season vs all-time Records tab, the
      Matchup History archive, a Draft Recap tab with draft-value
      leaderboards, standings views, and one active-stats tab per
      fantasy team with best-lineup analysis.

      One dependency sits below the core contract layer and is declared
      here deliberately: stg_scoring_settings supplies points_per_unit
      for the scoring-glossary callouts (no core surface carries scoring
      weights yet).

      The url is a read-only anonymized sample of the rendered almanac: a
      copy of the ESPN book with owner and franchise identities replaced by
      the same twins the published demo fixture carries, and real MLB player
      names left intact. It is deliberately a copy rather than the live
      workbook -- the link this exposure used to carry pointed at the
      maintainer's production sheet, which is the mistake it now exists not
      to repeat. The points-league (CBS) almanac has its own sample:
      https://docs.google.com/spreadsheets/d/1mZeqeIQZeIFjs5Kj3LUwQcWU0pBh03sBep8RKwXJVo8
    depends_on:
      - ref('fct_player_weekly_slot_performance')
      - ref('fct_player_weekly_active_performance')
      - ref('fct_team_weekly_active_performance')
      - ref('fct_player_season_performance')
      - ref('fct_player_position_pts')
      - ref('dim_team_owner')
      - ref('stg_scoring_settings')
      - ref('mart_daily_roster_snapshot')
      - ref('mart_draft_board')
      - ref('mart_stat_leaderboard')
      - ref('mart_team_matchup')
      - ref('mart_team_season_standings')
      - ref('mart_team_slot_production')
      - ref('mart_team_acquisition_channels')
      - ref('dim_roster_slot_counts')
      - ref('dim_stat')
      - ref('dim_matchup_period')
    owner:
      name: Kyle Dawson
      email: kpdawson24@gmail.com
