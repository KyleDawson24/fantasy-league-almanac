version: 2

# dbt exposures formally declare downstream consumers of the dbt models.
# They surface as terminal nodes in the dbt docs lineage graph, so anyone
# browsing the catalog can see "these models feed these external outputs."
# Each output script in output/ is declared here.

exposures:

  - name: weekly_recap
    label: Weekly Recap (BBCode)
    type: application
    maturity: high
    url: https://github.com/KyleDawson24/fantasy-league-front-page
    description: >
      Weekly fantasy-baseball recap rendered as BBCode for posting on
      ESPN's league front page. Generated by output/generate_summary.py
      and run manually each Sunday after the matchup period closes.

      Sections include matchup-level winner/loser callouts, top-contributor
      lines per team, "records set this week" highlights derived from the
      mart leaderboard, wasted-points callouts (active starters whose
      negative performances cost the manager points vs an empty slot),
      league-wide benchmarks line ("League This Week" from the benchmarks
      mart), and league-color callouts (no-hitters, milestones,
      streaks, etc.) from output/league_notes.py.
    depends_on:
      - ref('fct_weekly_team_active_performance')
      - ref('fct_weekly_player_active_performance')
      - ref('fct_weekly_player_inactive_performance')
      - ref('fct_player_daily_performance')
      - ref('mart_stat_leaderboard')
      - ref('mart_league_weekly_benchmarks')
      - ref('dim_stat')
      - ref('dim_matchup_period')
    owner:
      name: Kyle Dawson
      email: kpdawson24@gmail.com

  - name: records_report
    label: All-Time Records Report (BBCode)
    type: application
    maturity: high
    url: https://github.com/KyleDawson24/fantasy-league-front-page
    description: >
      Comprehensive top-5 leaderboard report across all tracked stats and
      grains (team and player), rendered as BBCode for posting on ESPN's
      league front page. Generated by output/generate_records_report.py.

      Each tracked stat surfaces its top-5 holders with player contributors,
      tie-collapse rendering for tiers that saturate past the display cap,
      and polarity-aware Best/Worst labeling. Pulls the mart's top-10
      buffer per (grain, stat, direction) so consumer-side tie-collapse
      can detect saturation accurately.
    depends_on:
      - ref('mart_stat_leaderboard')
      - ref('fct_weekly_player_active_performance')
      - ref('fct_weekly_team_active_performance')
      - ref('dim_stat')
      - ref('dim_matchup_period')
    owner:
      name: Kyle Dawson
      email: kpdawson24@gmail.com

  - name: records_sheet
    label: Legacy Records Dump to Google Sheets
    type: application
    maturity: medium
    url: https://docs.google.com/spreadsheets/d/1C_CJ-jAZ-7iE3bz_rR4DmRXARQFh4qb8O6MgjTMKDF0/edit?usp=sharing
    description: >
      Legacy opt-in Google Sheets sink for the records report. Same underlying
      data as records_report but materialized into a 17-column, 3-tab
      workbook for offline analysis (All-Time Records / Current Season
      Records / Leaderboard Dump tabs, auto-created on first write).

      Triggered by setting the SHEETS_OUTPUT_ID environment variable when
      running output/generate_records_report.py; writer logic lives in
      output/sheets_writer.py. Runs are no-op when SHEETS_OUTPUT_ID is
      unset, so the sink is opt-in by design. The url field above points
      at a read-only sample workbook so the dbt docs reader can preview
      what this sink produces.
    depends_on:
      - ref('mart_stat_leaderboard')
      - ref('fct_weekly_player_active_performance')
      - ref('fct_weekly_team_active_performance')
      - ref('dim_stat')
      - ref('dim_matchup_period')
    owner:
      name: Kyle Dawson
      email: kpdawson24@gmail.com

  - name: league_almanac
    label: League Almanac (Google Sheets)
    type: application
    maturity: medium
    url: https://docs.google.com/spreadsheets/d/1C_CJ-jAZ-7iE3bz_rR4DmRXARQFh4qb8O6MgjTMKDF0/edit?usp=sharing
    description: >
      Browsable Google Sheets league archive generated by
      output/generate_almanac_sheet.py. The workbook includes a Home tab
      with all-league lineups, a curated current-season vs all-time
      Records tab, a Team Weeks archive, and one active-stats tab per
      fantasy team.

      The v1.1.0 implementation intentionally ships the product surface
      before fully refactoring its data-access layer; future v1.1.1 work
      should keep the generated TSV fixture byte-identical while moving
      reusable analytical SQL into dbt contracts.
    depends_on:
      - ref('fct_weekly_player_performance')
      - ref('fct_weekly_player_active_performance')
      - ref('fct_weekly_team_active_performance')
      - ref('fct_player_season_performance')
      - ref('mart_daily_roster_snapshot')
      - ref('mart_stat_leaderboard')
      - ref('mart_league_weekly_benchmarks')
      - ref('mart_team_matchup')
      - ref('dim_roster_slot_counts')
      - ref('dim_stat')
      - ref('dim_matchup_period')
    owner:
      name: Kyle Dawson
      email: kpdawson24@gmail.com
