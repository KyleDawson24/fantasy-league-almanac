version: 2

models:
  - name: int_franchise_registry
    description: >
      Platform-general OBSERVED franchise registry (MLB-64): one row per
      (league_key, franchise_id) with the franchise's observed display name and
      abbrev. dim_franchise resolves the franchise_lineage continuity overrides
      onto this seam, so every league reaches the team-grain surfaces through
      one shape. Two observed sources, one per league by precedence: CURATED
      (a franchises seed, for leagues whose names are historical and cannot be
      re-derived) and DERIVED (latest-season team identity observed in the box
      scores, for leagues whose platform reports names live -- a rename
      propagates on the next extract). The derived branch excludes any league
      the curated seed covers, so the two can never contest a franchise.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - league_key
              - franchise_id
    columns:
      - name: league_key
        description: The league this franchise belongs to.
        tests:
          - not_null
      - name: franchise_id
        description: >
          Platform team id as varchar -- the franchise's stable identity within
          its league, before lineage resolution collapses re-mints.
        tests:
          - not_null
      - name: observed_name
        description: >
          Display name as observed: the curated seed's name, or the franchise's
          latest observed season in the box scores.
      - name: observed_abbrev
        description: Display abbreviation, from the same source as observed_name.
      - name: last_observed_season
        description: >
          Latest season this franchise was seen playing, from the union of every
          league's season-grain source. The recency signal dim_franchise anchors
          DISPLAY on (MLB-113), which is what lets a CURATED league order its
          eras without a maintained column in its flat seed. Null only for
          franchises that never appear in a season source (the CBS #### holding
          pen); such a franchise is always its own lineage, so a null never
          decides a display race.

  - name: int_cbs__team_owner_season
    description: >
      Per-season CBS team ownership (MLB-64), all-time. Resolves the curated
      team_owner_by_year NAMES to canonical owner IDS: a current owner is
      matched by display name to keep its seeded slug, everyone else is slugged
      from the name; the owner_alias seed then collapses the historian's merges
      (Des/Desmond Foster). Grows the owner chain (stg_cbs__team_owners) from
      current-era-only to full history.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - league_key
              - season_year
              - franchise_id
              - owner_id
    columns:
      - name: owner_id
        tests: [not_null]
      - name: season_year
        tests: [not_null]

  - name: int_player_daily
    description: >
      Wide daily row per (league, season, scoring_period, team, player_key, lineup_slot).
      Combines per-stat point contributions (one column per scored stat) with per-player ESPN platform totals.
      MLB-72 union layer: the ESPN branch UNION ALLs int_cbs__player_daily
      (CBS day-grain in the same column contract), so both leagues' daily
      production flows through one shape into the shared fact family.
      player_key is the cross-league grain identity; game_date /
      active_weight / provenance are the union-layer columns both branches
      fill. View materialization; the table cost lives at the weekly layer one level up.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - league_key
              - season_year
              - scoring_period
              - team_id
              - player_key
              - lineup_slot
    columns:
      - name: league_key
        description: 'League registry key. Carried from staging; the stg_scoring_settings weight join is league-scoped so each league''s points_per_unit applies only to its own rows.'
        tests:
          - not_null
      - name: season_year
        description: 'ESPN season year.'
        tests:
          - not_null
      - name: scoring_period
        description: 'The day key: ESPN''s daily scoring period number (starts at 1 on league opening day) on ESPN rows; the calendar date as YYYYMMDD on CBS rows (whose platform serves no period ids historically).'
        tests:
          - not_null
      - name: matchup_period
        description: 'The weekly matchup period this scoring period belongs to. Functionally determined by (season_year, scoring_period) via matchup_schedule on ESPN rows; NULL on CBS rows (no historic period boundaries exist -- period-scoped CBS surfaces read stg_cbs__standings).'
      - name: team_id
        description: 'Stable numeric team identifier (ESPN team_id / CBS franchise_id). NULL for ESPN free agents.'
      - name: player_id
        description: 'Stable numeric player identifier (ESPN ids; CBS numeric ids incl. the 900/901 two-way pseudo-pair). NULL on CBS ui-only synthetic identities -- player_key is the grain column.'
      - name: player_key
        description: 'Cross-league player identity, the grain column (MLB-72): ESPN player_id stringified; the CBS platform id verbatim, including ui-only-<mlbam> synthetics that have no numeric form.'
        tests:
          - not_null
      - name: game_date
        description: 'Real calendar date of the day''s production. NULL on ESPN rows (their day identity is the platform scoring_period); always set on CBS rows.'
      - name: active_weight
        description: 'The day''s scoring weight: 1/0 where the active state is known (ESPN slots, CBS captured/reconstructed days), the start-share estimator on CBS 2004-2020 estimated days, NULL where membership is confirmed but activity unknown.'
      - name: provenance
        description: 'How the day''s roster state is known: captured (platform-served -- all ESPN rows + CBS 2026), reconstructed_day, estimated_startshare, estimated_membership (the MLB-63 walk-back enum).'
        tests:
          - accepted_values:
              arguments:
                values: ['captured', 'reconstructed_day', 'estimated_startshare', 'estimated_adjacent', 'estimated_membership', 'sentinel']
      - name: lineup_slot
        description: 'Slot the player occupied on this scoring_period (ESPN: 1B/SP/BE/FA/etc. CBS: the captured deployed slot for 2026, ACT/RS for reconstructed history, EST for the estimated era). Part of the grain because a player can appear in multiple slots within a matchup_period.'
        tests:
          - not_null
      - name: lineup_slot_category
        description: '"hitting" / "pitching" / "inactive" (+ "estimated" on CBS estimated-era rows). Derived from lineup_slot at stg_box_scores (ESPN) / int_cbs__player_daily (CBS).'
      - name: is_active_slot
        description: 'true when lineup_slot_category != "inactive". NULL on CBS estimated-era rows (the state is not knowable per-day there; active_weight carries the estimator). Convenience flag for downstream active/inactive fact splits.'
      - name: display_name
        description: 'Nickname-resolved player name (COALESCE(nickname, player_name)).'
      - name: position
        description: 'Player MLB position as reported by ESPN.'
      - name: pro_team
        description: 'Player MLB team abbreviation as reported by ESPN.'
      - name: eligible_slots
        description: 'VARIANT array of fantasy lineup slots the player is eligible to fill. Carried from stg_box_scores so per-day consumer queries can pull this without reaching into staging.'
      - name: platform_points
        description: 'ESPN platform total for this player on this scoring_period. From stg_box_scores; reflects commissioner adjustments and ESPN W/L authority.'
      - name: total_stat_pts
        description: 'Sum of stat_points across ALL scored stats (catch-all rollup; robust to future seed additions). Equivalent to calculated_points at this daily grain.'
      - name: total_hitting_stat_pts
        description: 'Sum of stat_points for hitting-category stats.'
      - name: total_pitching_stat_pts
        description: 'Sum of stat_points for pitching-category stats.'
      - name: negative_points
        description: >
          Magnitude (unsigned positive) of net-negative platform_points on this day: GREATEST(0, -platform_points).
          Per-day platform-level metric -- each negative day counts separately, even if the week-level platform total is net positive.
          Weekly rollup is SUM(negative_points). For a player with one -5 day and net-positive week: daily row has 5, weekly rollup = 5.

  - name: int_cbs__eligibility_windows
    description: >
      CBS position eligibility as date-scoped windows, implementing the
      league's captured rule verbatim ("Players are eligible at their primary
      position, plus positions they've played 20 games last year or 10 games
      this year") with after-achievement semantics: primary and
      prior-year-20 windows open on opening day (Jan 1), the in-season-10
      window opens ON the date of the 10th game at the position, inclusive.
      Primary is DERIVED (prior-season argmax fielding games, current-season
      fallback for rookies/returners) because CBS serves no historical
      primary-position label; graded against the 2026 captured
      eligible_positions. DH-for-all is deliberately absent (slot semantics,
      not an earned window -- consumers floor empty arrays to ['DH']).
      Games-by-position merges the season-grain fielding sweep with the
      per-game positions (GREATEST of the two counts). One league today;
      league_key fans from the scoring settings like the points engine.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - league_key
              - mlbam_id
              - season_year
              - cbs_position
    columns:
      - name: league_key
        tests:
          - not_null
      - name: mlbam_id
        description: 'MLBAM player id -- windows are baseball-identity-keyed; the crosswalk''s stat_group_scope guard routes them onto CBS identities at consumption (a ''(Batter)'' pseudo-id never shows P, a ''(Pitcher)'' only P).'
        tests:
          - not_null
      - name: season_year
        tests:
          - not_null
      - name: cbs_position
        description: 'CBS slot-vocabulary position: C/1B/2B/3B/SS/OF/DH/P (LF/CF/RF collapse to OF, SP/RP to P -- matching the 2026 captures).'
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['C', '1B', '2B', '3B', 'SS', 'OF', 'DH', 'P']
      - name: eligible_from
        description: 'The date the window opens: Jan 1 for primary / prior_year_20 (opening-day eligibility), the 10th game''s date for in_season_10.'
        tests:
          - not_null
      - name: eligibility_source
        description: 'The strongest claim granting the position: primary > prior_year_20 > in_season_10 (earliest window wins; source breaks same-date ties).'
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['primary', 'prior_year_20', 'in_season_10']

  - name: int_cbs__player_daily
    description: >
      The MLB-72 union feed: CBS day-grain production in int_player_daily's
      exact column contract (fct_cbs_player_game_attribution x
      int_cbs__player_game_points, game grain aggregated to day grain, plus
      the scope-guarded eligibility arrays and the walk-back's provenance /
      active_weight). int_player_daily UNION ALLs this model; see its docs
      for the shared column semantics. CBS scored categories land on their
      ESPN-shape homonyms (bb->b_bb, s->sv, hd->hld, ha->p_h, bbi->p_bb);
      IRSTR rides only inside total_pitching_stat_pts (no per-stat column in
      the shared shape); unmapped columns are 0. eligible_slots floors to
      ['DH'] for fieldless hitters / ['P'] for pitcher-scoped identities,
      mirroring CBS's own display.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - league_key
              - season_year
              - scoring_period
              - team_id
              - player_key
              - lineup_slot
    columns:
      - name: player_key
        tests:
          - not_null
      - name: team_id
        description: 'CBS franchise_id -- never NULL here (the attribution fact is rostered-games-only by construction).'
        tests:
          - not_null
      - name: game_date
        tests:
          - not_null
      - name: lineup_slot
        description: 'Captured deployed slot for 2026 (C/1B/../P, RS); ACT/RS for reconstructed lineup-era days; EST for the estimated era.'
        tests:
          - not_null
      - name: provenance
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['captured', 'reconstructed_day', 'estimated_startshare', 'estimated_adjacent', 'estimated_membership', 'sentinel']
      - name: eligible_slots
        description: 'Date-scoped derived eligibility array as of this day (int_cbs__eligibility_windows through the crosswalk scope guard), CBS vocabulary, alphabetically ordered for determinism, floored to the identity''s universal position when no window has opened.'
        tests:
          - not_null

  - name: int_cbs__player_game_points
    description: >
      The MLB-62 recompute: per-game calculated_ fantasy points for the CBS
      league -- universal per-game stats (stg_mlb__player_game) priced by
      the league's own rules (stg_cbs__scoring_settings) on CBS player
      identity (stg_cbs__mlbam_crosswalk). The only per-game-capable scoring
      lens (CBS serves no per-game FPTS); the substrate for the record book
      and, when membership lands (MLB-63), the active-only slicing. One row
      per (league_key, player, discipline-line, game): a pre-2022 pitcher's
      two-discipline game is two rows, each priced by its own group's
      categories; Ohtani routes to 900/901 via the crosswalk's
      stat_group_scope. QS derived per start (started AND outs>=18 AND
      er<=3); IRSTR derived as ir - irs; INN paid at out-granularity via
      the settings translation. Crosswalk INNER join = the population gate
      (drops pre-collision-fix orphan gamelogs). league_key fans from the
      settings; current weights price all seasons.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - league_key
              - cbs_player_id
              - stat_group
              - game_pk
              - game_date
              - game_index
    columns:
      - name: league_key
        description: 'League registry key, fanned from stg_cbs__scoring_settings -- each league prices the shared baseball layer with its own rules.'
        tests:
          - not_null
      - name: cbs_player_id
        description: 'CBS player id (two-way pseudo-ids 900/901 land as separate players per MLB-68).'
        tests:
          - not_null
      - name: cbs_player_name
        description: 'CBS player name, discipline-suffixed for the two-way pseudo-ids.'
      - name: mlbam_id
        description: 'The universal-layer player key behind this row.'
        tests:
          - not_null
      - name: season_year
        description: 'MLB season year.'
        tests:
          - not_null
      - name: stat_group
        description: 'Discipline of this game line (hitting | pitching). Batting categories price hitting rows, pitching categories pitching rows -- enforced by the per-group stat map.'
        tests:
          - not_null
      - name: game_date
        description: 'Game date.'
        tests:
          - not_null
      - name: game_pk
        description: 'MLB game id (doubleheader legs distinct; one known same-date partial-line pair shares one, split by game_index).'
        tests:
          - not_null
      - name: calculated_fpts
        description: 'The game''s total calculated_ fantasy points under current CBS rules. calculated_hitting_pts + calculated_pitching_pts.'
        tests:
          - not_null
      - name: calculated_hitting_pts
        description: 'Batting-category contribution (R/RBI/BB/SB/TB at +1).'
      - name: calculated_pitching_pts
        description: 'Pitching-category contribution (W/S/HD/CG/QS/outs/IRSTR/K/HA/BBI/ER).'
      - name: outs
        description: 'Outs recorded -- the INN category at its true pay granularity (1 pt/out). There is deliberately no innings column; thirds notation stays out of the engine.'
      - name: qs
        description: 'Derived quality start flag: games_started_pitching = 1 AND outs >= 18 AND earned runs <= 3.'
      - name: irstr
        description: 'Derived inherited runners stranded: ir - irs (statsapi publishes the components, not a single strand key -- MLB''s own box scores print the same pair). Corroborated by CBS''s OWN per-game IRPCT strand rates: Milner 2025 agrees 30/30 games, so the small season-grain wobble (0 diff on 1,110 of 1,226 player-seasons 2023-25; max +/-3) is INTERNAL to CBS -- their season key disagrees with their own gamelogs. CBS''s direct season IRSTR anchors reconciliation, nothing else.'
      - name: gs
        description: 'Games started (pitching) -- QS derivation context, unpriced.'
      - name: ir
        description: 'Inherited runners -- IRSTR derivation context, unpriced.'
      - name: irs
        description: 'Inherited runners scored -- IRSTR derivation context, unpriced.'
      - name: nh
        description: 'Derived no-hitter flag: complete game, zero hits allowed, outs >= 27 (official individual no-hitters only). Unscored; feeds the record book. There is deliberately NO perfect-game flag -- battersFaced = outs means "faced the minimum" (erased baserunners), not "nobody reached," and the erasure events that separate the two are invisible in a pitcher''s aggregate line; 3 of the archive''s 4 minimum-faced no-hitters would be false perfectos.'

  - name: int_cbs__player_season_stats
    description: >
      Player-season stats on the CALCULATED_ lens, LONG form and
      stat_name-bridged: one row per (league_key, cbs_player_id, season_year,
      stat_name) -- the record book's stats source, complete for every
      crosswalked player (the universal-sourced sibling of the free-agent-only
      stg_cbs__player_season_stats, which anchors reconciliation instead).
      Three row families: bridged counting stats (stg_mlb__player_game
      canonicals summed and translated to ESPN stat_names; games_played
      hitting-group-scoped -- the ESPN G is games-by-batters, and the scope
      keeps a batting pitcher's season from double-counting), exact derived
      shapes (1B = H-2B-3B-HR, XBH = 2B+3B+HR), and engine rows
      (QS/IRSTR/NH season counts + CALCULATED_POINTS and its
      hitting/pitching splits from int_cbs__player_game_points; PG
      deliberately absent -- underivable from this feed). Seasons
      floored to the LEAGUE ERA (data-driven: the UI-history standings'
      first season, 2001; platform-archive min as fallback); interim
      TOTAL lens until MLB-63 membership scopes it; early-era population
      coverage rides the MLB-63 UI-history crosswalk (year-end-roster
      names), so never-anchored pass-throughs are absent.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - league_key
              - cbs_player_id
              - season_year
              - stat_name
    columns:
      - name: league_key
        description: 'League registry key, fanned from the scoring settings / engine.'
        tests:
          - not_null
      - name: cbs_player_id
        description: 'CBS player id (two-way pseudo-ids 900/901 as separate players, MLB-68).'
        tests:
          - not_null
      - name: cbs_player_name
        description: 'CBS player name, discipline-suffixed for the two-way pseudo-ids.'
      - name: season_year
        description: 'MLB season year, within the league era (2001+, the UI-history standings floor).'
        tests:
          - not_null
      - name: stat_name
        description: 'ESPN-namespace stat name (the dim_stat bridge) plus the engine rows (QS, IRSTR, NH, CALCULATED_POINTS, CALCULATED_HITTING_PTS, CALCULATED_PITCHING_PTS).'
        tests:
          - not_null
      - name: stat_category
        description: 'hitting | pitching | general | total.'
      - name: stat_value
        description: 'The season value (counting sum, derived count, or calculated points).'
        tests:
          - not_null

  # ------------------------------------------------------------------
  # MLB-63 walk-back chain: name identity -> membership stints ->
  # effective (attribution-ready) windows -> daily lineup state. The
  # per-game attribution fact (marts/core) joins the chain to the
  # priced engine; mart_team_points_reconciliation grades the whole
  # reconstruction against the official standings.
  # ------------------------------------------------------------------

  - name: int_cbs__player_name_ids
    description: >
      The name -> CBS-player-id dictionary, built ONLY from the league's own
      id-bearing rows (modern UI transactions, 2026 daily rosters, the
      archive crosswalk): one row per (league_key, name_key), where name_key
      is the shared cbs_name_key() normalization every walk-back join speaks.
      n_ids > 1 marks a name genuinely shared by multiple CBS ids (the Will
      Smith / Luis Garcia class) -- downstream flags ambiguity and never
      guesses; n_ids = 1 yields resolved identity via any_id.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - league_key
              - name_key
    columns:
      - name: league_key
        tests:
          - not_null
      - name: name_key
        description: 'cbs_name_key() of the display name: periods stripped, packed POS+TEAM tokens stripped, Last-First flipped, lowered, whitespace-collapsed. Two-way (Batter)/(Pitcher) suffixes survive by design.'
        tests:
          - not_null
      - name: cbs_player_ids
        description: 'All distinct CBS ids observed under this name (array).'
      - name: n_ids
        description: 'Count of distinct ids; > 1 = ambiguous name, flagged downstream.'
        tests:
          - not_null
      - name: any_id
        description: 'Deterministic representative id (max); only meaningful when n_ids = 1.'

  - name: int_cbs__roster_stints
    description: >
      THE WALK-BACK (MLB-63): continuous rostered intervals per (league_key,
      season_year, franchise_id, name_key), assembled from the normalized
      UI-transaction moves as a last-event-wins state machine -- acquisitions
      (add, trade_in) open, departures (drop, derived trade_out for the
      sending side) close, and the year-end roster anchor closes what the
      log leaves open. Openings the log never carries (drafts were never
      logged) are recovered implicitly: anchored players with no in-season
      acquisition, and departure-first players, get synthetic season-start
      openings. 19,992 stints across 2001-2025; the year-end anchor
      audit reads 99.9% -- its only exceptions are the 9
      anchor_reopen_needed rows (the log's last word was a departure the
      anchor contradicts). The log is nearly COMPLETE on departures:
      8,473 drops close their stints (the 2026-07-13 pairing fix --
      lead() must window over both event kinds before the acquisition
      filter) and only 22 true missing_departure cases remain across 25
      years. Two arbitration rules keep it honest: anchor-refuted final
      trade legs are VOIDED (the mirror-pair class -- vetoed/reversed
      swaps the report still renders; genuine rentals never match), and
      generational suffixes normalize in cbs_name_key (the roster report
      drops Jr/IV where the transaction report keeps it -- the 2023
      Vlad Jr split). The effective view's next-acquisition truncation
      bounds the true-missing residue.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - league_key
              - season_year
              - franchise_id
              - name_key
              - stint_index
    columns:
      - name: league_key
        tests:
          - not_null
      - name: season_year
        description: 'League season, 2001-2025.'
        tests:
          - not_null
      - name: franchise_id
        description: 'CBS franchise id (the /teams/{id} space), resolved per-season by the UI-standings name map.'
        tests:
          - not_null
      - name: name_key
        description: 'cbs_name_key() of the player name -- the walk-back keys by NAME (anchors carry no ids).'
        tests:
          - not_null
      - name: stint_index
        description: 'Ordinal of this stint within the (season, franchise, player) group -- players can leave and return.'
      - name: stint_start
        description: 'First rostered day (acquisition effective date, or the synthetic season-start opening).'
        tests:
          - not_null
      - name: stint_end
        description: 'Last observed day: departure effective date, or the season-end anchor date for open stints.'
      - name: open_channel
        description: 'How the stint opened: add | trade_in | opening (the recovered season-start opening) | lineup_opening (Law 2a: the player-season''s first event anywhere is a lineup move -- rostered since the log opened) | lineup_evidence (Law 2b: a lineup event while the membership machine said OFF -- a log-missed re-acquisition, reopened at the evidence date).'
      - name: close_type
        description: 'How it closed: drop | trade_out | season_end.'
      - name: on_year_end_anchor
        description: 'The (season, franchise, player) appears on the year-end roster anchor.'
      - name: missing_departure
        description: 'Anchored era (2003+), the stint runs to season_end but the player is NOT on the anchor: the log genuinely missed the departure. Rare -- 22 cases across 25 years after the pairing fix, anchor-arbitrated trade voids, and suffix normalization. The effective view truncates these at the player''s next acquisition elsewhere.'
      - name: anchor_reopen_needed
        description: 'The anchor shows the player but the log''s last word was a departure -- a missed re-acquisition, surfaced not invented.'
      - name: no_anchor_era
        description: '2001-2002: no roster-report pages exist, so no year-end anchor closes the season -- membership rides the log alone (the report card grades these honestly).'
      - name: is_ambiguous_name
        description: 'The name resolves to >1 mlbam that played this season (dim_player_identity.is_ambiguous) -- genuine homonyms (Will Smith, the three Luis Garcias); the attribution fact keeps the name-join + discipline tie-break for these.'
      - name: resolved_cbs_player_id
        description: 'The CBS id when the name is unambiguous; NULL otherwise (kept as the ambiguity-diff reference; superseded for the join path by mlbam_id).'
      - name: mlbam_id
        description: 'MLB-81 identity spine: the mlbam this season''s name form resolves to (dim_player_identity), NULL when ambiguous/uncandidated. The join key the attribution fact uses id-first, falling back to name_key only where NULL.'
      - name: stat_group_scope
        description: 'hitting | pitching | NULL. From the resolver: a two-way split entry carries its discipline; a unified entry (or single-discipline player) is NULL = matches either at the seam guard.'

  - name: int_cbs__roster_stints_effective
    description: >
      Attribution-ready stint windows: int_cbs__roster_stints with the
      end-exclusive arithmetic applied. CBS effective-date semantics make a
      departure DAY belong to the receiving side (drop/trade_out effective
      6/15 = out of the lineup 6/15), while season_end closes stay inclusive
      (+1 day). Single-rostering is then enforced by truncation:
      attribution_end_exclusive caps at the player's next acquisition
      anywhere in the league (a player is on one roster at a time), which
      also bounds the rare true-missing_departure class (22 across 25
      years).
    columns:
      - name: base_end_exclusive
        description: 'stint_end for drop/trade_out closes (departure day excluded), stint_end + 1 for season_end closes (anchor day included).'
      - name: next_acquisition_start
        description: 'The player''s next stint_start anywhere in the league that season (lead over name_key).'
      - name: attribution_end_exclusive
        description: 'least(base_end_exclusive, next_acquisition_start) -- the window the attribution fact actually joins on.'
      - name: was_truncated
        description: 'The next acquisition cut this stint short (a missed departure made concrete).'

  - name: int_cbs__lineup_intervals
    description: >
      Daily active/reserve state for the lineup-log eras (2001-2003, 2021+),
      as [state_start, state_end_exclusive) intervals per (league_key,
      season_year, franchise_id, name_key) -- activate/reserve/slot events
      ordered last-event-wins (same-day by report row order). Law 2 (Kyle
      2026-07-14): slot_move events are STATE OBSERVATIONS, not mere
      repositioning -- to_slot sets the state after the boundary and
      from_slot directly observes the state before it (every censused slot
      token is an active lineup slot; bench/IL exits ride Activate/
      Reserve). Includes THE BACKWARD HALF: the state before a player's
      first lineup event -- a first slot_move's from_slot observes it
      directly (prior_direct); a first activate/reserve implies the
      INVERSE of what it sets (prior_inverse: a first 'Benched' proves
      they were active until then). Without the backward half,
      set-and-forget starters have no events and the forward walk alone
      zeroes them out (the first report card's -30%..-99% modern-era
      failure). Players with NO lineup events at all take their year-end
      anchor status downstream (anchor_hold). 2004-2020 lineup moves were
      never logged by CBS; those years ride the start-share estimator
      instead.
    columns:
      - name: mlbam_id
        description: 'MLB-81: the event''s resolved mlbam (dim_player_identity). The interval timeline is derived at (franchise, mlbam, scope) grain so two era name-forms of one player merge into one A/RS timeline; NULL falls back to name_key.'
      - name: stat_group_scope
        description: 'hitting | pitching | NULL -- keeps a two-way player''s two disciplines as separate interval streams.'
      - name: state_start
        description: 'First day the state holds (0001-01-01 for the backward prior-inverse interval).'
        tests:
          - not_null
      - name: state_end_exclusive
        description: 'Day the NEXT event takes over (9999-12-31 for the last interval).'
      - name: state
        description: 'A (active) or RS (reserve).'
        tests:
          - accepted_values:
              arguments:
                values: ['A', 'RS']
      - name: state_source
        description: 'lineup_event (a logged move set this state), prior_inverse (backward half, inferred as the inverse of a first activate/reserve), or prior_direct (backward half, OBSERVED by a first slot_move''s from_slot).'
        tests:
          - accepted_values:
              arguments:
                values: ['lineup_event', 'prior_inverse', 'prior_direct']
