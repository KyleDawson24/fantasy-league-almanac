version: 2

models:
  - name: int_player_daily
    description: >
      Wide daily row per (league, season, scoring_period, team, player, lineup_slot).
      Combines per-stat point contributions (one column per scored stat) with per-player ESPN platform totals.
      View materialization; the table cost lives at the weekly layer one level up.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - league_key
              - season_year
              - scoring_period
              - team_id
              - player_id
              - lineup_slot
    columns:
      - name: league_key
        description: 'League registry key. Carried from staging; the stg_scoring_settings weight join is league-scoped so each league''s points_per_unit applies only to its own rows.'
        tests:
          - not_null
      - name: season_year
        description: 'ESPN season year.'
        tests:
          - not_null
      - name: scoring_period
        description: 'Daily ESPN scoring period number. Starts at 1 on league opening day.'
        tests:
          - not_null
      - name: matchup_period
        description: 'The weekly matchup period this scoring period belongs to. Functionally determined by (season_year, scoring_period) via matchup_schedule.'
      - name: team_id
        description: 'ESPN stable numeric team identifier. NULL for free agents.'
      - name: player_id
        description: 'ESPN stable numeric player identifier.'
        tests:
          - not_null
      - name: lineup_slot
        description: 'Slot the player occupied on this scoring_period (1B/SP/BE/FA/etc.). Part of the grain because a player can appear in multiple slots within a matchup_period.'
        tests:
          - not_null
      - name: lineup_slot_category
        description: '"hitting" / "pitching" / "inactive". Derived from lineup_slot at stg_box_scores.'
      - name: is_active_slot
        description: 'true when lineup_slot_category != "inactive". Convenience flag for downstream active/inactive fact splits.'
      - name: display_name
        description: 'Nickname-resolved player name (COALESCE(nickname, player_name)).'
      - name: position
        description: 'Player MLB position as reported by ESPN.'
      - name: pro_team
        description: 'Player MLB team abbreviation as reported by ESPN.'
      - name: eligible_slots
        description: 'VARIANT array of fantasy lineup slots the player is eligible to fill. Carried from stg_box_scores so per-day consumer queries can pull this without reaching into staging.'
      - name: platform_points
        description: 'ESPN platform total for this player on this scoring_period. From stg_box_scores; reflects commissioner adjustments and ESPN W/L authority.'
      - name: total_stat_pts
        description: 'Sum of stat_points across ALL scored stats (catch-all rollup; robust to future seed additions). Equivalent to calculated_points at this daily grain.'
      - name: total_hitting_stat_pts
        description: 'Sum of stat_points for hitting-category stats.'
      - name: total_pitching_stat_pts
        description: 'Sum of stat_points for pitching-category stats.'
      - name: negative_points
        description: >
          Magnitude (unsigned positive) of net-negative platform_points on this day: GREATEST(0, -platform_points).
          Per-day platform-level metric -- each negative day counts separately, even if the week-level platform total is net positive.
          Weekly rollup is SUM(negative_points). For a player with one -5 day and net-positive week: daily row has 5, weekly rollup = 5.

  - name: int_cbs__player_game_points
    description: >
      The MLB-62 recompute: per-game calculated_ fantasy points for the CBS
      league -- universal per-game stats (stg_mlb__player_game) priced by
      the league's own rules (stg_cbs__scoring_settings) on CBS player
      identity (stg_cbs__mlbam_crosswalk). The only per-game-capable scoring
      lens (CBS serves no per-game FPTS); the substrate for the record book
      and, when membership lands (MLB-63), the active-only slicing. One row
      per (league_key, player, discipline-line, game): a pre-2022 pitcher's
      two-discipline game is two rows, each priced by its own group's
      categories; Ohtani routes to 900/901 via the crosswalk's
      stat_group_scope. QS derived per start (started AND outs>=18 AND
      er<=3); IRSTR derived as ir - irs; INN paid at out-granularity via
      the settings translation. Crosswalk INNER join = the population gate
      (drops pre-collision-fix orphan gamelogs). league_key fans from the
      settings; current weights price all seasons.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - league_key
              - cbs_player_id
              - stat_group
              - game_pk
              - game_date
              - game_index
    columns:
      - name: league_key
        description: 'League registry key, fanned from stg_cbs__scoring_settings -- each league prices the shared baseball layer with its own rules.'
        tests:
          - not_null
      - name: cbs_player_id
        description: 'CBS player id (two-way pseudo-ids 900/901 land as separate players per MLB-68).'
        tests:
          - not_null
      - name: cbs_player_name
        description: 'CBS player name, discipline-suffixed for the two-way pseudo-ids.'
      - name: mlbam_id
        description: 'The universal-layer player key behind this row.'
        tests:
          - not_null
      - name: season_year
        description: 'MLB season year.'
        tests:
          - not_null
      - name: stat_group
        description: 'Discipline of this game line (hitting | pitching). Batting categories price hitting rows, pitching categories pitching rows -- enforced by the per-group stat map.'
        tests:
          - not_null
      - name: game_date
        description: 'Game date.'
        tests:
          - not_null
      - name: game_pk
        description: 'MLB game id (doubleheader legs distinct; one known same-date partial-line pair shares one, split by game_index).'
        tests:
          - not_null
      - name: calculated_fpts
        description: 'The game''s total calculated_ fantasy points under current CBS rules. calculated_hitting_pts + calculated_pitching_pts.'
        tests:
          - not_null
      - name: calculated_hitting_pts
        description: 'Batting-category contribution (R/RBI/BB/SB/TB at +1).'
      - name: calculated_pitching_pts
        description: 'Pitching-category contribution (W/S/HD/CG/QS/outs/IRSTR/K/HA/BBI/ER).'
      - name: outs
        description: 'Outs recorded -- the INN category at its true pay granularity (1 pt/out). There is deliberately no innings column; thirds notation stays out of the engine.'
      - name: qs
        description: 'Derived quality start flag: games_started_pitching = 1 AND outs >= 18 AND earned runs <= 3.'
      - name: irstr
        description: 'Derived inherited runners stranded: ir - irs (statsapi has no direct strand key; CBS''s own direct IRSTR key exists only at season grain and anchors reconciliation instead).'
      - name: gs
        description: 'Games started (pitching) -- QS derivation context, unpriced.'
      - name: ir
        description: 'Inherited runners -- IRSTR derivation context, unpriced.'
      - name: irs
        description: 'Inherited runners scored -- IRSTR derivation context, unpriced.'
      - name: nh
        description: 'Derived no-hitter flag: complete game, zero hits allowed, outs >= 27 (official individual no-hitters only). Unscored; feeds the record book. There is deliberately NO perfect-game flag -- battersFaced = outs means "faced the minimum" (erased baserunners), not "nobody reached," and the erasure events that separate the two are invisible in a pitcher''s aggregate line; 3 of the archive''s 4 minimum-faced no-hitters would be false perfectos.'

  - name: int_cbs__player_season_stats
    description: >
      Player-season stats on the CALCULATED_ lens, LONG form and
      stat_name-bridged: one row per (league_key, cbs_player_id, season_year,
      stat_name) -- the record book's stats source, complete for every
      crosswalked player (the universal-sourced sibling of the free-agent-only
      stg_cbs__player_season_stats, which anchors reconciliation instead).
      Three row families: bridged counting stats (stg_mlb__player_game
      canonicals summed and translated to ESPN stat_names; games_played
      hitting-group-scoped -- the ESPN G is games-by-batters, and the scope
      keeps a batting pitcher's season from double-counting), exact derived
      shapes (1B = H-2B-3B-HR, XBH = 2B+3B+HR), and engine rows
      (QS/IRSTR/NH season counts + CALCULATED_POINTS and its
      hitting/pitching splits from int_cbs__player_game_points; PG
      deliberately absent -- underivable from this feed). Seasons
      floored to the LEAGUE ERA (data-driven: the UI-history standings'
      first season, 2001; platform-archive min as fallback); interim
      TOTAL lens until MLB-63 membership scopes it; early-era population
      coverage rides the MLB-63 UI-history crosswalk (year-end-roster
      names), so never-anchored pass-throughs are absent.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - league_key
              - cbs_player_id
              - season_year
              - stat_name
    columns:
      - name: league_key
        description: 'League registry key, fanned from the scoring settings / engine.'
        tests:
          - not_null
      - name: cbs_player_id
        description: 'CBS player id (two-way pseudo-ids 900/901 as separate players, MLB-68).'
        tests:
          - not_null
      - name: cbs_player_name
        description: 'CBS player name, discipline-suffixed for the two-way pseudo-ids.'
      - name: season_year
        description: 'MLB season year, within the league era (2001+, the UI-history standings floor).'
        tests:
          - not_null
      - name: stat_name
        description: 'ESPN-namespace stat name (the dim_stat bridge) plus the engine rows (QS, IRSTR, NH, CALCULATED_POINTS, CALCULATED_HITTING_PTS, CALCULATED_PITCHING_PTS).'
        tests:
          - not_null
      - name: stat_category
        description: 'hitting | pitching | general | total.'
      - name: stat_value
        description: 'The season value (counting sum, derived count, or calculated points).'
        tests:
          - not_null

  # ------------------------------------------------------------------
  # MLB-63 walk-back chain: name identity -> membership stints ->
  # effective (attribution-ready) windows -> daily lineup state. The
  # per-game attribution fact (marts/core) joins the chain to the
  # priced engine; mart_team_points_reconciliation grades the whole
  # reconstruction against the official standings.
  # ------------------------------------------------------------------

  - name: int_cbs__player_name_ids
    description: >
      The name -> CBS-player-id dictionary, built ONLY from the league's own
      id-bearing rows (modern UI transactions, 2026 daily rosters, the
      archive crosswalk): one row per (league_key, name_key), where name_key
      is the shared cbs_name_key() normalization every walk-back join speaks.
      n_ids > 1 marks a name genuinely shared by multiple CBS ids (the Will
      Smith / Luis Garcia class) -- downstream flags ambiguity and never
      guesses; n_ids = 1 yields resolved identity via any_id.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - league_key
              - name_key
    columns:
      - name: league_key
        tests:
          - not_null
      - name: name_key
        description: 'cbs_name_key() of the display name: periods stripped, packed POS+TEAM tokens stripped, Last-First flipped, lowered, whitespace-collapsed. Two-way (Batter)/(Pitcher) suffixes survive by design.'
        tests:
          - not_null
      - name: cbs_player_ids
        description: 'All distinct CBS ids observed under this name (array).'
      - name: n_ids
        description: 'Count of distinct ids; > 1 = ambiguous name, flagged downstream.'
        tests:
          - not_null
      - name: any_id
        description: 'Deterministic representative id (max); only meaningful when n_ids = 1.'

  - name: int_cbs__roster_stints
    description: >
      THE WALK-BACK (MLB-63): continuous rostered intervals per (league_key,
      season_year, franchise_id, name_key), assembled from the normalized
      UI-transaction moves as a last-event-wins state machine -- acquisitions
      (add, trade_in) open, departures (drop, derived trade_out for the
      sending side) close, and the year-end roster anchor closes what the
      log leaves open. Openings the log never carries (drafts were never
      logged) are recovered implicitly: anchored players with no in-season
      acquisition, and departure-first players, get synthetic season-start
      openings. 19,992 stints across 2001-2025; the year-end anchor
      audit reads 99.9% -- its only exceptions are the 9
      anchor_reopen_needed rows (the log's last word was a departure the
      anchor contradicts). The log is nearly COMPLETE on departures:
      8,473 drops close their stints (the 2026-07-13 pairing fix --
      lead() must window over both event kinds before the acquisition
      filter) and only 22 true missing_departure cases remain across 25
      years. Two arbitration rules keep it honest: anchor-refuted final
      trade legs are VOIDED (the mirror-pair class -- vetoed/reversed
      swaps the report still renders; genuine rentals never match), and
      generational suffixes normalize in cbs_name_key (the roster report
      drops Jr/IV where the transaction report keeps it -- the 2023
      Vlad Jr split). The effective view's next-acquisition truncation
      bounds the true-missing residue.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - league_key
              - season_year
              - franchise_id
              - name_key
              - stint_index
    columns:
      - name: league_key
        tests:
          - not_null
      - name: season_year
        description: 'League season, 2001-2025.'
        tests:
          - not_null
      - name: franchise_id
        description: 'CBS franchise id (the /teams/{id} space), resolved per-season by the UI-standings name map.'
        tests:
          - not_null
      - name: name_key
        description: 'cbs_name_key() of the player name -- the walk-back keys by NAME (anchors carry no ids).'
        tests:
          - not_null
      - name: stint_index
        description: 'Ordinal of this stint within the (season, franchise, player) group -- players can leave and return.'
      - name: stint_start
        description: 'First rostered day (acquisition effective date, or the synthetic season-start opening).'
        tests:
          - not_null
      - name: stint_end
        description: 'Last observed day: departure effective date, or the season-end anchor date for open stints.'
      - name: open_channel
        description: 'How the stint opened: add | trade_in | season_start (the recovered opening).'
      - name: close_type
        description: 'How it closed: drop | trade_out | season_end.'
      - name: on_year_end_anchor
        description: 'The (season, franchise, player) appears on the year-end roster anchor.'
      - name: missing_departure
        description: 'Anchored era (2003+), the stint runs to season_end but the player is NOT on the anchor: the log genuinely missed the departure. Rare -- 22 cases across 25 years after the pairing fix, anchor-arbitrated trade voids, and suffix normalization. The effective view truncates these at the player''s next acquisition elsewhere.'
      - name: anchor_reopen_needed
        description: 'The anchor shows the player but the log''s last word was a departure -- a missed re-acquisition, surfaced not invented.'
      - name: no_anchor_era
        description: '2001-2002: no roster-report pages exist, so no year-end anchor closes the season -- membership rides the log alone (the report card grades these honestly).'
      - name: is_ambiguous_name
        description: 'The name maps to multiple CBS ids (int_cbs__player_name_ids.n_ids > 1).'
      - name: resolved_cbs_player_id
        description: 'The CBS id when the name is unambiguous; NULL otherwise.'

  - name: int_cbs__roster_stints_effective
    description: >
      Attribution-ready stint windows: int_cbs__roster_stints with the
      end-exclusive arithmetic applied. CBS effective-date semantics make a
      departure DAY belong to the receiving side (drop/trade_out effective
      6/15 = out of the lineup 6/15), while season_end closes stay inclusive
      (+1 day). Single-rostering is then enforced by truncation:
      attribution_end_exclusive caps at the player's next acquisition
      anywhere in the league (a player is on one roster at a time), which
      also bounds the rare true-missing_departure class (22 across 25
      years).
    columns:
      - name: base_end_exclusive
        description: 'stint_end for drop/trade_out closes (departure day excluded), stint_end + 1 for season_end closes (anchor day included).'
      - name: next_acquisition_start
        description: 'The player''s next stint_start anywhere in the league that season (lead over name_key).'
      - name: attribution_end_exclusive
        description: 'least(base_end_exclusive, next_acquisition_start) -- the window the attribution fact actually joins on.'
      - name: was_truncated
        description: 'The next acquisition cut this stint short (a missed departure made concrete).'

  - name: int_cbs__lineup_intervals
    description: >
      Daily active/reserve state for the lineup-log eras (2001-2003, 2021+),
      as [state_start, state_end_exclusive) intervals per (league_key,
      season_year, franchise_id, name_key) -- activate/reserve/slot events
      ordered last-event-wins (same-day by report row order). Includes THE
      BACKWARD HALF: the state before a player's first lineup event is the
      INVERSE of what that event sets (a first 'Benched' proves they were
      active until then) -- without it, set-and-forget starters have no
      events and the forward walk alone zeroes them out (the first report
      card's -30%..-99% modern-era failure). Players with NO lineup events
      at all take their year-end anchor status downstream (anchor_hold).
      2004-2020 lineup moves were never logged by CBS; those years ride the
      start-share estimator instead.
    columns:
      - name: state_start
        description: 'First day the state holds (0001-01-01 for the backward prior-inverse interval).'
        tests:
          - not_null
      - name: state_end_exclusive
        description: 'Day the NEXT event takes over (9999-12-31 for the last interval).'
      - name: state
        description: 'A (active) or RS (reserve).'
        tests:
          - accepted_values:
              arguments:
                values: ['A', 'RS']
      - name: state_source
        description: 'lineup_event (a logged move set this state) or prior_inverse (the backward half).'
        tests:
          - accepted_values:
              arguments:
                values: ['lineup_event', 'prior_inverse']
