version: 2

models:
  - name: int_player_weekly_performance
    description: >
      Wide pivot of counting stats AND per-stat point contributions from int_player_daily.
      Surfaces both stat_value (h, ab, hr, ...) and stat_points (h_pts, ab_pts, hr_pts, ...) for each counting stat.
      Also rolls up per-day platform totals and negative_points to the matchup_period grain.
      lineup_slot preserved as a grain dimension so the fact layer can filter by slot and aggregate slot dimension away post-filter.
      A player who occupied multiple slots within a matchup_period produces multiple rows here.
      Rates are computed at the fact layer because meaningful rates require the slot filter applied first.
      Grain: (season_year, matchup_period, team_id, player_id, lineup_slot).
    columns:
      - name: season_year
        description: 'ESPN season year.'
      - name: matchup_period
        description: 'ESPN matchup period number.'
      - name: team_id
        description: 'ESPN stable numeric team identifier.'
      - name: team_name
        description: 'ESPN fantasy team name.'
      - name: team_abbrev
        description: 'Owner-set short code for the fantasy team.'
      - name: owner_name
        description: 'Team owner display name.'
      - name: player_id
        description: 'ESPN stable numeric player identifier.'
      - name: player_name
        description: 'Player full name as reported by ESPN.'
      - name: lineup_slot
        description: 'Fantasy lineup slot. Preserved as grain dimension; downstream facts filter and collapse.'
      - name: h
        description: 'Hits (sum across scoring periods within this slot).'
      - name: ab
        description: 'At bats.'
      - name: b_bb
        description: 'Batter walks.'
      - name: b_so
        description: 'Batter strikeouts.'
      - name: hbp
        description: 'Hit by pitch.'
      - name: sf
        description: 'Sacrifice flies.'
      - name: hr
        description: 'Home runs.'
      - name: r
        description: 'Runs.'
      - name: rbi
        description: 'Runs batted in.'
      - name: sb
        description: 'Stolen bases.'
      - name: cs
        description: 'Caught stealing.'
      - name: tb
        description: 'Total bases.'
      - name: singles
        description: 'Singles (1B in seed).'
      - name: doubles
        description: 'Doubles (2B in seed).'
      - name: triples
        description: 'Triples (3B in seed).'
      - name: xbh
        description: 'Extra-base hits.'
      - name: w
        description: 'Pitcher wins.'
      - name: l
        description: 'Pitcher losses.'
      - name: k
        description: 'Pitcher strikeouts.'
      - name: er
        description: 'Earned runs allowed.'
      - name: outs
        description: 'Outs recorded. Innings pitched = outs / 3.'
      - name: qs
        description: 'Quality starts.'
      - name: sv
        description: 'Saves.'
      - name: hld
        description: 'Holds.'
      - name: p_h
        description: 'Hits allowed.'
      - name: p_bb
        description: 'Walks allowed.'
      - name: p_hr
        description: 'Home runs allowed.'
      - name: p_r
        description: 'Runs allowed.'
      - name: cg
        description: 'Complete games.'
      - name: blk
        description: 'Balks.'
      - name: wp
        description: 'Wild pitches.'

  - name: int_player_daily
    description: >
      Wide daily row per (season, scoring_period, team, player, lineup_slot).
      Combines per-stat point contributions (one column per scored stat) with per-player ESPN platform totals.
      View materialization; the table cost lives at the weekly layer one level up.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - season_year
            - scoring_period
            - team_id
            - player_id
            - lineup_slot
    columns:
      - name: season_year
        description: 'ESPN season year.'
        tests:
          - not_null
      - name: scoring_period
        description: 'Daily ESPN scoring period number. Starts at 1 on league opening day.'
        tests:
          - not_null
      - name: matchup_period
        description: 'The weekly matchup period this scoring period belongs to. Functionally determined by (season_year, scoring_period) via matchup_schedule.'
      - name: team_id
        description: 'ESPN stable numeric team identifier. NULL for free agents.'
      - name: player_id
        description: 'ESPN stable numeric player identifier.'
        tests:
          - not_null
      - name: lineup_slot
        description: 'Slot the player occupied on this scoring_period (1B/SP/BE/FA/etc.). Part of the grain because a player can appear in multiple slots within a matchup_period.'
        tests:
          - not_null
      - name: lineup_slot_category
        description: '"hitting" / "pitching" / "inactive". Derived from lineup_slot at stg_box_scores.'
      - name: is_active_slot
        description: 'true when lineup_slot_category != "inactive". Convenience flag for downstream active/inactive fact splits.'
      - name: display_name
        description: 'Nickname-resolved player name (COALESCE(nickname, player_name)).'
      - name: position
        description: 'Player MLB position as reported by ESPN.'
      - name: pro_team
        description: 'Player MLB team abbreviation as reported by ESPN.'
      - name: eligible_slots
        description: 'VARIANT array of fantasy lineup slots the player is eligible to fill. Carried from stg_box_scores so per-day consumer queries can pull this without reaching into staging.'
      - name: platform_points
        description: 'ESPN platform total for this player on this scoring_period. From stg_box_scores; reflects commissioner adjustments and ESPN W/L authority.'
      - name: total_stat_pts
        description: 'Sum of stat_points across ALL scored stats (catch-all rollup; robust to future seed additions). Equivalent to calculated_points at this daily grain.'
      - name: total_hitting_stat_pts
        description: 'Sum of stat_points for hitting-category stats.'
      - name: total_pitching_stat_pts
        description: 'Sum of stat_points for pitching-category stats.'
      - name: negative_points
        description: >
          Magnitude (unsigned positive) of net-negative platform_points on this day: GREATEST(0, -platform_points).
          Per-day platform-level metric -- each negative day counts separately, even if the week-level platform total is net positive.
          Weekly rollup is SUM(negative_points). For a player with one -5 day and net-positive week: daily row has 5, weekly rollup = 5.
