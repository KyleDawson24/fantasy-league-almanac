  - name: fct_roster_stints
    description: >
      MLB-16/17. One row per contiguous window a player spent on a single
      fantasy team (a "stint"), tagged with how it OPENED (acquisition channel)
      and CLOSED (departure type). The platform-neutral spine of the
      acquisition-channel reporting and, later, player-profile acquisition
      stories. CBS transaction data feeds the same shape once stg_cbs__-
      transactions lands.

      Membership (the WHEN) is the DENSE lineup shell stg_box_scores -- a row
      for every rostered player every scoring period, bench and IL included --
      so gaps-and-islands over a per-league dense period index cuts stints
      correctly (an unloaded All-Star gap doesn't split a continuous stint; a
      real off-roster gap does). The transaction log (stg_transactions) supplies
      the directed 224/244 TRADE edges, the only thing roster state can't tell
      apart from a same-window drop+add. Draft/keeper attribution joins
      stg_draft on (player, team) for opening-day stints.

      Scope: only (league, season) pairs that have a transaction log -- a
      season without one would silently label every team->team move FA_ADD.
      ESPN = current season only for now (prior seasons aren't reachable via
      leagueHistory's topics filter).

      Known edges (immaterial): a handful of opening-day players drafted by a
      DIFFERENT team than they open on (draft-day shuffle) fall to FA_ADD;
      a same-direction round-trip trade could in principle reuse a directed
      edge. Both are rare and documented rather than special-cased.

      Materialization: table (window-heavy; a stable spine for the mart).
      Grain: one row per (league_key, season_year, player_id, stint_index).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - league_key
              - season_year
              - player_id
              - stint_index
    columns:
      - name: league_key
        description: 'League registry key.'
        tests:
          - not_null
      - name: season_year
        description: 'Season the stint belongs to.'
        tests:
          - not_null
      - name: player_id
        description: 'ESPN stable numeric player identifier.'
        tests:
          - not_null
      - name: stint_index
        description: '1-based ordinal of this stint within the player''s season timeline (a re-acquisition opens a fresh stint, so the same team can appear under two stint_index values).'
        tests:
          - not_null
      - name: team_id
        description: 'The fantasy team the player was rostered on for this stint.'
        tests:
          - not_null
      - name: stint_start_period
        description: 'First scoring period of the stint (rostered).'
      - name: stint_end_period
        description: 'Last scoring period of the stint (rostered).'
      - name: stint_start_idx
        description: 'Dense per-league period index of the stint start (contiguity/adjacency math).'
      - name: stint_end_idx
        description: 'Dense per-league period index of the stint end.'
      - name: rostered_days
        description: 'Count of scoring periods the player was rostered during the stint (bench/IL included).'
      - name: opened_at_season_start
        description: 'True when the stint begins on the first loaded period (the opening-day roster) -- the draft/keeper reconciliation point.'
      - name: open_at_season_end
        description: 'True when the stint is still active at the latest loaded period (never closed).'
      - name: open_channel
        description: 'How the player arrived on this team for this stint: KEEPER / DRAFT (opening-day roster, per stg_draft keeper flag), TRADE (direct handoff from another team backed by a 224/244 trade edge), or FA_ADD (arrived from free agency, or an unbacked team->team handoff == drop+add).'
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['KEEPER', 'DRAFT', 'TRADE', 'FA_ADD']
      - name: close_type
        description: 'How the player left this team: TRADED_AWAY (direct handoff to another team backed by a trade edge), DROPPED (left to free agency or an unbacked handoff), or NULL while still rostered at the latest loaded period.'
        tests:
          - accepted_values:
              arguments:
                values: ['TRADED_AWAY', 'DROPPED']

  - name: fct_cbs_player_game_attribution
    description: >
      THE HISTORIC ACTIVE LENS (MLB-63): every priced player-game
      (int_cbs__player_game_points) attributed to the franchise that
      rostered the player that day, with the day's active-state weight and
      a PER-ROW provenance flag saying how we know -- captured (2026 daily
      roster captures), reconstructed_day (walk-back membership AND
      lineup-log state, 2001-2003 / 2021-2025), estimated_startshare
      (2004-2020: membership from the walk-back, weight from the player's
      global Start%/Own% conditional estimator off ANY of that season's
      year-end anchors -- the rates are player-season stats, not franchise
      stats, so a mid-season stint borrows the ratio the player finished
      the season with elsewhere), or estimated_membership (membership
      confirmed, activity unknowable -- the player sits on NO year-end
      anchor that season, the dropped-and-gone / season-ending-injury
      class -- weight NULL). The interactive surface filters on provenance; the
      Sheets almanac uses everything and explains. FA games don't exist
      here by construction; ambiguity and inferred ends ride as flags,
      never silent guesses. One attribution per game row is guaranteed:
      an ambiguous name matching two teams' stints resolves
      position-aware (anchored position vs the game's discipline), then
      most-recent-stint, with losers surfaced via attribution_contested.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - league_key
              - cbs_player_id
              - stat_group
              - game_pk
              - game_date
              - game_index
    columns:
      - name: league_key
        tests:
          - not_null
      - name: cbs_player_id
        description: "CBS player id; synthetic 'ui-only-<mlbam>' ids carry the UI-history population (players the archive universe never held -- no real CBS id exists anywhere; the prefix marks identity provenance, not data source -- ALL historic rows use UI-captured data)."
        tests:
          - not_null
      - name: cbs_player_name
        description: 'Display name; the walk-back join keys on its cbs_name_key().'
      - name: mlbam_id
        description: 'MLBAM id from the crosswalk -- the universal stats spine key.'
      - name: season_year
        tests:
          - not_null
      - name: stat_group
        description: 'hitting | pitching -- the engine grain leg (two-way players carry both).'
      - name: game_date
        tests:
          - not_null
      - name: game_pk
        description: 'MLB Stats API game id.'
      - name: game_index
        description: 'Disambiguates doubleheader legs sharing a date.'
      - name: franchise_id
        description: 'The attributed franchise (per-season name map for reconstructed rows; team_id for captured rows).'
        tests:
          - not_null
      - name: team_name
        description: 'Captured-era team name; NULL on reconstructed rows (join dim at read time).'
      - name: provenance
        description: "Kyle's per-row fidelity rule: captured | reconstructed_day | estimated_startshare | estimated_membership."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['captured', 'reconstructed_day', 'estimated_startshare', 'estimated_adjacent', 'estimated_membership', 'sentinel']
      - name: state_source
        description: 'Which mechanism produced the active state: captured | lineup_event | prior_inverse | prior_direct (a first slot_move''s from_slot, observed not inferred) | anchor_hold | startshare; NULL when unknowable (estimated_membership).'
        tests:
          - accepted_values:
              arguments:
                values: ['captured', 'lineup_event', 'prior_inverse', 'prior_direct', 'anchor_hold', 'startshare', 'adjacent', 'sentinel']
      - name: is_active
        description: 'Boolean where the day''s state is KNOWN; NULL where estimated or unknowable.'
      - name: active_weight
        description: 'The scoring weight: 1/0 where known, the start-share estimator in 2004-2020, NULL where unknowable. Team-season sums of fpts x weight are what the reconciliation mart grades.'
      - name: is_ambiguous_name
        description: 'The name maps to multiple CBS ids -- attribution resolved position-aware, flagged not guessed.'
      - name: membership_end_inferred
        description: 'The stint end was truncated (next acquisition) or the departure record is missing -- membership beyond the log''s word.'
      - name: attribution_contested
        description: 'Multiple stints matched this game before the tie-break.'
      - name: calculated_fpts
        description: 'The game''s priced value under current CBS rules (calculated_ lens).'
      - name: calculated_hitting_pts
        description: 'Hitting-side split of calculated_fpts.'
      - name: calculated_pitching_pts
        description: 'Pitching-side split of calculated_fpts.'
