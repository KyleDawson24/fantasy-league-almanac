version: 2

# Core layer: the star-schema contract surface -- dimensions + facts.
# Everything here is a stable relation consumers (reporting marts and the
# Python output scripts) can rely on. Consumer-facing report shapes live
# in ../reporting.

models:
  - name: dim_stat
    description: >
      Consumer-facing dimension for stat metadata. Thin view over the
      stat_classification seed; gives output scripts and external
      readers a stable contract layer independent of the seed's
      internal schema.

      Adds vs. the seed: leaderboard_name (seed_name post SEED_TO_
      LEADERBOARD translation -- '1B' -> 'SINGLES', '30' -> 'CYC',
      '64' -> 'SHO', etc.). All other seed columns pass through.

      Materialized as view. Python consumers reach this dim via
      output/stat_catalog.py's @lru_cache helpers (one fetch per
      script process). mart_stat_leaderboard's compile-time UNPIVOT
      loop also reads this dim (run_query over leaderboard_name), so
      the seed-to-leaderboard translation lives in exactly one place.
    columns:
      - name: stat_name
        description: 'Seed-side primary key. Matches the breakdown VARIANT key.'
        tests:
          - not_null
          - unique
      - name: leaderboard_name
        description: >
          Consumer-facing leaderboard column name. Equals stat_name for
          most stats; translated for the small set whose seed name differs
          from the leaderboard column name (1B/2B/3B singles/doubles/triples,
          30 cycles, 64 shutouts).
        tests:
          - not_null
          - unique
      - name: espn_stat_id
        description: 'ESPN numeric stat ID. NULL for derived stats / score totals.'
      - name: stat_category
        description: '''hitting'' | ''pitching'' | ''fielding'' | ''unknown'' | ''total''.'
        tests:
          - accepted_values:
              arguments:
                values: ['hitting', 'pitching', 'fielding', 'unknown', 'total']
      - name: espn_stat_label
        description: 'ESPN''s English label. Traceability metadata; consumers prefer display_name/abbrev.'
      - name: display_name
        description: 'Project-owned display label. Read via stat_catalog.get_display_map().'
      - name: abbrev
        description: 'Compact display form. Read via stat_catalog.get_abbrev_map().'
      - name: is_counting
        description: 'True for stats with a wide column on int_player_daily that propagate as SUM rollups.'
      - name: is_derived
        description: 'True for stats computed from other counting stats via derivation_expr.'
      - name: derivation_expr
        description: 'SQL expression for derived stats (e.g., "ab + b_bb + hbp + sf" for PA).'
      - name: auto_tracked
        description: 'Bypasses the polarity rule at team grain for stats tracked regardless of league scoring settings.'
      - name: is_record_candidate
        description: 'True if the stat appears in mart_stat_leaderboard. Drives the Jinja UNPIVOT loop.'
      - name: polarity
        description: '''positive'' | ''negative'' | ''neutral''. Drives consumer-side Best/Worst labeling.'
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['positive', 'negative', 'neutral']
      - name: qualifier_stat
        description: 'v1.1.1: name of the denominator column (e.g. ''ab'', ''outs'') used as a min-volume gate for rate-stat records. NULL on every non-rate stat.'
      - name: qualifier_min
        description: 'v1.1.1: minimum value of qualifier_stat below which the rate doesn''t qualify as a record. mart_stat_leaderboard skips the threshold filter when this is NULL. Examples: 225 AB for hitting rate stats, 150 outs (= 50 IP) for pitching rate stats.'
      - name: notes
        description: 'Free-text context for unusual rows.'

  - name: dim_matchup_period
    description: >
      Consumer-facing dimension for matchup-period calendar metadata.
      Thin view over the matchup_schedule seed; gives output scripts
      and external readers a stable contract layer.

      v1.1.0 DAG cleanup. Calendar-automation work (roadmapped) will
      replace the hand-maintained seed with an extract-driven raw
      table plus a thin overrides seed; once that lands, this dim
      re-points at the new sources without consumer changes.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - season_year
              - matchup_period
    columns:
      - name: season_year
        description: 'MLB season year.'
        tests:
          - not_null
      - name: matchup_period
        description: 'ESPN weekly matchup number (1-indexed).'
        tests:
          - not_null
      - name: start_date
        description: 'First MLB scoring period day in this matchup_period.'
      - name: end_date
        description: 'Last MLB scoring period day in this matchup_period.'
      - name: is_abnormal
        description: 'Excluded from records (All-Star break, weather-shortened weeks, etc.).'
        tests:
          - not_null
      - name: abnormal_reason
        description: 'Free-text explanation when is_abnormal=true.'
      - name: is_playoff
        description: 'True for playoff weeks. Drives playoff_round substitution in format_week_label().'
        tests:
          - not_null
      - name: playoff_round
        description: '"Round 1" / "Semi-Finals" / "Finals" when is_playoff=true; NULL otherwise.'

  - name: dim_roster_slot_counts
    description: >
      Consumer-facing dimension for roster slot settings. One row per
      ESPN lineup slot in the latest rosterSettings snapshot for each
      season. Starter counts come from rosterSettings.lineupSlotCounts;
      maximums come from rosterSettings.positionLimits where ESPN exposes
      a direct primary-position limit. Flex and roster-management slots
      surface maximum_display='N/A'; raw -1 limits surface as 'No Limit'.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - league_key
              - season_year
              - lineup_slot_id
    columns:
      - name: league_key
        description: 'League registry key. Roster settings are per-league configuration.'
        tests:
          - not_null
      - name: season_year
        description: 'ESPN season year.'
        tests:
          - not_null
      - name: lineup_slot_id
        description: 'ESPN lineup slot ID used by box score rows.'
        tests:
          - not_null
      - name: lineup_slot
        description: 'Human-readable lineup slot label (C, 1B, SP, BE, IL, etc.).'
        tests:
          - not_null
      - name: starter_count
        description: 'Configured number of starters for this lineup slot.'
        tests:
          - not_null
      - name: position_limit_id
        description: 'ESPN primary-position ID used for maximum roster limits, when directly applicable.'
      - name: raw_position_limit
        description: 'Raw ESPN position limit value. -1 means No Limit; NULL means not applicable.'
      - name: maximum_count
        description: 'Numeric maximum when the slot has a finite max; NULL for No Limit or N/A.'
      - name: maximum_type
        description: '''limited'', ''no_limit'', or ''not_applicable''.'
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['limited', 'no_limit', 'not_applicable']
      - name: maximum_display
        description: 'UI-friendly maximum label: numeric string, No Limit, or N/A.'
        tests:
          - not_null
      - name: is_active_lineup_slot
        description: 'True when starter_count > 0 and the slot is not BE or IL.'
        tests:
          - not_null
      - name: sort_order
        description: 'Stable roster display ordering.'
        tests:
          - not_null

  - name: dim_owner
    description: >
      Owner dimension. One row per (league_key, owner_id), spined off
      stg_team_owners (every owner ever seen) LEFT JOIN the
      owner_nicknames seed for an optional preferred_name override.
      owner_display = preferred_name when set, else "First Last".
      Owner ids are platform-issued and league-scoped; cross-league
      identity stitching is MLB-8's job, not this dim's.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - league_key
              - owner_id
    columns:
      - name: league_key
        description: 'League registry key. Part of the grain.'
        tests:
          - not_null
      - name: owner_id
        description: 'Platform-stable owner key (ESPN member GUID). Grain key together with league_key.'
        tests:
          - not_null
      - name: owner_display
        description: 'Nickname if set, else proper-cased "First Last".'
        tests:
          - not_null

  - name: dim_team_owner
    description: >
      (league, season, team) -> owner_display label. Collapses co-owned
      teams to "Name / Name". Single join point consumers/marts use to
      attach owner_display alongside owner_name.

      Born as int_team_owner_display; renamed when it moved to core.
      Four marts and the almanac's Matchup History tab all join through
      it, which makes it a contract-layer dimension rather than a
      transient join surface.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - league_key
              - season_year
              - team_id
    columns:
      - name: league_key
        tests:
          - not_null
      - name: owner_display
        tests:
          - not_null

  - name: fct_player_daily_performance
    description: >
      Comprehensive player-daily performance fact. Thin view over
      int_player_daily that adds two grain-defining status columns
      (performance_status, wasted_bucket) so weekly facts and per-day
      consumers can inherit them from one canonical derivation.

      The "comprehensive" framing: every slot, every roster status,
      the real-world MLB stat line with fantasy roster context
      attached. Active vs. inactive splits happen at the weekly fact
      layer downstream.

      v1.1.0 DAG cleanup. Output scripts that previously reached into
      int_player_daily for per-day metadata (get_wasted_points'
      pro_team / position / eligible_slots snapshot, league_notes
      callouts for HR streaks / no_negative_days / SP-start counts)
      should re-point at this fact in a follow-on commit.

      MLB-72: serves both leagues (int_player_daily unions the CBS
      day-grain branch). CBS rows add lineup_slot codes RS/EST, the
      'estimated' performance_status, and the union-layer passthroughs
      (player_key, game_date, active_weight, provenance); ESPN-visible
      values are byte-identical to the pre-union fact.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - league_key
              - season_year
              - scoring_period
              - team_id
              - player_key
              - lineup_slot
    columns:
      - name: league_key
        description: 'League registry key (config/leagues.yml). First-class dimension in every fact grain per the MLB-48 multi-league design.'
        tests:
          - not_null
      - name: season_year
        tests:
          - not_null
      - name: scoring_period
        tests:
          - not_null
      - name: player_id
        description: 'Numeric player id. NULL on CBS ui-only synthetic identities; player_key is the grain column.'
      - name: player_key
        description: 'Cross-league player identity (MLB-72), the grain column. See int_player_daily.'
        tests:
          - not_null
      - name: lineup_slot
        tests:
          - not_null
      - name: performance_status
        description: '''active'' (lineup_slot NOT IN BE/IL/FA/RS), ''inactive'' (BE/IL/FA/RS), or ''estimated'' (CBS 2004-2020 estimated-state days -- consumers weight by active_weight instead of the binary lens).'
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['active', 'inactive', 'estimated']
      - name: wasted_bucket
        description: '''FA'' (free agent), ''ROSTERED_INACTIVE'' (BE/IL, CBS RS), or NULL (active / estimated). Categorizes the flavors of inactive.'
        tests:
          - accepted_values:
              arguments:
                values: ['FA', 'ROSTERED_INACTIVE']
              config:
                where: "wasted_bucket is not null"
      - name: is_active_slot
        description: 'Boolean equivalent of performance_status = ''active''. NULL on CBS estimated-era rows. Retained for backward compatibility.'
      - name: game_date
        description: 'Real calendar date (CBS rows); NULL on ESPN rows whose day identity is scoring_period.'
      - name: active_weight
        description: 'The day''s scoring weight: 1/0 where state is known, the start-share estimator on CBS estimated days, NULL where activity is unknowable.'
      - name: provenance
        description: 'captured / reconstructed_day / estimated_startshare / estimated_membership -- how the day''s roster state is known.'
      - name: platform_points
        description: 'ESPN per-player per-day total. NULL for FA rows in some edge cases and on all CBS rows (CBS serves no per-day platform totals -- platform_ is a season-grain anchor there).'
      - name: negative_points
        description: 'Magnitude (positive) of net-negative points on this day (platform lens for ESPN, calculated for CBS). Zero when the day is non-negative.'

  - name: fct_player_weekly_slot_performance
    description: >
      Comprehensive player-weekly performance fact. Aggregates from
      fct_player_daily_performance to weekly grain while preserving
      lineup_slot so the downstream active/inactive splits can filter
      cleanly.

      GRAIN: one row per (league_key, season_year, matchup_period,
      team_id, player_id, lineup_slot). The _slot_ in the name marks the grain --
      a player who occupied multiple slots within a single
      matchup_period produces multiple rows here. Deliberate: the
      downstream active/inactive facts filter by slot before aggregating
      the slot dimension away, which is only possible if the slot is
      preserved here.

      v1.1.0 DAG cleanup: this model was previously
      int_player_weekly_performance (intermediate-layer view). Promoted
      to mart-layer fact because it represents a legitimate analytical
      surface in its own right -- the comprehensive weekly stat line
      with fantasy roster context, before the active/inactive lens is
      applied. Now sources from fct_player_daily_performance so the
      daily-to-weekly DAG edge is real (rather than a side branch off
      int_player_daily).

      performance_status and wasted_bucket are inherited from
      fct_player_daily_performance via GROUP BY -- they're functionally
      dependent on lineup_slot which is already in the grouping key.

      Materialization: table. Two downstream facts (active, inactive)
      read from this for every mart_stat_leaderboard query; materialization
      avoids re-aggregating ~600K daily rows on each consumer query.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - league_key
              - season_year
              - matchup_period
              - team_id
              - player_id
              - lineup_slot
    columns:
      - name: league_key
        description: 'League registry key. Part of the grain.'
        tests:
          - not_null
      - name: season_year
        tests:
          - not_null
      - name: matchup_period
        tests:
          - not_null
      - name: player_id
        tests:
          - not_null
      - name: lineup_slot
        description: 'Fantasy lineup slot. Part of the grain.'
        tests:
          - not_null
      - name: performance_status
        description: '''active'' or ''inactive''. Inherited from fct_player_daily_performance.'
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['active', 'inactive']
      - name: wasted_bucket
        description: '''FA'', ''ROSTERED_INACTIVE'', or NULL. Inherited from fct_player_daily_performance.'
      - name: games_played
        description: 'MLB games played by this player in this matchup_period and lineup_slot, summed up from int_player_daily (where DH days carry games_played=2). Added v1.1.1 so fct_player_season_performance can roll it up to season grain.'

  - name: fct_player_weekly_active_performance
    description: >
      Wide-format player-weekly convergence fact for ACTIVE-slot performance (lineup_slot NOT IN BE/IL/FA).
      The consumer-facing entity for "what did this player do this week" -- counting stats, per-stat point contributions, rate stats, and fantasy scoring totals all in one row per player per matchup.
      See fct_player_weekly_inactive_performance for the symmetric inactive counterpart.

      Pipeline: read fct_player_weekly_slot_performance (the v1.1.0 comprehensive weekly fact), filter to active rows via performance_status, aggregate across slots, compute rates via shared macros, sum *_pts into calculated_* totals. LEFT JOIN dim_matchup_period for schedule attributes denormalized onto fact rows.
      Incremental fact -- merge by unique_key (per-league watermark).
      Grain: (league_key, season_year, matchup_period, team_id, player_id).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - league_key
              - season_year
              - matchup_period
              - team_id
              - player_id
    columns:
      - name: league_key
        description: 'League registry key. Part of the grain and the incremental merge key.'
        tests:
          - not_null
      - name: season_year
        description: 'ESPN season year.'
        tests:
          - not_null
      - name: matchup_period
        description: 'ESPN matchup period number.'
        tests:
          - not_null
      - name: team_id
        description: 'ESPN stable numeric team identifier.'
        tests:
          - not_null
      - name: team_name
        description: 'ESPN fantasy team name.'
      - name: team_abbrev
        description: 'Owner-set short code for the fantasy team. Surfaced for compact team labels in output callouts (e.g., "Player (SMEL), 37.3 pts -- ...").'
      - name: owner_name
        description: 'Team owner display name.'
      - name: player_id
        description: 'ESPN stable numeric player identifier.'
        tests:
          - not_null
      - name: player_name
        description: 'Player full name as reported by ESPN.'
      - name: display_name
        description: 'COALESCE(nickname, player_name). Used by the output script for contributor callouts.'
      - name: h
        description: '{{ doc("stat_h") }}'
      - name: ab
        description: '{{ doc("stat_ab") }}'
      - name: b_bb
        description: '{{ doc("stat_b_bb") }}'
      - name: b_so
        description: '{{ doc("stat_b_so") }}'
      - name: hbp
        description: '{{ doc("stat_hbp") }}'
      - name: sf
        description: '{{ doc("stat_sf") }}'
      - name: hr
        description: '{{ doc("stat_hr") }}'
      - name: r
        description: '{{ doc("stat_r") }}'
      - name: rbi
        description: '{{ doc("stat_rbi") }}'
      - name: sb
        description: '{{ doc("stat_sb") }}'
      - name: cs
        description: '{{ doc("stat_cs") }}'
      - name: tb
        description: '{{ doc("stat_tb") }}'
      - name: singles
        description: '{{ doc("stat_singles") }}'
      - name: doubles
        description: '{{ doc("stat_doubles") }}'
      - name: triples
        description: '{{ doc("stat_triples") }}'
      - name: xbh
        description: '{{ doc("stat_xbh") }}'
      - name: w
        description: '{{ doc("stat_w") }}'
      - name: l
        description: '{{ doc("stat_l") }}'
      - name: k
        description: '{{ doc("stat_k") }}'
      - name: er
        description: '{{ doc("stat_er") }}'
      - name: outs
        description: '{{ doc("stat_outs") }}'
      - name: qs
        description: '{{ doc("stat_qs") }}'
      - name: sv
        description: '{{ doc("stat_sv") }}'
      - name: hld
        description: '{{ doc("stat_hld") }}'
      - name: p_h
        description: '{{ doc("stat_p_h") }}'
      - name: p_bb
        description: '{{ doc("stat_p_bb") }}'
      - name: p_hr
        description: '{{ doc("stat_p_hr") }}'
      - name: p_r
        description: '{{ doc("stat_p_r") }}'
      - name: cg
        description: '{{ doc("stat_cg") }}'
      - name: blk
        description: '{{ doc("stat_blk") }}'
      - name: wp
        description: '{{ doc("stat_wp") }}'
      - name: avg
        description: 'Batting average (H / AB). NULL when AB = 0.'
      - name: obp
        description: 'On-base percentage. NULL when denominator = 0.'
      - name: slg
        description: 'Slugging percentage (TB / AB). NULL when AB = 0.'
      - name: ops
        description: 'On-base plus slugging.'
      - name: era
        description: 'Earned run average. NULL when OUTS = 0.'
      - name: whip
        description: 'Walks + hits per inning pitched.'
      - name: k_per_9
        description: 'Strikeouts per 9 innings.'
      - name: k_per_bb
        description: 'Strikeout-to-walk ratio.'
      - name: platform_points
        description: 'Platform-computed fantasy total points. Sum of platform_hitting_pts + platform_pitching_pts. The official ESPN-computed value; the arbiter for W/L outcomes.'
      - name: platform_hitting_pts
        description: 'Platform-computed fantasy points from hitting lineup slots.'
      - name: platform_pitching_pts
        description: 'Platform-computed fantasy points from pitching lineup slots.'
      - name: negative_points
        description: >
          Magnitude (unsigned positive) of net-negative platform_points contributed across the matchup_period.
          Per-day platform-level rollup -- each negative scoring period counts separately, so a player with one bad day plus several positive ones still carries the bad day's magnitude here even if the week-level total is net positive.
          Available as a data-layer artifact for gross-negative analysis; the recap surface uses a different (week-net) calculation.

      # Per-stat point contributions
      - name: h_pts
        description: '{{ doc("stat_h_pts") }}'
      - name: ab_pts
        description: '{{ doc("stat_ab_pts") }}'
      - name: b_bb_pts
        description: '{{ doc("stat_b_bb_pts") }}'
      - name: b_so_pts
        description: '{{ doc("stat_b_so_pts") }}'
      - name: hbp_pts
        description: '{{ doc("stat_hbp_pts") }}'
      - name: sf_pts
        description: '{{ doc("stat_sf_pts") }}'
      - name: hr_pts
        description: '{{ doc("stat_hr_pts") }}'
      - name: r_pts
        description: '{{ doc("stat_r_pts") }}'
      - name: rbi_pts
        description: '{{ doc("stat_rbi_pts") }}'
      - name: sb_pts
        description: '{{ doc("stat_sb_pts") }}'
      - name: cs_pts
        description: '{{ doc("stat_cs_pts") }}'
      - name: tb_pts
        description: '{{ doc("stat_tb_pts") }}'
      - name: singles_pts
        description: '{{ doc("stat_singles_pts") }}'
      - name: doubles_pts
        description: '{{ doc("stat_doubles_pts") }}'
      - name: triples_pts
        description: '{{ doc("stat_triples_pts") }}'
      - name: xbh_pts
        description: '{{ doc("stat_xbh_pts") }}'
      - name: w_pts
        description: '{{ doc("stat_w_pts") }}'
      - name: l_pts
        description: '{{ doc("stat_l_pts") }}'
      - name: k_pts
        description: '{{ doc("stat_k_pts") }}'
      - name: er_pts
        description: '{{ doc("stat_er_pts") }}'
      - name: outs_pts
        description: '{{ doc("stat_outs_pts") }}'
      - name: qs_pts
        description: '{{ doc("stat_qs_pts") }}'
      - name: sv_pts
        description: '{{ doc("stat_sv_pts") }}'
      - name: hld_pts
        description: '{{ doc("stat_hld_pts") }}'
      - name: p_h_pts
        description: '{{ doc("stat_p_h_pts") }}'
      - name: p_bb_pts
        description: '{{ doc("stat_p_bb_pts") }}'
      - name: p_hr_pts
        description: '{{ doc("stat_p_hr_pts") }}'
      - name: p_r_pts
        description: '{{ doc("stat_p_r_pts") }}'
      - name: cg_pts
        description: '{{ doc("stat_cg_pts") }}'
      - name: blk_pts
        description: '{{ doc("stat_blk_pts") }}'
      - name: wp_pts
        description: '{{ doc("stat_wp_pts") }}'

      # Calculated scoring totals (current-season weights applied). calculated_*
      # are rounded 1 decimal at player grain for display; total_*_stat_pts are
      # the UNROUNDED sources the team fact sums-then-rounds ONCE at team grain
      # (avoids the sum-of-rounds drift fixed in the round-once team-total work).
      - name: total_hitting_stat_pts
        description: 'UNROUNDED sum of all hitting *_pts. Source for calculated_hitting_pts; exposed so fct_team_weekly_active_performance rounds once at team grain rather than summing per-player-rounded values.'
      - name: total_pitching_stat_pts
        description: 'UNROUNDED sum of all pitching *_pts. Source for calculated_pitching_pts; see total_hitting_stat_pts.'
      - name: total_stat_pts
        description: 'UNROUNDED sum of all *_pts (hitting + pitching). Source for calculated_points; rounded once at team grain in the team fact.'
      - name: calculated_hitting_pts
        description: 'Sum of all hitting *_pts columns, rounded 1 decimal. What this player''s hitting line scores under current rules.'
      - name: calculated_pitching_pts
        description: 'Sum of all pitching *_pts columns, rounded 1 decimal. What this player''s pitching line scores under current rules.'
      - name: calculated_points
        description: 'Sum of all *_pts columns, rounded 1 decimal. What this player''s full stat line scores under current rules. For the current season this should closely match platform_points; for historical seasons it normalizes to a common scale.'

  - name: fct_player_weekly_inactive_performance
    description: >
      Wide-format player-weekly fact for INACTIVE-slot performance (lineup_slot IN BE/IL/FA).
      Symmetric counterpart to fct_player_weekly_active_performance; together they cover the full universe of player-weeks at fct_player_weekly_slot_performance.

      Grain: (league_key, season_year, matchup_period, player_id, wasted_bucket).
      wasted_bucket is part of the grain so a player who appears as ROSTERED_INACTIVE on team A AND as FA in the same matchup_period (rare: drop mid-week) gets two distinct rows.

      Carries counting + per-stat *_pts + calculated_* totals + player rate stats (informational).
      NO platform_* columns -- inactive contributions don't roll up to a team's ESPN home_score, so the symmetry with the active fact stops there.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - league_key
              - season_year
              - matchup_period
              - player_id
              - wasted_bucket
    columns:
      - name: league_key
        description: 'League registry key. Part of the grain and the incremental merge key.'
        tests:
          - not_null
      - name: season_year
        description: 'ESPN season year.'
        tests:
          - not_null
      - name: matchup_period
        description: 'Weekly matchup period.'
        tests:
          - not_null
      - name: team_id
        description: 'ESPN team identifier. NULL for the FA bucket (free agents have no fantasy team); set for the ROSTERED_INACTIVE bucket.'
      - name: player_id
        description: 'ESPN player identifier.'
        tests:
          - not_null
      - name: wasted_bucket
        description: '"FA" or "ROSTERED_INACTIVE". Grain dim distinguishing free agents from benched/IL players.'
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['FA', 'ROSTERED_INACTIVE']
      - name: calculated_points
        description: 'Rules-normalized total points the player would have produced if started. For inactive players, this is the "unrealized point production" / wasted-points concept.'
