  - name: fct_team_weekly_inactive_performance
    description: >
      Team-grain rollup of inactive (BE/IL/FA) player performance.
      Symmetric counterpart to fct_team_weekly_active_performance for the inactive half of the player-weekly split.

      Two row flavors per (season_year, matchup_period):
        - N ROSTERED_INACTIVE rows (one per fantasy team; team_id set)
        - 1 FA row (league-wide; team_id NULL). The FA pool is not attributable to any single team.

      Carries counting + per-stat *_pts + calculated_* totals + the wasted_bucket dim + inactive_player_count.

      DOES NOT carry platform_points (no ESPN home_score equivalent for "the team's bench"), platform_hitting_pts / platform_pitching_pts (omitted as not-yet-needed at bench-team grain; the underlying split is now stat-contribution-based at int_player_daily and categorizes bench pitchers correctly, so they could be surfaced if a consumer needs them), or team rates (bench IP isn't pitched -- rate semantics break).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - league_key
              - season_year
              - matchup_period
              - team_id
              - wasted_bucket
    columns:
      - name: league_key
        description: 'League registry key. Part of the grain.'
        tests:
          - not_null
      - name: season_year
        description: 'ESPN season year.'
        tests:
          - not_null
      - name: matchup_period
        description: 'Weekly matchup period.'
        tests:
          - not_null
      - name: team_id
        description: 'ESPN team identifier. NULL for the FA pool row (league-wide aggregate); set for ROSTERED_INACTIVE rows.'
      - name: wasted_bucket
        description: '"FA" or "ROSTERED_INACTIVE". Grain dim distinguishing the league-wide free-agent pool from per-team bench/IL waste.'
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['FA', 'ROSTERED_INACTIVE']
      - name: calculated_points
        description: 'Rules-normalized total of unrealized point production by inactive players (ROSTERED_INACTIVE: team-level bench/IL waste; FA: league-wide free-agent production unclaimed by any team).'
      - name: inactive_player_count
        description: 'Distinct players contributing to this bucket. Diagnostic for "how thin was this bench."'
      - name: negative_points
        description: 'Team rollup of inactive-player negative_points across the matchup_period.'

  - name: fct_player_season_performance
    description: >
      v1.1.1 foundational brick of the player profile layer. Season-grain
      counterpart to fct_player_weekly_slot_performance: collapses
      matchup_period while preserving the (season, team, player, slot)
      decomposition.

      Grain: one row per (league_key, season_year, team_id, player_id, lineup_slot).
      team_id is nullable -- NULL rows represent FA time (lineup_slot 'FA'
      pairs with NULL team_id by construction).

      Slot-bearing all-slots design (mirrors fct_player_weekly_slot_performance,
      not the active-only spinoff): rows for active slots carry stat
      contributions credited to a fantasy team; rows for BE/IL/FA carry
      player MLB production NOT credited to a fantasy team that day.
      performance_status and wasted_bucket inherit the partition cleanly.

      Per BRAINTHOUGHTS [ARCH] "the player profile is an assembly of
      bricks, not a mega-model": this is brick #1. Stays pure baseball
      performance (counting stats sliced by team/season/slot; no rates,
      since rates cannot be summed across grains). Future bricks join in
      independently -- dim_player for identity/bio/eligibility, a
      transactions model for acquisition history (needs new extract),
      and a callout-counts model.

      Consumer rollups are plain GROUP BY collapses:
      player career = GROUP BY player_id;
      player career-by-team = GROUP BY player_id, team_id;
      player season = GROUP BY player_id, season_year;
      player season-by-team = GROUP BY player_id, season_year, team_id.
      Matchup-grain questions go to fct_player_weekly_slot_performance (already
      at that grain).

      Active vs inactive vs total framings are consumer-side filters:
      total IRL production has no filter; rostered production filters
      team_id IS NOT NULL; fantasy-credited filters performance_status =
      'active'; per-team filters team_id = X (FA naturally absent).

      Display fields (team_name, team_abbrev, owner_name, player_name,
      display_name) are NOT grain keys. They're helpers selected as the
      value from the most recent matchup_period within the (season,
      entity) partition -- owners and team names can shift mid-season;
      latest-in-season reads naturally for downstream display.

      Materialization: table. Small rollup (~30K rows), but frozen per
      build: as a view, every consumer query re-summed float points in a
      nondeterministic order, so .x5-boundary values could flip between
      reads with no data change. Same determinism reasoning as
      fct_player_position_pts.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - league_key
              - season_year
              - team_id
              - player_id
              - lineup_slot
    columns:
      - name: league_key
        description: 'League registry key. Part of the grain.'
        tests:
          - not_null
      - name: season_year
        description: 'Season year. Part of the grain.'
        tests:
          - not_null
      - name: team_id
        description: 'Fantasy team_id while the player was rostered to a team. NULL when the player was a FA during a given lineup_slot row (lineup_slot = ''FA'').'
      - name: player_id
        description: 'ESPN player_id. Part of the grain.'
        tests:
          - not_null
      - name: lineup_slot
        description: 'Fantasy lineup slot. Part of the grain. Active slots (C/1B/2B/3B/SS/IF/LF/CF/RF/OF/DH/UTIL/SP*/RP*/P) reflect fantasy-credited production; BE/IL/FA reflect MLB production that was not credited to a fantasy team that day.'
        tests:
          - not_null
      - name: performance_status
        description: '''active'' or ''inactive''. Functionally dependent on lineup_slot; inherited via GROUP BY from fct_player_weekly_slot_performance.'
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['active', 'inactive']
      - name: wasted_bucket
        description: '''FA'', ''ROSTERED_INACTIVE'', or NULL. Inherited from fct_player_weekly_slot_performance. NULL on active rows (where the wasted-bucket concept doesn''t apply).'
        tests:
          - accepted_values:
              arguments:
                values: ['FA', 'ROSTERED_INACTIVE']
                quote: true
                where: 'wasted_bucket is not null'
      - name: team_name
        description: 'Display helper, not a grain key. Latest-in-season value for this team_id within the row''s season_year. NULL on FA rows.'
      - name: team_abbrev
        description: 'Display helper, not a grain key. Latest-in-season value.'
      - name: owner_name
        description: 'Display helper, not a grain key. Latest-in-season value.'
      - name: player_name
        description: 'Display helper, not a grain key. Latest-in-season value for this player_id within the row''s season_year.'
      - name: display_name
        description: 'Display helper, not a grain key. Nickname-resolved player name; latest-in-season value.'
      - name: calculated_hitting_pts
        description: 'SUM of total_hitting_stat_pts from fct_player_weekly_slot_performance. Catch-all hitting points under current-season scoring rules (cross-season comparable).'
      - name: calculated_pitching_pts
        description: 'SUM of total_pitching_stat_pts.'
      - name: calculated_points
        description: 'SUM of total_stat_pts -- combined hitting + pitching catch-all under current rules.'
      - name: platform_points
        description: 'SUM of player-level platform_points (kona''s appliedTotal). On active rows this is what the player contributed to the fantasy team''s score; on inactive/FA rows it is the player''s MLB-game fantasy points that were not credited to any team that day.'
      - name: platform_hitting_pts
        description: 'SUM of platform_hitting_pts (passthrough from the weekly fact). The hitting share of platform_points, apportioned at int_player_daily by each day''s unfiltered per-category stat contribution -- so a two-way player''s hitting and pitching land in the right buckets instead of the whole day collapsing into one.'
      - name: platform_pitching_pts
        description: 'SUM of platform_pitching_pts (the pitching share; see platform_hitting_pts).'
      - name: negative_points
        description: 'SUM of per-day net-negative platform_points magnitudes; sum semantics aggregate cleanly across days and weeks.'
      - name: games_played
        description: 'SUM of MLB games_played from the weekly fact (where DH days carry games_played=2 upstream). Natural denominator for per-game analysis at season grain.'

  - name: fct_player_position_pts
    description: >
      v1.1.1 (Approach 1 to the eligibility question): per-position points
      accumulation for the get_optimal_team consumer.

      For each (season, matchup_period, team, player) day, the player's
      eligible_slots VARIANT array is exploded; each eligible slot code
      (minus BE / IL, which are roster slots not lineup positions) gets
      attributed the player's position-category-appropriate CALCULATED
      points for that day (total_pitching_stat_pts for SP/RP/P,
      total_hitting_stat_pts otherwise -- the cross-season-normalized
      calculated lens, not platform_points). Points are aggregated to
      matchup-period grain.

      Mental model: "How many points has this player produced while
      eligible at position P, within window W?" The dispatcher fills an
      optimal lineup by picking each lineup slot's best-fitting eligible
      player, where "best-fitting" is by SUM(points) across the window.

      ESPN's eligible_slots already enumerates every fillable slot
      directly (a 1B-eligible player automatically shows IF and UTIL
      eligibility); no per-position derivation needed at this layer.
      Combined codes (CI / MI / P) exist in the data and stay in the
      fact even though this league's roster shape doesn't use them.

      Born as int_player_position_pts; promoted to a core fact once it
      became a declared exposure dependency (the almanac's optimal-team
      selector reads it directly) -- consumer contracts live in core.

      Materialization: table (v1.2). The get_optimal_team selector is
      gap-based and breaks near-equal ties on points rounded to 1
      decimal; as a view, Snowflake re-summed with a slightly different
      float order each query, so a value on a .x5 boundary could flip
      between regens and reshuffle RP picks across team tabs + the Home
      All-League Team. Materializing freezes the rounded points so
      selection is deterministic across regens. Single consumer today
      (the optimal-team dispatcher). Row count ~65K for two seasons.

      Rounding: per-row points rounded to 1 decimal at this layer,
      matching the v1.0.1 fact-layer precedent. Stabilizes downstream
      SUMs against float-summation-order drift.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - league_key
              - season_year
              - matchup_period
              - team_id
              - player_key
              - position
    columns:
      - name: league_key
        description: 'League registry key. Part of the grain.'
        tests:
          - not_null
      - name: season_year
        description: 'Season year. Part of the grain.'
        tests:
          - not_null
      - name: matchup_period
        description: 'Matchup period within the season. Part of the grain on ESPN rows; NULL on CBS rows (no historic period boundaries -- a CBS player-position aggregates to one season-grain row).'
      - name: team_id
        description: 'Fantasy team_id while the player was rostered. NULL for FA-time rows (the player was on the league''s free-agent pool that period). CBS rows are never FA (attribution is rostered-only).'
      - name: player_id
        description: 'Numeric player id. NULL on CBS ui-only synthetic identities; player_key is the grain column (1:1 with player_id on ESPN rows).'
      - name: player_key
        description: 'Cross-league player identity (MLB-72). Part of the grain.'
        tests:
          - not_null
      - name: position
        description: >
          Eligibility code from the player's eligible_slots VARIANT array
          (e.g., '1B', 'OF', 'SP', 'UTIL'). Combined codes like '1B/3B' or
          '2B/SS' appear when ESPN expresses dual-slot eligibility; CBS rows
          emit the CBS vocabulary ({C,1B,2B,3B,SS,OF,DH,P}, date-scoped by
          int_cbs__eligibility_windows). BE and IL are filtered out (roster
          slots, not lineup positions).
        tests:
          - not_null
      - name: player_name
        description: 'Display helper, not a grain key. ESPN-reported player name for this matchup.'
      - name: display_name
        description: 'Display helper, not a grain key. Nickname-resolved player name (COALESCE(nickname, player_name)) from int_player_daily.'
      - name: pro_team
        description: 'Display helper, not a grain key. Player MLB team abbreviation for this matchup.'
      - name: active_pts
        description: >
          SUM of position-category-appropriate CALCULATED points on days the
          player was eligible at this position AND in an active fantasy slot.
          Pitching positions (SP/RP/P) use total_pitching_stat_pts; every other
          position uses total_hitting_stat_pts (the cross-season-normalized
          calculated lens, not platform_points). For single-discipline players
          (~99% of the league) this equals the player's full daily calculated
          total since the "other" component is 0; for two-way players (Shohei)
          each row carries only the discipline he was actually slotted in that
          day, because total_*_stat_pts is slot-validity-filtered upstream --
          so "Shohei-pitcher" and "Shohei-hitter" are day-disjoint and the
          disjoint-stat-categories selector can field both without double-
          counting. A genuine two-way day (pitched AND hit, slotted in one)
          credits only the played slot by design; see the model-level note.
          Rounded to 1 decimal at fact layer.
      - name: inactive_pts
        description: >
          Same construction as active_pts but for inactive-slot days
          (performance_status='inactive' -- BE / IL / FA / CBS RS). Position-
          category-appropriate calculated points (total_*_stat_pts),
          rounded 1 decimal.
      - name: weighted_active_pts
        description: >
          MLB-72 generalization of active_pts across the union:
          SUM(position points * active_weight). ESPN days weight 1/0 by slot
          (identical to active_pts by construction); CBS estimated-era days
          contribute their start-share fraction; NULL-weight days
          (membership confirmed, activity unknown) contribute 0 --
          conservative, and the almanac's provenance note owns the caveat.
          The CBS Best-Lineup axis.
      - name: rostered_pts
        description: >
          Weight-independent total (active + inactive + estimated) --
          everything the player produced while rostered and eligible at
          this position. The CBS bench-ranking axis.
      - name: eligible_days
        description: 'Count of distinct scoring periods (= days) the player was eligible at this position during this matchup period. Useful for per-day rate queries; not strictly required by the optimal-team selector.'

  - name: fct_team_season_performance
    description: >
      Season-grain team performance -- the SHARED, format-modular team-stats
      spine. One row per (league_key, season_year, team_id): a team's full
      regular-season stat line, calculated score lenses, and (where the format
      delivers them) the official W-L record + authoritative platform total.
      Season is the atom; all-time is a GROUP BY rollup over this fact, so the
      same model serves single-season team stats and all-time franchise
      records (MLB-69).

      Format-modularity (MLB-43): the stat rollup is format-AGNOSTIC -- it sums
      fct_player_weekly_active_performance, so any format produces team stats
      once players carry a team_id, no matchups required. The W-L / platform-
      total OVERLAY is format-CONDITIONAL: a LEFT JOIN of the matchup-gated
      team-week fact, populated where the league delivers matchups (H2H, any
      platform) and NULL where it doesn't (points, any platform) -- a
      data-presence toggle, never a platform check. NULL-safe playoff filter
      (not coalesce(is_playoff,false)) keeps the regular season and survives
      the unscoped schedule so a no-schedule league isn't silently dropped.

      Verified against mart_team_season_standings: counting + W-L match
      exactly; calculated points within accumulated rounding (this fact rounds
      once at season grain from the unrounded player totals -- the more-correct
      round-of-sum). Holds ESPN only until the CBS player-performance
      convergence lands (MLB-61 F1 + MLB-62); CBS then flows in unchanged.

      Materialization: table (float score sums; feeds records/almanac goldens).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - league_key
              - season_year
              - team_id
    columns:
      - name: league_key
        description: 'League registry key. First-class grain dimension; consumers filter on it.'
        tests:
          - not_null
      - name: season_year
        description: 'Season year. The atom -- all-time is a rollup over this.'
        tests:
          - not_null
      - name: team_id
        description: 'Stable numeric fantasy team id (rename-proof; the franchise-continuity key).'
        tests:
          - not_null
      - name: team_name
        description: 'Team name from the team''s latest played period (mid-season renames can''t surface stale).'
      - name: team_abbrev
        description: 'Owner-set short team code, latest played period.'
      - name: owner_display
        description: 'Canonical owner label (nickname > proper name), via dim_team_owner. Franchise-continuity join key for all-time rollups.'
      - name: periods_played
        description: 'Distinct scoring/matchup periods this team produced in this season. A normalization denominator; also the shape signal (ESPN ~20 weeks, a points league its scoring periods).'
        tests:
          - not_null
      - name: wins
        description: 'Regular-season wins. FORMAT-CONDITIONAL: populated where the league delivers matchups, NULL for non-H2H (points) leagues of any platform.'
      - name: losses
        description: 'Regular-season losses. NULL for non-H2H leagues (see wins).'
      - name: ties
        description: 'Regular-season ties. NULL for non-H2H leagues (see wins).'
      - name: h
        description: '{{ doc("stat_h") }}'
      - name: ab
        description: '{{ doc("stat_ab") }}'
      - name: b_bb
        description: '{{ doc("stat_b_bb") }}'
      - name: b_so
