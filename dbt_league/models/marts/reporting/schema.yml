      - name: calculated_pitching_pts
        description: 'Season calculated pitching points, rounded once at season grain.'
      - name: calculated_points
        description: 'Season calculated total points, rounded once at season grain.'
      - name: against_calculated_points
        description: 'Points conceded: the opponents'' calculated totals summed across the team''s matchups, rounded once at season grain.'

  - name: mart_team_slot_production
    description: >
      Season-grain lineup-slot production: one row per (season_year,
      team_id, lineup_slot) with the calculated points the team's players
      generated while deployed in that slot -- the slot on the box score,
      not position eligibility. Aggregated from the slot-preserving weekly
      fact (the active convergence fact collapses lineup_slot by design).
      First consumer: the Advanced Standings "Points by Lineup Slot" grid,
      which previously ran this aggregation inline in Python.

      Every deployed slot is kept, including BE / IL, with
      is_active_lineup_slot from dim_roster_slot_counts so consumers choose
      the cut (the v2.0 grid filters to active slots). FA pool rows are
      excluded. Regular season only (is_playoff = false), matching
      mart_team_season_standings so the Advanced Standings blocks describe
      the same universe.

      Materialization: table -- float point sums feed the almanac
      byte-diff goldens.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - league_key
              - season_year
              - team_id
              - lineup_slot
    columns:
      - name: league_key
        description: 'League registry key.'
        tests:
          - not_null
      - name: season_year
        description: 'Season year.'
        tests:
          - not_null
      - name: team_id
        description: 'ESPN stable numeric team identifier. Never NULL -- FA pool rows are excluded.'
        tests:
          - not_null
      - name: lineup_slot
        description: 'Deployed fantasy lineup slot (C/1B/SP/BE/IL/etc.). Part of the grain.'
        tests:
          - not_null
      - name: team_name
        description: 'Team name from the team''s latest played week.'
      - name: team_abbrev
        description: 'Owner-set short team code, latest played week.'
      - name: owner_display
        description: 'Canonical owner label (nickname > proper name) carried from the slot fact.'
      - name: slot_calculated_points
        description: 'Season calculated points (catch-all total across every scored stat) produced while deployed in this slot, rounded once at season grain.'
        tests:
          - not_null
      - name: sort_order
        description: 'Stable display ordering from dim_roster_slot_counts (999 fallback for slots missing from the season''s settings snapshot).'
        tests:
          - not_null
      - name: is_active_lineup_slot
        description: 'True for starting slots (not BE/IL), from dim_roster_slot_counts; false fallback when the slot is missing from the settings snapshot. The v2.0 Advanced Standings grid filters on this.'
        tests:
          - not_null
      - name: starter_count
        description: 'Configured number of starting slots of this type, from dim_roster_slot_counts.'

  - name: mart_period_standings
    description: >
      Period-grain standings arc for POINTS leagues -- the format-conditional
      counterpart to mart_team_season_standings (which is W-L-derived from
      matchups). One row per (league_key, season_year, period, team_id): a
      team's cumulative season-to-date points and rank at the close of each
      scoring period, plus derived movement (points earned that period, rank
      change, distance behind the leader). Read directly from
      stg_cbs__standings -- a delivered-standings feed (F7) needs no daily
      rollup, matchup pairs, or scoring recompute. The almanac home tab's
      standings arc. Platform-neutral: any future points league reuses it,
      filtered by league_key.

      Scope: the CBS API is current-season, so this holds 2026 in-progress
      today; historical seasons (champions 2001-2025) arrive from the parsed
      UI pages (MLB-53) into the same shape. is_latest_period marks the
      current leader, not a crowned champion (2026 is unfinished).

      Materialization: table -- cumulative float points and their window
      deltas re-derive per query in a view (boundary cells could flip between
      reads); same determinism rationale as the other score-sum marts.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - league_key
              - season_year
              - period
              - team_id
    columns:
      - name: league_key
        description: 'League registry key. Consumers filter on it; the leader/behind windows partition within one league.'
        tests:
          - not_null
      - name: season_year
        description: 'MLB season year.'
        tests:
          - not_null
      - name: period
        description: 'CBS scoring-period number (1-indexed).'
        tests:
          - not_null
      - name: team_id
        description: 'CBS stable numeric fantasy-team id.'
        tests:
          - not_null
      - name: team_name
        description: 'Fantasy team name at this period.'
      - name: division_name
        description: 'CBS division label (cosmetic in a points league).'
      - name: standings_rank
        description: 'League-wide rank at the close of this period (1 = first).'
        tests:
          - not_null
      - name: points
        description: 'Cumulative season-to-date fantasy points at this period.'
        tests:
          - not_null
      - name: period_points
        description: 'Points earned in this period alone (cumulative now minus cumulative at the prior period; equals the full cumulative total in period 1).'
        tests:
          - not_null
      - name: rank_change
        description: 'Rank movement since the previous period (positive = climbed). NULL in period 1 (no prior rank).'
      - name: points_behind_leader
        description: 'Cumulative points behind the period leader (0 for the leader).'
        tests:
          - not_null
      - name: is_latest_period
        description: 'True for the most recent captured period this season -- the current standings. For a completed season this is the final standings; for an in-progress season (2026) it is the current leader, not a crowned champion.'
        tests:
          - not_null

  - name: mart_team_alltime
    description: >
      All-time franchise records: one row per (league_key, team_id), rolling
      fct_team_season_performance across every season a franchise played. The
      accumulation axis of the records surface (MLB-69) and the team half of
      the almanac's all-time leaders. Franchise = team_id (stable across
      renames); display name/owner are the latest season, totals span the
      whole lineage. Counting stats sum; rates recompute from the summed
      counting; W-L is NULL for pure points franchises (no H2H seasons).
      Platform-neutral -- any league rolls up here, filtered by league_key.
      Verified: ESPN league-wide all-time wins == losses (closed H2H).
      Materialization: table.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - league_key
              - team_id
    columns:
      - name: league_key
        description: 'League registry key. Consumers filter on it.'
        tests:
          - not_null
      - name: team_id
        description: 'Stable franchise id (the rollup key across seasons/renames).'
        tests:
          - not_null
      - name: team_name
        description: 'Current franchise name (latest season).'
      - name: team_abbrev
        description: 'Current franchise short code (latest season).'
      - name: owner_display
        description: 'Current owner label (latest season), via dim_team_owner.'
      - name: seasons_played
        description: 'Number of seasons this franchise appears in the fact.'
        tests:
          - not_null
      - name: first_season
        description: 'Earliest season played.'
        tests:
          - not_null
      - name: last_season
        description: 'Most recent season played.'
        tests:
          - not_null
      - name: wins
        description: 'All-time regular-season wins. NULL for a franchise with no H2H seasons (pure points).'
      - name: losses
        description: 'All-time regular-season losses. NULL for a pure-points franchise.'
      - name: ties
        description: 'All-time regular-season ties. NULL for a pure-points franchise.'
      - name: hr
        description: '{{ doc("stat_hr") }}'
      - name: r
        description: '{{ doc("stat_r") }}'
      - name: rbi
        description: '{{ doc("stat_rbi") }}'
      - name: sb
        description: '{{ doc("stat_sb") }}'
      - name: tb
        description: '{{ doc("stat_tb") }}'
      - name: k
        description: '{{ doc("stat_k") }}'
      - name: w
        description: '{{ doc("stat_w") }}'
      - name: sv
        description: '{{ doc("stat_sv") }}'
      - name: er
        description: '{{ doc("stat_er") }}'
      - name: outs
        description: '{{ doc("stat_outs") }}'
      - name: calculated_points
        description: 'All-time total points under current-season scoring weights (sum of the season fact''s once-rounded values).'
        tests:
          - not_null
      - name: calculated_hitting_pts
        description: 'All-time hitting points under current rules.'
      - name: calculated_pitching_pts
        description: 'All-time pitching points under current rules.'
      - name: best_season_points
        description: 'The franchise''s highest single-season calculated_points (the peak axis).'
      - name: best_season_year
        description: 'Season in which best_season_points was set.'

  - name: mart_player_season_records
    description: >
      The player-season record book: top-10 single-season performances
      all-time for each record-candidate stat, plus the marquee best-season by
      the platform's own points (PLATFORM_POINTS). The PEAK axis of the
      records reframe (best single period -- a season for a points league);
      accumulation (most all-time) is the sibling, MLB-69. Reuses the shared
      dim_stat catalog for record candidacy / polarity / display -- the payoff
      of the vocabulary bridge (CBS arrives already in ESPN stat_name form).
      "Most" direction (value DESC); rank unique 1..10, ties broken by recency
      (equal stat_value flags a genuine tie). Rates excluded pending qualifier
      handling; two-way sentinels absent (season universes omit them).
      Platform-neutral by shape; fed by CBS today. Materialization: table.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - league_key
              - stat_name
              - rank
    columns:
      - name: league_key
        description: 'League registry key. Consumers filter on it.'
        tests:
          - not_null
      - name: stat_name
        description: 'The stat being ranked (ESPN namespace, from dim_stat).'
        tests:
          - not_null
      - name: display_name
        description: 'Human stat label, from dim_stat.'
      - name: leaderboard_name
        description: 'Leaderboard column name, from dim_stat.'
      - name: polarity
        description: 'positive | negative | neutral, from dim_stat -- so the consumer labels "most" as best (HR) or dubious (ER allowed).'
      - name: stat_category
        description: 'hitting | pitching | fielding | total, from dim_stat.'
      - name: rank
        description: '1..10 within (league_key, stat_name); ties broken by recency.'
        tests:
          - not_null
      - name: player_id
        description: 'CBS player id of the record holder.'
        tests:
          - not_null
      - name: player_name
        description: 'Record holder name.'
      - name: season_year
        description: 'Season the record was set.'
        tests:
          - not_null
      - name: universe
        description: '''hitting'' or ''pitching'' universe the season row came from.'
      - name: stat_value
        description: 'The record value.'
        tests:
          - not_null

  - name: mart_team_acquisition_channels
    description: >
      MLB-17: team production split by acquisition channel and departure type,
      under two lenses. One wide row per team feeds both Advanced Standings
      transaction blocks. ACQUIRED = points a team's players produced for it,
      bucketed by how the player arrived (Keeper / Draft / Trade / FA Add);
      LOST = points departed players produced while off the roster, bucketed by
      how they left (Dropped / Traded Away). The ACTIVE lens counts only started
      production (lost = for other teams only); the ROSTERED lens counts all
      production including bench/IL (lost = other teams AND unowned). Deltas:
      FA delta = FA-add acquired minus dropped lost; Trade delta = trade
      acquired minus traded-away lost (both can go negative). Built over
      fct_roster_stints x fct_player_daily_performance; points rounded once at
      this grain. Reconciles exactly: the four acquired channels sum to the
      team's own active (and rostered) production. Materialization: table.
      Grain: one row per (league_key, season_year, team_id).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - league_key
              - season_year
              - team_id
    columns:
      - name: league_key
        description: 'League registry key.'
        tests:
          - not_null
      - name: season_year
        description: 'Season the acquisition accounting covers.'
        tests:
          - not_null
      - name: team_id
        description: 'ESPN fantasy team id.'
        tests:
          - not_null
      - name: team_name
        description: 'Latest-in-season team name.'
      - name: team_abbrev
        description: 'Latest-in-season team abbreviation.'
      - name: owner_display
        description: 'Owner display name (via dim_team_owner).'
      - name: keeper_active_pts
        description: 'Active points scored for the team by players kept from the prior season.'
      - name: draft_active_pts
        description: 'Active points scored for the team by players it drafted.'
      - name: trade_active_pts
        description: 'Active points scored for the team by players acquired via trade.'
      - name: fa_add_active_pts
        description: 'Active points scored for the team by players added from free agency.'
      - name: acquired_active_pts
        description: 'Total active points the roster produced (sum of the four channels; equals the team''s own active production).'
      - name: dropped_active_pts
        description: 'Active points that dropped players went on to score FOR OTHER TEAMS while off this roster.'
      - name: traded_away_active_pts
        description: 'Active points that traded-away players went on to score for other teams while off this roster.'
      - name: lost_active_pts
        description: 'Total active points forfeited to other teams (dropped + traded away).'
      - name: fa_delta_active_pts
        description: 'FA-add acquired minus dropped lost (active lens). Negative = the drops outproduced the adds elsewhere.'
      - name: trade_delta_active_pts
        description: 'Trade acquired minus traded-away lost (active lens). Negative = gave up more than gained.'
      - name: keeper_rostered_pts
        description: 'All points (active + bench/IL) kept players produced while on the roster.'
      - name: draft_rostered_pts
        description: 'All points drafted players produced while on the roster.'
      - name: trade_rostered_pts
        description: 'All points trade-acquired players produced while on the roster.'
      - name: fa_add_rostered_pts
        description: 'All points FA-added players produced while on the roster.'
      - name: acquired_rostered_pts
        description: 'Total points produced while rostered (sum of the four channels; equals the team''s own rostered production).'
      - name: dropped_rostered_pts
        description: 'All points dropped players produced onward (other teams AND unowned) while off this roster.'
      - name: traded_away_rostered_pts
        description: 'All points traded-away players produced onward while off this roster.'
      - name: lost_rostered_pts
        description: 'Total points forfeited onward (dropped + traded away, rostered lens).'
      - name: fa_delta_rostered_pts
        description: 'FA-add acquired minus dropped lost (rostered lens).'
      - name: trade_delta_rostered_pts
        description: 'Trade acquired minus traded-away lost (rostered lens).'

  - name: mart_player_fpts_reconciliation
    description: >
      The MLB-62 delta report: season-summed calculated_ FPTS (universal
      stats priced by current CBS rules) against the platform_ anchor
      (CBS's own awarded season FPTS). Reconciliation, NOT exact-match --
      the delta is a feature: it surfaces era-rule changes (via
      platform_identity_residual: the platform total vs the platform's own
      stat values priced at current weights) and platform data gaps (via
      drivers: per-category divergence -- the spike's exhibit is Kirby
      Yates 2019, whose CBS feed carries no IRSTR, making calculated_ MORE
      accurate than the platform's own total). One row per (league_key,
      season_year, cbs_player_id, universe); the population is the INNER
      join of both lenses -- the free-agent-only CBS archive x the
      crosswalk -- so currently-rostered players (no platform anchor: the
      pivot's reason) and the Ohtani sentinels (absent from the season
      universes) do not appear. The record book reads the calculated_
      lens, never this mart; this is the QA gate and the almanac's
      asterisk factory.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - league_key
              - season_year
              - cbs_player_id
              - universe
    columns:
      - name: league_key
        description: 'League registry key.'
        tests:
          - not_null
      - name: season_year
        description: 'MLB season year (the archive overlap: 2004-2025).'
        tests:
          - not_null
      - name: cbs_player_id
        description: 'CBS player id.'
        tests:
          - not_null
      - name: player_name
        description: 'Platform-reported name (calculated-side name as fallback).'
      - name: universe
        description: 'Which CBS season universe anchors the row (hitting | pitching), matched to the calculated side''s stat_group -- a pre-2022 pitcher reconciles on his pitching line only; batting production CBS never priced stays out by construction.'
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['hitting', 'pitching']
      - name: games
        description: 'Calculated-side game rows behind the season sum (MLB gamelog appearances in this discipline).'
      - name: calculated_fpts
        description: 'Season sum of per-game calculated_ points (int_cbs__player_game_points).'
        tests:
          - not_null
      - name: platform_fpts
        description: 'CBS''s own awarded season FPTS -- the platform_ anchor.'
        tests:
          - not_null
      - name: fpts_delta
        description: 'calculated_fpts - platform_fpts. The headline divergence; zero means the lenses agree exactly.'
      - name: abs_fpts_delta
        description: 'Magnitude of fpts_delta (the QA sort key).'
      - name: fpts_delta_pct
        description: 'fpts_delta / |platform_fpts| (NULL when the platform total is 0).'
      - name: platform_recomputed_fpts
        description: 'The platform''s own stat values priced at CURRENT weights (universe-scoped).'
      - name: platform_identity_residual
        description: 'platform_fpts - platform_recomputed_fpts. ~0 = the platform total is self-consistent under today''s rules (the 587/587 anchor property), so fpts_delta is stat-VALUE-driven (feed gaps); large = the total was computed under different rules (era-rule detection).'
      - name: drivers
        description: 'Per-category divergence object keyed by CBS category ({calculated, platform, pts_delta}); zero-delta categories omitted. Platform NULLs (untracked categories, e.g. early-year IRSTR) compare as 0 -- exactly the gap this report exists to surface.'
