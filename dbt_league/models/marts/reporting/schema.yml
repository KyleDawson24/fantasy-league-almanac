  - name: mart_team_slot_production
    description: >
      Season-grain lineup-slot production: one row per (season_year,
      team_id, lineup_slot) with the calculated points the team's players
      generated while deployed in that slot -- the slot on the box score,
      not position eligibility. Aggregated from the slot-preserving weekly
      fact (the active convergence fact collapses lineup_slot by design).
      First consumer: the Advanced Standings "Points by Lineup Slot" grid,
      which previously ran this aggregation inline in Python.

      Every deployed slot is kept, including BE / IL, with
      is_active_lineup_slot from dim_roster_slot_counts so consumers choose
      the cut (the v2.0 grid filters to active slots). FA pool rows are
      excluded. Regular season only (is_playoff = false), matching
      mart_team_season_standings so the Advanced Standings blocks describe
      the same universe.

      Materialization: table -- float point sums feed the almanac
      byte-diff goldens.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - season_year
              - team_id
              - lineup_slot
    columns:
      - name: season_year
        description: 'Season year.'
        tests:
          - not_null
      - name: team_id
        description: 'ESPN stable numeric team identifier. Never NULL -- FA pool rows are excluded.'
        tests:
          - not_null
      - name: lineup_slot
        description: 'Deployed fantasy lineup slot (C/1B/SP/BE/IL/etc.). Part of the grain.'
        tests:
          - not_null
      - name: team_name
        description: 'Team name from the team''s latest played week.'
      - name: team_abbrev
        description: 'Owner-set short team code, latest played week.'
      - name: owner_display
        description: 'Canonical owner label (nickname > proper name) carried from the slot fact.'
      - name: slot_calculated_points
        description: 'Season calculated points (catch-all total across every scored stat) produced while deployed in this slot, rounded once at season grain.'
        tests:
          - not_null
      - name: sort_order
        description: 'Stable display ordering from dim_roster_slot_counts (999 fallback for slots missing from the season''s settings snapshot).'
        tests:
          - not_null
      - name: is_active_lineup_slot
        description: 'True for starting slots (not BE/IL), from dim_roster_slot_counts; false fallback when the slot is missing from the settings snapshot. The v2.0 Advanced Standings grid filters on this.'
        tests:
          - not_null
      - name: starter_count
        description: 'Configured number of starting slots of this type, from dim_roster_slot_counts.'
