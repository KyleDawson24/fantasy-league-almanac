  - name: mart_stat_leaderboard
    description: >
      Top-10 leaderboard across team and player grains, for both stat-level (HR, K, RBI, etc.) and score-level columns.
      Both platform_* (ESPN's official tally) and calculated_* (rules-normalized under current weights) score columns are included so consumers can choose which lens to rank by.

      Each (entity_grain, performance_status, stat_name, record_scope, record_direction) partition emits 10 ranked rows, ties broken by recency (newer season, then matchup).
      The top-10 emission is a visibility buffer: consumers display top-5, but the extra 5 ranks let consumer-side tie-collapse logic see whether a tier extends past the display cap (needed for accurate "N teams tied at X" counts when the visible tier saturates).
      Consumers apply polarity filtering downstream (negative-weighted stats only surface 'most'/most-of; positive stats surface both directions).
      Direction values are intentionally direction-agnostic ('most'/'fewest' rather than 'best'/'worst') -- 'most' is best for HR but worst for ER allowed; the polarity filter at the consumer side resolves the mapping.

      Built via a seed-driven Jinja UNPIVOT loop over four source CTEs (team_active, team_inactive, player_active, player_inactive) union-all'd into one combined CTE.
      Snowflake UNPIVOT syntax; porting to DuckDB/BigQuery would require warehouse-specific macro wrapping.
      The performance_status partition ('active' | 'inactive') segregates rankings; consumers default-filter to active.
      wasted_bucket is carried as a column on inactive rows but is not part of the ranking partition.
      View materialization (rankings retroactively mutable; incremental would be fragile).
      Excludes abnormal matchup periods.

      Grain: (entity_grain, performance_status, stat_name, record_scope, record_direction, rank), rank 1..10.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - entity_grain
              - performance_status
              - stat_name
              - record_scope
              - record_direction
              - rank
    columns:
      - name: entity_grain
        description: 'team or player. Determines whether the row is a team-level or player-level record.'
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['team', 'player']
      - name: performance_status
        description: 'active or inactive. Rankings are partitioned by this so active-slot records and bench/IL/FA-slot records do not mingle. Consumers default-filter performance_status = ''active''.'
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['active', 'inactive']
      - name: wasted_bucket
        description: 'NULL for active rows; ''FA'' or ''ROSTERED_INACTIVE'' for inactive rows. Carried as a column on inactive rows for ad-hoc analysis. Not part of the ranking partition.'
      - name: stat_name
        description: 'Column name being ranked. Includes counting stats (H, AB, HR, K, etc.) and score columns (PLATFORM_POINTS, PLATFORM_HITTING_PTS, PLATFORM_PITCHING_PTS, CALCULATED_POINTS, CALCULATED_HITTING_PTS, CALCULATED_PITCHING_PTS). calculated_* lets the records output rank under current-season weights; platform_* is retained for cross-season comparison.'
        tests:
          - not_null
      - name: record_scope
        description: 'all_time (across every loaded season) or current_season (latest season only).'
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['all_time', 'current_season']
      - name: record_direction
        description: >
          'most' (rank by stat_value DESC) or 'fewest' (rank by stat_value ASC).
          Direction-agnostic by design -- the same value ('most') means "best" for HR but "worst" for ER allowed; consumer applies polarity-aware filtering when surfacing records.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['most', 'fewest']
      - name: rank
        description: '1 to 10. Ties broken by recency (newer season_year, then newer matchup_period) in both directions.'
        tests:
          - not_null
      - name: team_abbrev
        description: 'Owner-set short fantasy team code. Carried through for compact callout rendering.'
      - name: season_year
        description: 'Season when this rank was set.'
      - name: matchup_period
        description: 'Matchup period when this rank was set.'
      - name: team_id
        description: 'Team identifier of the rank holder.'
      - name: team_name
        description: 'Team name of the rank holder.'
      - name: owner_name
        description: 'Owner of the team holding this rank.'
      - name: player_id
        description: 'Player identifier (entity_grain = player only; NULL for team rows).'
      - name: player_name
        description: 'Player name (entity_grain = player only; NULL for team rows).'
      - name: display_name
        description: 'Player display name (entity_grain = player only; NULL for team rows).'
      - name: stat_value
        description: 'Numeric value at this rank.'
        tests:
          - not_null

  - name: mart_league_weekly_benchmarks
    description: >
      One row per (season_year, matchup_period) with league-wide
      aggregate score lenses (mean, max, min) plus the percentile rank
      of each mean within league history.

      Powers "hot week / cold week" callouts in the weekly recap and
      similar collective-mood content. Three score lenses: total
      calculated_points, calculated_hitting_pts, calculated_pitching_pts.
      All three use the calculated_* lens (cross-season comparable
      under current-season scoring weights) -- the right lens for
      historical comparison. Platform_* lens not included; cross-season
      comparison under varying historical weights would be misleading.

      Aggregation includes every active-roster team-week (no bye-team
      filter; bye-week teams still rostered players and accrued points).
      Excludes is_abnormal weeks (All-Star break, weather-shortened,
      etc.) to match the convention every other leaderboard CTE uses.

      Percentile uses PERCENT_RANK over the full history. A value of
      0.95 means this week's mean is higher than 95% of weeks the
      league has ever recorded. Consumers typically read it as "Nth
      percentile" via ROUND(pctile * 100, 0).

      Grain: (season_year, matchup_period). View materialization
      (small aggregation, source is already a table).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - season_year
              - matchup_period
    columns:
      - name: season_year
        description: 'Season year.'
        tests:
          - not_null
      - name: matchup_period
        description: 'Matchup period within the season.'
        tests:
          - not_null
      - name: team_count
        description: 'Number of team-weeks aggregated. Constant in normal weeks (= league size); informational guardrail in case the upstream filter ever drops a team unexpectedly.'
        tests:
          - not_null
      - name: total_weeks_in_history
        description: 'Total league-weeks across all loaded seasons (constant per row; denormalized for single-query consumer reads).'
      - name: calculated_points_mean
        description: 'League average calculated total points for this week. Rounded to 1 decimal (matches fact-layer rounding).'
      - name: calculated_points_max
        description: 'Highest calculated_points by any team this week.'
      - name: calculated_points_min
        description: 'Lowest calculated_points by any team this week.'
      - name: calculated_points_pctile
        description: 'PERCENT_RANK of calculated_points_mean across all weeks in league history (0..1). 0.95 = higher than 95% of recorded weeks.'
      - name: calculated_points_rank
        description: 'Absolute RANK of calculated_points_mean across all weeks (DESC, so 1 = highest mean ever). Powers the always-on League This Week summary line. Ties get the same rank (RANK semantics, not DENSE_RANK).'
      - name: calculated_hitting_pts_mean
        description: 'League average calculated hitting points this week. Rounded 1 decimal.'
      - name: calculated_hitting_pts_max
        description: 'Highest calculated_hitting_pts by any team this week.'
      - name: calculated_hitting_pts_min
        description: 'Lowest calculated_hitting_pts by any team this week.'
      - name: calculated_hitting_pts_pctile
        description: 'PERCENT_RANK of calculated_hitting_pts_mean across all weeks in league history.'
      - name: calculated_hitting_pts_rank
        description: 'Absolute RANK of calculated_hitting_pts_mean across all weeks (DESC, so 1 = highest mean ever).'
      - name: calculated_pitching_pts_mean
        description: 'League average calculated pitching points this week. Rounded 1 decimal.'
      - name: calculated_pitching_pts_max
        description: 'Highest calculated_pitching_pts by any team this week.'
      - name: calculated_pitching_pts_min
        description: 'Lowest calculated_pitching_pts by any team this week.'
      - name: calculated_pitching_pts_pctile
        description: 'PERCENT_RANK of calculated_pitching_pts_mean across all weeks in league history.'
      - name: calculated_pitching_pts_rank
        description: 'Absolute RANK of calculated_pitching_pts_mean across all weeks (DESC, so 1 = highest mean ever).'

  - name: fct_weekly_player_inactive_performance
    description: >
      Wide-format player-weekly fact for INACTIVE-slot performance (lineup_slot IN BE/IL/FA).
      Symmetric counterpart to fct_weekly_player_active_performance; together they cover the full universe of player-weeks at int_player_weekly_performance.

      Grain: (season_year, matchup_period, player_id, wasted_bucket).
      wasted_bucket is part of the grain so a player who appears as ROSTERED_INACTIVE on team A AND as FA in the same matchup_period (rare: drop mid-week) gets two distinct rows.

      Carries counting + per-stat *_pts + calculated_* totals + player rate stats (informational).
      NO platform_* columns -- inactive contributions don't roll up to a team's ESPN home_score, so the symmetry with the active fact stops there.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - season_year
            - matchup_period
            - player_id
            - wasted_bucket
    columns:
      - name: season_year
        description: 'ESPN season year.'
        tests:
          - not_null
      - name: matchup_period
        description: 'Weekly matchup period.'
        tests:
          - not_null
      - name: team_id
        description: 'ESPN team identifier. NULL for the FA bucket (free agents have no fantasy team); set for the ROSTERED_INACTIVE bucket.'
      - name: player_id
        description: 'ESPN player identifier.'
        tests:
          - not_null
      - name: wasted_bucket
        description: '"FA" or "ROSTERED_INACTIVE". Grain dim distinguishing free agents from benched/IL players.'
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['FA', 'ROSTERED_INACTIVE']
      - name: calculated_points
        description: 'Rules-normalized total points the player would have produced if started. For inactive players, this is the "unrealized point production" / wasted-points concept.'
      - name: calculated_hitting_pts
        description: 'Hitting subtotal of calculated_points.'
      - name: calculated_pitching_pts
        description: 'Pitching subtotal of calculated_points.'
      - name: negative_points
        description: 'Magnitude (unsigned positive) of net-negative platform_points the player accrued while inactive.'

  - name: fct_weekly_team_inactive_performance
    description: >
      Team-grain rollup of inactive (BE/IL/FA) player performance.
      Symmetric counterpart to fct_weekly_team_active_performance for the inactive half of the player-weekly split.

      Two row flavors per (season_year, matchup_period):
        - N ROSTERED_INACTIVE rows (one per fantasy team; team_id set)
        - 1 FA row (league-wide; team_id NULL). The FA pool is not attributable to any single team.

      Carries counting + per-stat *_pts + calculated_* totals + the wasted_bucket dim + inactive_player_count.

      DOES NOT carry platform_points (no ESPN home_score equivalent for "the team's bench"), platform_hitting_pts / platform_pitching_pts (today's slot-driven hitting/pitching split miscategorizes bench pitchers; a position-driven version is a v1.x candidate), or team rates (bench IP isn't pitched -- rate semantics break).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - season_year
            - matchup_period
            - team_id
            - wasted_bucket
    columns:
      - name: season_year
        description: 'ESPN season year.'
        tests:
          - not_null
      - name: matchup_period
        description: 'Weekly matchup period.'
        tests:
          - not_null
      - name: team_id
        description: 'ESPN team identifier. NULL for the FA pool row (league-wide aggregate); set for ROSTERED_INACTIVE rows.'
      - name: wasted_bucket
        description: '"FA" or "ROSTERED_INACTIVE". Grain dim distinguishing the league-wide free-agent pool from per-team bench/IL waste.'
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['FA', 'ROSTERED_INACTIVE']
      - name: calculated_points
        description: 'Rules-normalized total of unrealized point production by inactive players (ROSTERED_INACTIVE: team-level bench/IL waste; FA: league-wide free-agent production unclaimed by any team).'
      - name: inactive_player_count
        description: 'Distinct players contributing to this bucket. Diagnostic for "how thin was this bench."'
      - name: negative_points
        description: 'Team rollup of inactive-player negative_points across the matchup_period.'
