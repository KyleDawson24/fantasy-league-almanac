version: 2

models:
  - name: dim_stat
    description: >
      Consumer-facing dimension for stat metadata. Thin view over the
      stat_classification seed; gives output scripts and external
      readers a stable contract layer independent of the seed's
      internal schema.

      Adds vs. the seed: leaderboard_name (seed_name post SEED_TO_
      LEADERBOARD translation -- '1B' -> 'SINGLES', '30' -> 'CYC',
      '64' -> 'SHO', etc.). All other seed columns pass through.

      Materialized as view. Python consumers reach this dim via
      output/stat_catalog.py's @lru_cache helpers (one fetch per
      script process). The mart_stat_leaderboard model still iterates
      stat_classification directly at Jinja compile time via
      run_query; future cleanup may consolidate to dim_stat as the
      sole source.
    columns:
      - name: stat_name
        description: 'Seed-side primary key. Matches the breakdown VARIANT key.'
        tests:
          - not_null
          - unique
      - name: leaderboard_name
        description: >
          Consumer-facing leaderboard column name. Equals stat_name for
          most stats; translated for the small set whose seed name differs
          from the leaderboard column name (1B/2B/3B singles/doubles/triples,
          30 cycles, 64 shutouts).
        tests:
          - not_null
          - unique
      - name: espn_stat_id
        description: 'ESPN numeric stat ID. NULL for derived stats / score totals.'
      - name: stat_category
        description: '''hitting'' | ''pitching'' | ''fielding'' | ''unknown'' | ''total''.'
        tests:
          - accepted_values:
              arguments:
                values: ['hitting', 'pitching', 'fielding', 'unknown', 'total']
      - name: espn_stat_label
        description: 'ESPN''s English label. Traceability metadata; consumers prefer display_name/abbrev.'
      - name: display_name
        description: 'Project-owned display label. Read via stat_catalog.get_display_map().'
      - name: abbrev
        description: 'Compact display form. Read via stat_catalog.get_abbrev_map().'
      - name: is_counting
        description: 'True for stats with a wide column on int_player_daily that propagate as SUM rollups.'
      - name: is_derived
        description: 'True for stats computed from other counting stats via derivation_expr.'
      - name: derivation_expr
        description: 'SQL expression for derived stats (e.g., "ab + b_bb + hbp + sf" for PA).'
      - name: auto_tracked
        description: 'Bypasses the polarity rule at team grain for stats tracked regardless of league scoring settings.'
      - name: is_record_candidate
        description: 'True if the stat appears in mart_stat_leaderboard. Drives the Jinja UNPIVOT loop.'
      - name: polarity
        description: '''positive'' | ''negative'' | ''neutral''. Drives consumer-side Best/Worst labeling.'
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['positive', 'negative', 'neutral']
      - name: qualifier_stat
        description: 'v1.1.1: name of the denominator column (e.g. ''ab'', ''outs'') used as a min-volume gate for rate-stat records. NULL on every non-rate stat.'
      - name: qualifier_min
        description: 'v1.1.1: minimum value of qualifier_stat below which the rate doesn''t qualify as a record. mart_stat_leaderboard skips the threshold filter when this is NULL. Examples: 225 AB for hitting rate stats, 150 outs (= 50 IP) for pitching rate stats.'
      - name: notes
        description: 'Free-text context for unusual rows.'

  - name: dim_matchup_period
    description: >
      Consumer-facing dimension for matchup-period calendar metadata.
      Thin view over the matchup_schedule seed; gives output scripts
      and external readers a stable contract layer.

      v1.1.0 DAG cleanup. Calendar-automation work (roadmapped) will
      replace the hand-maintained seed with an extract-driven raw
      table plus a thin overrides seed; once that lands, this dim
      re-points at the new sources without consumer changes.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - season_year
              - matchup_period
    columns:
      - name: season_year
        description: 'MLB season year.'
        tests:
          - not_null
      - name: matchup_period
        description: 'ESPN weekly matchup number (1-indexed).'
        tests:
          - not_null
      - name: start_date
        description: 'First MLB scoring period day in this matchup_period.'
      - name: end_date
        description: 'Last MLB scoring period day in this matchup_period.'
      - name: is_abnormal
        description: 'Excluded from records (All-Star break, weather-shortened weeks, etc.).'
        tests:
          - not_null
      - name: abnormal_reason
        description: 'Free-text explanation when is_abnormal=true.'
      - name: is_playoff
        description: 'True for playoff weeks. Drives playoff_round substitution in format_week_label().'
        tests:
          - not_null
      - name: playoff_round
        description: '"Round 1" / "Semi-Finals" / "Finals" when is_playoff=true; NULL otherwise.'

  - name: dim_roster_slot_counts
    description: >
      Consumer-facing dimension for roster slot settings. One row per
      ESPN lineup slot in the latest rosterSettings snapshot for each
      season. Starter counts come from rosterSettings.lineupSlotCounts;
      maximums come from rosterSettings.positionLimits where ESPN exposes
      a direct primary-position limit. Flex and roster-management slots
      surface maximum_display='N/A'; raw -1 limits surface as 'No Limit'.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - season_year
              - lineup_slot_id
    columns:
      - name: season_year
        description: 'ESPN season year.'
        tests:
          - not_null
      - name: lineup_slot_id
        description: 'ESPN lineup slot ID used by box score rows.'
        tests:
          - not_null
      - name: lineup_slot
        description: 'Human-readable lineup slot label (C, 1B, SP, BE, IL, etc.).'
        tests:
          - not_null
      - name: starter_count
        description: 'Configured number of starters for this lineup slot.'
        tests:
          - not_null
      - name: position_limit_id
        description: 'ESPN primary-position ID used for maximum roster limits, when directly applicable.'
      - name: raw_position_limit
        description: 'Raw ESPN position limit value. -1 means No Limit; NULL means not applicable.'
      - name: maximum_count
        description: 'Numeric maximum when the slot has a finite max; NULL for No Limit or N/A.'
      - name: maximum_type
        description: '''limited'', ''no_limit'', or ''not_applicable''.'
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['limited', 'no_limit', 'not_applicable']
      - name: maximum_display
        description: 'UI-friendly maximum label: numeric string, No Limit, or N/A.'
        tests:
          - not_null
      - name: is_active_lineup_slot
        description: 'True when starter_count > 0 and the slot is not BE or IL.'
        tests:
          - not_null
      - name: sort_order
        description: 'Stable roster display ordering.'
        tests:
          - not_null

  - name: mart_daily_roster_snapshot
    description: >
      Daily roster snapshot mart. One row per rostered fantasy player
      per scoring period, including zero-stat players who do not survive
      the stat-breakdown performance path. Excludes free agents. This is
      the public mart contract for roster pages and rostered-day counts.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - season_year
              - scoring_period
              - team_id
              - player_id
              - lineup_slot
    columns:
      - name: season_year
        tests:
          - not_null
      - name: matchup_period
        tests:
          - not_null
      - name: scoring_period
        tests:
          - not_null
      - name: team_id
        tests:
          - not_null
      - name: player_id
        tests:
          - not_null
      - name: lineup_slot
        tests:
          - not_null
      - name: slots_to_fill
        description: 'Configured count for this lineup slot, from dim_roster_slot_counts.'
        tests:
          - not_null
      - name: slot_sort_order
        tests:
          - not_null
      - name: is_active_lineup_slot
        tests:
          - not_null
      - name: roster_status
        description: '''active'' for starter lineup slots, ''inactive'' for BE/IL.'
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['active', 'inactive']

  - name: fct_player_daily_performance
    description: >
      Comprehensive player-daily performance fact. Thin view over
      int_player_daily that adds two grain-defining status columns
      (performance_status, wasted_bucket) so weekly facts and per-day
      consumers can inherit them from one canonical derivation.

      The "comprehensive" framing: every slot, every roster status,
      the real-world MLB stat line with fantasy roster context
      attached. Active vs. inactive splits happen at the weekly fact
      layer downstream.

      v1.1.0 DAG cleanup. Output scripts that previously reached into
      int_player_daily for per-day metadata (get_wasted_points'
      pro_team / position / eligible_slots snapshot, league_notes
      callouts for HR streaks / no_negative_days / SP-start counts)
      should re-point at this fact in a follow-on commit.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - season_year
              - scoring_period
              - team_id
              - player_id
              - lineup_slot
    columns:
      - name: season_year
        tests:
          - not_null
      - name: scoring_period
        tests:
          - not_null
      - name: player_id
        tests:
          - not_null
      - name: lineup_slot
        tests:
          - not_null
      - name: performance_status
        description: '''active'' (lineup_slot NOT IN BE/IL/FA) or ''inactive'' (lineup_slot IN BE/IL/FA).'
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['active', 'inactive']
      - name: wasted_bucket
        description: '''FA'' (free agent), ''ROSTERED_INACTIVE'' (BE/IL), or NULL (active). Categorizes the two flavors of inactive.'
        tests:
          - accepted_values:
              arguments:
                values: ['FA', 'ROSTERED_INACTIVE']
              config:
                where: "wasted_bucket is not null"
      - name: is_active_slot
        description: 'Boolean equivalent of performance_status = ''active''. Retained for backward compatibility.'
      - name: platform_points
        description: 'ESPN per-player per-day total. NULL for FA rows in some edge cases.'
      - name: negative_points
        description: 'Magnitude (positive) of net-negative platform_points on this day. Zero when platform_points >= 0.'

  - name: fct_weekly_player_performance
    description: >
      Comprehensive player-weekly performance fact. Aggregates from
      fct_player_daily_performance to weekly grain while preserving
      lineup_slot so the downstream active/inactive splits can filter
      cleanly.

      GRAIN: one row per (season_year, matchup_period, team_id,
      player_id, lineup_slot). The model name implies one row per
      player-week, but the actual grain includes lineup_slot -- a
      player who occupied multiple slots within a single matchup_period
      produces multiple rows here. Deliberate: the downstream
      active/inactive facts filter by slot before aggregating the slot
      dimension away, which is only possible if the slot is preserved
      here.

      v1.1.0 DAG cleanup: this model was previously
      int_player_weekly_performance (intermediate-layer view). Promoted
      to mart-layer fact because it represents a legitimate analytical
      surface in its own right -- the comprehensive weekly stat line
      with fantasy roster context, before the active/inactive lens is
      applied. Now sources from fct_player_daily_performance so the
      daily-to-weekly DAG edge is real (rather than a side branch off
      int_player_daily).

      performance_status and wasted_bucket are inherited from
      fct_player_daily_performance via GROUP BY -- they're functionally
      dependent on lineup_slot which is already in the grouping key.

      Materialization: table. Two downstream facts (active, inactive)
      read from this for every mart_stat_leaderboard query; materialization
      avoids re-aggregating ~600K daily rows on each consumer query.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - season_year
              - matchup_period
              - team_id
              - player_id
              - lineup_slot
    columns:
      - name: season_year
        tests:
          - not_null
      - name: matchup_period
        tests:
          - not_null
      - name: player_id
        tests:
          - not_null
      - name: lineup_slot
        description: 'Fantasy lineup slot. Part of the grain.'
        tests:
          - not_null
      - name: performance_status
        description: '''active'' or ''inactive''. Inherited from fct_player_daily_performance.'
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['active', 'inactive']
      - name: wasted_bucket
        description: '''FA'', ''ROSTERED_INACTIVE'', or NULL. Inherited from fct_player_daily_performance.'
      - name: games_played
        description: 'MLB games played by this player in this matchup_period and lineup_slot, summed up from int_player_daily (where DH days carry games_played=2). Added v1.1.1 so fct_player_season_performance can roll it up to season grain.'

  - name: fct_weekly_player_active_performance
    description: >
      Wide-format player-weekly convergence fact for ACTIVE-slot performance (lineup_slot NOT IN BE/IL/FA).
      The consumer-facing entity for "what did this player do this week" -- counting stats, per-stat point contributions, rate stats, and fantasy scoring totals all in one row per player per matchup.
      See fct_weekly_player_inactive_performance for the symmetric inactive counterpart.

      Pipeline: read fct_weekly_player_performance (the v1.1.0 comprehensive weekly fact), filter to active rows via performance_status, aggregate across slots, compute rates via shared macros, sum *_pts into calculated_* totals. LEFT JOIN dim_matchup_period for schedule attributes denormalized onto fact rows.
      Incremental fact -- merge by unique_key.
      Grain: (season_year, matchup_period, team_id, player_id).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - season_year
              - matchup_period
              - team_id
              - player_id
    columns:
      - name: season_year
        description: 'ESPN season year.'
        tests:
          - not_null
      - name: matchup_period
        description: 'ESPN matchup period number.'
        tests:
          - not_null
      - name: team_id
        description: 'ESPN stable numeric team identifier.'
        tests:
          - not_null
      - name: team_name
        description: 'ESPN fantasy team name.'
      - name: team_abbrev
        description: 'Owner-set short code for the fantasy team. Surfaced for compact team labels in output callouts (e.g., "Player (SMEL), 37.3 pts -- ...").'
      - name: owner_name
        description: 'Team owner display name.'
      - name: player_id
        description: 'ESPN stable numeric player identifier.'
        tests:
          - not_null
      - name: player_name
        description: 'Player full name as reported by ESPN.'
      - name: display_name
        description: 'COALESCE(nickname, player_name). Used by the output script for contributor callouts.'
      - name: h
        description: 'Hits.'
      - name: ab
        description: 'At bats.'
      - name: b_bb
        description: 'Batter walks.'
      - name: b_so
        description: 'Batter strikeouts.'
      - name: hbp
        description: 'Hit by pitch.'
      - name: sf
        description: 'Sacrifice flies.'
      - name: hr
        description: 'Home runs.'
      - name: r
        description: 'Runs.'
      - name: rbi
        description: 'Runs batted in.'
      - name: sb
        description: 'Stolen bases.'
      - name: cs
        description: 'Caught stealing.'
      - name: tb
        description: 'Total bases.'
      - name: singles
        description: 'Singles (1B in seed). Renamed for SQL compatibility.'
      - name: doubles
        description: 'Doubles (2B in seed).'
      - name: triples
        description: 'Triples (3B in seed).'
      - name: xbh
        description: 'Extra-base hits.'
      - name: w
        description: 'Pitcher wins.'
      - name: l
        description: 'Pitcher losses.'
      - name: k
        description: 'Pitcher strikeouts.'
      - name: er
        description: 'Earned runs allowed.'
      - name: outs
        description: 'Outs recorded. Innings pitched = outs / 3.'
      - name: qs
        description: 'Quality starts.'
      - name: sv
        description: 'Saves.'
      - name: hld
        description: 'Holds.'
      - name: p_h
        description: 'Hits allowed.'
      - name: p_bb
        description: 'Walks allowed.'
      - name: p_hr
        description: 'Home runs allowed.'
      - name: p_r
        description: 'Runs allowed.'
      - name: cg
        description: 'Complete games.'
      - name: blk
        description: 'Balks.'
      - name: wp
        description: 'Wild pitches.'
      - name: avg
        description: 'Batting average (H / AB). NULL when AB = 0.'
      - name: obp
        description: 'On-base percentage. NULL when denominator = 0.'
      - name: slg
        description: 'Slugging percentage (TB / AB). NULL when AB = 0.'
      - name: ops
        description: 'On-base plus slugging.'
      - name: era
        description: 'Earned run average. NULL when OUTS = 0.'
      - name: whip
        description: 'Walks + hits per inning pitched.'
      - name: k_per_9
        description: 'Strikeouts per 9 innings.'
      - name: k_per_bb
        description: 'Strikeout-to-walk ratio.'
      - name: platform_points
        description: 'Platform-computed fantasy total points. Sum of platform_hitting_pts + platform_pitching_pts. The official ESPN-computed value; the arbiter for W/L outcomes.'
      - name: platform_hitting_pts
        description: 'Platform-computed fantasy points from hitting lineup slots.'
      - name: platform_pitching_pts
        description: 'Platform-computed fantasy points from pitching lineup slots.'
      - name: negative_points
        description: >
          Magnitude (unsigned positive) of net-negative platform_points contributed across the matchup_period.
          Per-day platform-level rollup -- each negative scoring period counts separately, so a player with one bad day plus several positive ones still carries the bad day's magnitude here even if the week-level total is net positive.
          Available as a data-layer artifact for gross-negative analysis; the recap surface uses a different (week-net) calculation.

      # Per-stat point contributions
      - name: h_pts
        description: 'Fantasy points generated by hits (h * points_per_unit for H).'
      - name: ab_pts
        description: 'Fantasy points generated by at bats.'
      - name: b_bb_pts
        description: 'Fantasy points generated by batter walks.'
      - name: b_so_pts
        description: 'Fantasy points generated by batter strikeouts.'
      - name: hbp_pts
        description: 'Fantasy points generated by hit-by-pitch.'
      - name: sf_pts
        description: 'Fantasy points generated by sacrifice flies.'
      - name: hr_pts
        description: 'Fantasy points generated by home runs.'
      - name: r_pts
        description: 'Fantasy points generated by runs scored.'
      - name: rbi_pts
        description: 'Fantasy points generated by RBIs.'
      - name: sb_pts
        description: 'Fantasy points generated by stolen bases.'
      - name: cs_pts
        description: 'Fantasy points generated by caught stealing.'
      - name: tb_pts
        description: 'Fantasy points generated by total bases.'
      - name: singles_pts
        description: 'Fantasy points generated by singles.'
      - name: doubles_pts
        description: 'Fantasy points generated by doubles.'
      - name: triples_pts
        description: 'Fantasy points generated by triples.'
      - name: xbh_pts
        description: 'Fantasy points generated by extra-base hits.'
      - name: w_pts
        description: 'Fantasy points generated by pitcher wins.'
      - name: l_pts
        description: 'Fantasy points generated by pitcher losses.'
      - name: k_pts
        description: 'Fantasy points generated by pitcher strikeouts.'
      - name: er_pts
        description: 'Fantasy points generated by earned runs allowed.'
      - name: outs_pts
        description: 'Fantasy points generated by outs recorded.'
      - name: qs_pts
        description: 'Fantasy points generated by quality starts.'
      - name: sv_pts
        description: 'Fantasy points generated by saves.'
      - name: hld_pts
        description: 'Fantasy points generated by holds.'
      - name: p_h_pts
        description: 'Fantasy points generated by hits allowed.'
      - name: p_bb_pts
        description: 'Fantasy points generated by walks allowed.'
      - name: p_hr_pts
        description: 'Fantasy points generated by home runs allowed.'
      - name: p_r_pts
        description: 'Fantasy points generated by runs allowed.'
      - name: cg_pts
        description: 'Fantasy points generated by complete games.'
      - name: blk_pts
        description: 'Fantasy points generated by balks.'
      - name: wp_pts
        description: 'Fantasy points generated by wild pitches.'

      # Calculated scoring totals (current-season weights applied). calculated_*
      # are rounded 1 decimal at player grain for display; total_*_stat_pts are
      # the UNROUNDED sources the team fact sums-then-rounds ONCE at team grain
      # (avoids the sum-of-rounds drift fixed in the round-once team-total work).
      - name: total_hitting_stat_pts
        description: 'UNROUNDED sum of all hitting *_pts. Source for calculated_hitting_pts; exposed so fct_weekly_team_active_performance rounds once at team grain rather than summing per-player-rounded values.'
      - name: total_pitching_stat_pts
        description: 'UNROUNDED sum of all pitching *_pts. Source for calculated_pitching_pts; see total_hitting_stat_pts.'
      - name: total_stat_pts
        description: 'UNROUNDED sum of all *_pts (hitting + pitching). Source for calculated_points; rounded once at team grain in the team fact.'
      - name: calculated_hitting_pts
        description: 'Sum of all hitting *_pts columns, rounded 1 decimal. What this player''s hitting line scores under current rules.'
      - name: calculated_pitching_pts
        description: 'Sum of all pitching *_pts columns, rounded 1 decimal. What this player''s pitching line scores under current rules.'
      - name: calculated_points
        description: 'Sum of all *_pts columns, rounded 1 decimal. What this player''s full stat line scores under current rules. For the current season this should closely match platform_points; for historical seasons it normalizes to a common scale.'

  - name: fct_weekly_team_active_performance
    description: >
      Wide-format team-weekly convergence fact for ACTIVE-slot performance.
      Combines team-level counting stats, per-stat *_pts and calculated_* totals (rolled up from fct_weekly_player_active_performance), and rate stats (recomputed via shared macros from team-level counting sums).

      platform_points is sourced DIRECTLY from the wrapper's per-team home_score/away_score in raw (taken from the LAST scoring_period of each matchup_period since that field is cumulative-through-SP).
      This is ESPN's authoritative team total -- slot-aware AND inclusive of any commissioner manual adjustments -- and may NOT equal SUM(player platform_points) when slot-mismatched players exist.
      The divergence is captured in platform_calculated_delta.

      Adds matchup pairings from raw box scores and joins matchup_schedule for days_in_period metadata.
      See fct_weekly_team_inactive_performance for the symmetric inactive counterpart.
      Incremental fact -- merge by unique_key.
      Grain: (season_year, matchup_period, team_id).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - season_year
              - matchup_period
              - team_id
    columns:
      - name: season_year
        description: 'ESPN season year.'
        tests:
          - not_null
      - name: matchup_period
        description: 'ESPN matchup period number.'
        tests:
          - not_null
      - name: team_id
        description: 'ESPN stable numeric team identifier.'
        tests:
          - not_null
      - name: team_name
        description: 'ESPN fantasy team name.'
      - name: team_abbrev
        description: 'Owner-set short code for the fantasy team.'
      - name: owner_name
        description: 'Team owner display name.'
      - name: h
        description: 'Team hits.'
      - name: ab
        description: 'Team at bats.'
      - name: b_bb
        description: 'Team batter walks.'
      - name: b_so
        description: 'Team batter strikeouts.'
      - name: hbp
        description: 'Team hit by pitch.'
      - name: sf
        description: 'Team sacrifice flies.'
      - name: hr
        description: 'Team home runs.'
      - name: r
        description: 'Team runs.'
      - name: rbi
        description: 'Team runs batted in.'
      - name: sb
        description: 'Team stolen bases.'
      - name: cs
        description: 'Team caught stealing.'
      - name: tb
        description: 'Team total bases.'
      - name: singles
        description: 'Team singles.'
      - name: doubles
        description: 'Team doubles.'
      - name: triples
        description: 'Team triples.'
      - name: xbh
        description: 'Team extra-base hits.'
      - name: w
        description: 'Team pitcher wins.'
      - name: l
        description: 'Team pitcher losses.'
      - name: k
        description: 'Team pitcher strikeouts.'
      - name: er
        description: 'Team earned runs allowed.'
      - name: outs
        description: 'Team outs recorded.'
      - name: qs
        description: 'Team quality starts.'
      - name: sv
        description: 'Team saves.'
      - name: hld
        description: 'Team holds.'
      - name: p_h
        description: 'Team hits allowed.'
      - name: p_bb
        description: 'Team walks allowed.'
      - name: p_hr
        description: 'Team home runs allowed.'
      - name: p_r
        description: 'Team runs allowed.'
      - name: cg
        description: 'Team complete games.'
      - name: blk
        description: 'Team balks.'
      - name: wp
        description: 'Team wild pitches.'
      - name: avg
        description: 'Team batting average (SUM(H) / SUM(AB)).'
      - name: obp
        description: 'Team on-base percentage.'
      - name: slg
        description: 'Team slugging percentage.'
      - name: ops
        description: 'Team OPS (OBP + SLG).'
      - name: era
        description: 'Team ERA.'
      - name: whip
        description: 'Team WHIP.'
      - name: k_per_9
        description: 'Team strikeouts per 9 innings.'
      - name: k_per_bb
        description: 'Team strikeout-to-walk ratio.'
      - name: platform_points
        description: >
          Team total fantasy points sourced DIRECTLY from the wrapper's home_score/away_score (read at the last scoring_period of each matchup_period).
          ESPN's authoritative team total -- slot-aware AND inclusive of any commissioner manual adjustments.
          May NOT equal SUM(player platform_points) when slot-mismatched players exist (a hitter slotted at RP contributes to player rollup but not to the wrapper's team total).
          The arbiter for W/L outcomes.
        tests:
          - not_null
      - name: player_rollup_platform_points
        description: >
          SUM of platform_hitting_pts + platform_pitching_pts across active players (the slot-blind alternative to platform_points).
          Surfaced for diagnostic comparison against the authoritative wrapper-direct platform_points; their delta is captured in platform_calculated_delta together with other sources of divergence.
      - name: platform_calculated_delta
        description: >
          platform_points - calculated_points.
          Captures sources of divergence between ESPN's authoritative team total and the rules-normalized derivation.
          For current-season weeks, this isolates commissioner manual scoring adjustments.
          For historical seasons, it also includes any difference between current and historical scoring weights.
      - name: platform_hitting_pts
        description: >
          Team hitting fantasy points (SUM of player platform_hitting_pts).
          Player rollup -- the wrapper provides only a single team total without hitting/pitching breakdown.
          May not sum exactly to platform_points for teams with slot misuse.
          Used for hitting-leaderboard superlatives.
      - name: platform_pitching_pts
        description: >
          Team pitching fantasy points (SUM of player platform_pitching_pts).
          Player rollup -- the wrapper provides only a single team total without hitting/pitching breakdown.
          May not sum exactly to platform_points for teams with slot misuse.
          Used for pitching-leaderboard superlatives.
      - name: negative_points
        description: 'Team rollup of player negative_points across the matchup_period.'
      - name: active_player_count
        description: 'Distinct count of players in active lineup slots for this team this matchup.'
      - name: opponent_id
        description: 'ESPN stable numeric team identifier for the opponent.'
      - name: opponent_name
        description: 'ESPN fantasy team name of the opponent.'
      - name: opponent_owner
        description: 'Owner display name of the opponent.'
      - name: opponent_points
        description: 'Opponent total fantasy points for this matchup.'
      - name: result
        description: 'W if team scored more than opponent, L if less, T if tied. Determined by platform_points (the official ESPN arbiter).'
      - name: days_in_period
        description: 'Count of days in the matchup period (from matchup_schedule.end_date - start_date + 1). Normal weeks = 7; opening week and All-Star break are higher.'

      # Per-stat point contributions (rolled up from player fact)
      - name: h_pts
        description: 'Team total fantasy points generated by hits.'
      - name: ab_pts
        description: 'Team total fantasy points generated by at bats.'
      - name: b_bb_pts
        description: 'Team total fantasy points generated by batter walks.'
      - name: b_so_pts
        description: 'Team total fantasy points generated by batter strikeouts.'
      - name: hbp_pts
        description: 'Team total fantasy points generated by hit-by-pitch.'
      - name: sf_pts
        description: 'Team total fantasy points generated by sacrifice flies.'
      - name: hr_pts
        description: 'Team total fantasy points generated by home runs.'
      - name: r_pts
        description: 'Team total fantasy points generated by runs scored.'
      - name: rbi_pts
        description: 'Team total fantasy points generated by RBIs.'
      - name: sb_pts
        description: 'Team total fantasy points generated by stolen bases.'
      - name: cs_pts
        description: 'Team total fantasy points generated by caught stealing.'
      - name: tb_pts
        description: 'Team total fantasy points generated by total bases.'
      - name: singles_pts
        description: 'Team total fantasy points generated by singles.'
      - name: doubles_pts
        description: 'Team total fantasy points generated by doubles.'
      - name: triples_pts
        description: 'Team total fantasy points generated by triples.'
      - name: xbh_pts
        description: 'Team total fantasy points generated by extra-base hits.'
      - name: w_pts
        description: 'Team total fantasy points generated by pitcher wins.'
      - name: l_pts
        description: 'Team total fantasy points generated by pitcher losses.'
      - name: k_pts
        description: 'Team total fantasy points generated by pitcher strikeouts.'
      - name: er_pts
        description: 'Team total fantasy points generated by earned runs allowed.'
      - name: outs_pts
        description: 'Team total fantasy points generated by outs recorded.'
      - name: qs_pts
        description: 'Team total fantasy points generated by quality starts.'
      - name: sv_pts
        description: 'Team total fantasy points generated by saves.'
      - name: hld_pts
        description: 'Team total fantasy points generated by holds.'
      - name: p_h_pts
        description: 'Team total fantasy points generated by hits allowed.'
      - name: p_bb_pts
        description: 'Team total fantasy points generated by walks allowed.'
      - name: p_hr_pts
        description: 'Team total fantasy points generated by home runs allowed.'
      - name: p_r_pts
        description: 'Team total fantasy points generated by runs allowed.'
      - name: cg_pts
        description: 'Team total fantasy points generated by complete games.'
      - name: blk_pts
        description: 'Team total fantasy points generated by balks.'
      - name: wp_pts
        description: 'Team total fantasy points generated by wild pitches.'

      # Calculated scoring totals (current-season weights applied)
      - name: calculated_hitting_pts
        description: 'Team sum of player calculated_hitting_pts. What the team''s hitting line scores under current rules.'
      - name: calculated_pitching_pts
        description: 'Team sum of player calculated_pitching_pts. What the team''s pitching line scores under current rules.'
      - name: calculated_points
        description: 'Team sum of player calculated_points. What the team''s full stat line scores under current rules. Use this for cross-season comparisons (e.g., what would 2025 teams have scored under 2026 rules?).'

  - name: mart_stat_leaderboard
    description: >
      Top-10 leaderboard across team and player grains, for both stat-level (HR, K, RBI, etc.) and score-level columns.
      Both platform_* (ESPN's official tally) and calculated_* (rules-normalized under current weights) score columns are included so consumers can choose which lens to rank by.

      Each (entity_grain, performance_status, stat_name, record_scope, record_direction) partition emits 10 ranked rows, ties broken by recency (newer season, then matchup).
      The top-10 emission is a visibility buffer: consumers display top-5, but the extra 5 ranks let consumer-side tie-collapse logic see whether a tier extends past the display cap (needed for accurate "N teams tied at X" counts when the visible tier saturates).
      Consumers apply polarity filtering downstream (negative-weighted stats only surface 'most'/most-of; positive stats surface both directions).
      Direction values are intentionally direction-agnostic ('most'/'fewest' rather than 'best'/'worst') -- 'most' is best for HR but worst for ER allowed; the polarity filter at the consumer side resolves the mapping.

      Built via a seed-driven Jinja UNPIVOT loop over four source CTEs (team_active, team_inactive, player_active, player_inactive) union-all'd into one combined CTE.
      Snowflake UNPIVOT syntax; porting to DuckDB/BigQuery would require warehouse-specific macro wrapping.
      The performance_status partition ('active' | 'inactive') segregates rankings; consumers default-filter to active.
      wasted_bucket is carried as a column on inactive rows but is not part of the ranking partition.
      View materialization (rankings retroactively mutable; incremental would be fragile).
      Excludes abnormal matchup periods.

      Grain: (entity_grain, performance_status, stat_name, record_scope, record_direction, rank), rank 1..10.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - entity_grain
              - performance_status
              - stat_name
              - record_scope
              - record_direction
              - rank
    columns:
      - name: entity_grain
        description: 'team or player. Determines whether the row is a team-level or player-level record.'
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['team', 'player']
      - name: performance_status
        description: 'active or inactive. Rankings are partitioned by this so active-slot records and bench/IL/FA-slot records do not mingle. Consumers default-filter performance_status = ''active''.'
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['active', 'inactive']
      - name: wasted_bucket
        description: 'NULL for active rows; ''FA'' or ''ROSTERED_INACTIVE'' for inactive rows. Carried as a column on inactive rows for ad-hoc analysis. Not part of the ranking partition.'
      - name: stat_name
        description: 'Column name being ranked. Includes counting stats (H, AB, HR, K, etc.) and score columns (PLATFORM_POINTS, PLATFORM_HITTING_PTS, PLATFORM_PITCHING_PTS, CALCULATED_POINTS, CALCULATED_HITTING_PTS, CALCULATED_PITCHING_PTS). calculated_* lets the records output rank under current-season weights; platform_* is retained for cross-season comparison.'
        tests:
          - not_null
      - name: record_scope
        description: 'all_time (across every loaded season) or current_season (latest season only).'
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['all_time', 'current_season']
      - name: record_direction
        description: >
          'most' (rank by stat_value DESC) or 'fewest' (rank by stat_value ASC).
          Direction-agnostic by design -- the same value ('most') means "best" for HR but "worst" for ER allowed; consumer applies polarity-aware filtering when surfacing records.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['most', 'fewest']
      - name: rank
        description: '1 to 10. Ties broken by recency (newer season_year, then newer matchup_period) in both directions.'
        tests:
          - not_null
      - name: team_abbrev
        description: 'Owner-set short fantasy team code. Carried through for compact callout rendering.'
      - name: season_year
        description: 'Season when this rank was set.'
      - name: matchup_period
        description: 'Matchup period when this rank was set.'
      - name: team_id
        description: 'Team identifier of the rank holder.'
      - name: team_name
        description: 'Team name of the rank holder.'
      - name: owner_name
        description: 'Owner of the team holding this rank.'
      - name: player_id
        description: 'Player identifier (entity_grain = player only; NULL for team rows).'
      - name: player_name
        description: 'Player name (entity_grain = player only; NULL for team rows).'
      - name: display_name
        description: 'Player display name (entity_grain = player only; NULL for team rows).'
      - name: stat_value
        description: 'Numeric value at this rank.'
        tests:
          - not_null

  - name: mart_league_weekly_benchmarks
    description: >
      One row per (season_year, matchup_period) with league-wide
      aggregate score lenses (mean, max, min) plus the percentile rank
      of each mean within league history.

      Powers "hot week / cold week" callouts in the weekly recap and
      similar collective-mood content. Three score lenses: total
      calculated_points, calculated_hitting_pts, calculated_pitching_pts.
      All three use the calculated_* lens (cross-season comparable
      under current-season scoring weights) -- the right lens for
      historical comparison. Platform_* lens not included; cross-season
      comparison under varying historical weights would be misleading.

      Aggregation includes every active-roster team-week (no bye-team
      filter; bye-week teams still rostered players and accrued points).
      Excludes is_abnormal weeks (All-Star break, weather-shortened,
      etc.) to match the convention every other leaderboard CTE uses.

      Percentile uses PERCENT_RANK over the full history. A value of
      0.95 means this week's mean is higher than 95% of weeks the
      league has ever recorded. Consumers typically read it as "Nth
      percentile" via ROUND(pctile * 100, 0).

      Grain: (season_year, matchup_period). View materialization
      (small aggregation, source is already a table).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - season_year
              - matchup_period
    columns:
      - name: season_year
        description: 'Season year.'
        tests:
          - not_null
      - name: matchup_period
        description: 'Matchup period within the season.'
        tests:
          - not_null
      - name: team_count
        description: 'Number of team-weeks aggregated. Constant in normal weeks (= league size); informational guardrail in case the upstream filter ever drops a team unexpectedly.'
        tests:
          - not_null
      - name: total_weeks_in_history
        description: 'Total league-weeks across all loaded seasons (constant per row; denormalized for single-query consumer reads).'
      - name: calculated_points_mean
        description: 'League average calculated total points for this week. Rounded to 1 decimal (matches fact-layer rounding).'
      - name: calculated_points_max
        description: 'Highest calculated_points by any team this week.'
      - name: calculated_points_min
        description: 'Lowest calculated_points by any team this week.'
      - name: calculated_points_pctile
        description: 'PERCENT_RANK of calculated_points_mean across all weeks in league history (0..1). 0.95 = higher than 95% of recorded weeks.'
      - name: calculated_points_rank
        description: 'Absolute RANK of calculated_points_mean across all weeks (DESC, so 1 = highest mean ever). Powers the always-on League This Week summary line. Ties get the same rank (RANK semantics, not DENSE_RANK).'
      - name: calculated_hitting_pts_mean
        description: 'League average calculated hitting points this week. Rounded 1 decimal.'
      - name: calculated_hitting_pts_max
        description: 'Highest calculated_hitting_pts by any team this week.'
      - name: calculated_hitting_pts_min
        description: 'Lowest calculated_hitting_pts by any team this week.'
      - name: calculated_hitting_pts_pctile
        description: 'PERCENT_RANK of calculated_hitting_pts_mean across all weeks in league history.'
      - name: calculated_hitting_pts_rank
        description: 'Absolute RANK of calculated_hitting_pts_mean across all weeks (DESC, so 1 = highest mean ever).'
      - name: calculated_pitching_pts_mean
        description: 'League average calculated pitching points this week. Rounded 1 decimal.'
      - name: calculated_pitching_pts_max
        description: 'Highest calculated_pitching_pts by any team this week.'
      - name: calculated_pitching_pts_min
        description: 'Lowest calculated_pitching_pts by any team this week.'
      - name: calculated_pitching_pts_pctile
        description: 'PERCENT_RANK of calculated_pitching_pts_mean across all weeks in league history.'
      - name: calculated_pitching_pts_rank
        description: 'Absolute RANK of calculated_pitching_pts_mean across all weeks (DESC, so 1 = highest mean ever).'

  - name: mart_team_matchup
    description: >
      Wide matchup-grain view over fct_weekly_team_active_performance. Each
      row carries one team's full active line (passed through from the base
      fact), the opponent's calculated-lens scores, head-to-head margin
      and combined matchup totals, and the league-wide per-week averages
      on the calculated lens.

      Architectural rationale: opponent points, margin, and league
      averages are properties of the matchup and the league, not the
      team. They don't belong as columns on the team fact, which holds
      the team_total = SUM(players) invariant for its own production.
      Additionally, the league-average window partitions across every
      team in the period, so it cannot live on the incrementally-merged
      base fact.

      Grain: one row per (season_year, matchup_period, team_id),
      filtered to team-weeks with an opponent. Two rows per matchup --
      consumers ranking a matchup as a single game dedupe via LEAST/
      GREATEST on team_id or by filtering to team_id < opponent_id.

      First consumer: output/generate_almanac_sheet.py Team Weeks tab.
      View materialization (pure derivation; window forbids incremental).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - season_year
              - matchup_period
              - team_id
    columns:
      - name: season_year
        description: 'Season year.'
        tests:
          - not_null
      - name: matchup_period
        description: 'Matchup period within the season.'
        tests:
          - not_null
      - name: team_id
        description: 'ESPN team_id for this side of the matchup.'
        tests:
          - not_null
      - name: opponent_id
        description: 'ESPN team_id for the opposing side. NOT NULL by construction (the view filters opponent_id IS NOT NULL).'
        tests:
          - not_null
      - name: sort_key
        description: 'Stable chronological sort key (season_year * 100 + matchup_period). Sorts the full archive without re-deriving in consumers.'
        tests:
          - not_null
      - name: opponent_calculated_hitting_pts
        description: 'Opponent calculated hitting points (cross-season comparable lens). Pulled from the matched opponent row on the base fact.'
      - name: opponent_calculated_pitching_pts
        description: 'Opponent calculated pitching points (cross-season comparable lens).'
      - name: opponent_calculated_points
        description: 'Opponent calculated total points (cross-season comparable lens).'
      - name: calculated_margin
        description: 'this_team.calculated_points - opponent.calculated_points. May disagree with `result` (platform-derived W/L) when commissioner adjustments exist; that divergence is meaningful, not drift.'
      - name: matchup_calculated_hitting_pts
        description: 'this_team + opponent calculated hitting points. Combined matchup output for "highest scoring contest" content and for normalizing a team against the contest it was in.'
      - name: matchup_calculated_pitching_pts
        description: 'this_team + opponent calculated pitching points.'
      - name: matchup_calculated_points
        description: 'this_team + opponent calculated total points.'
      - name: league_avg_hitting_points
        description: 'AVG(calculated_hitting_pts) OVER (PARTITION BY season_year, matchup_period). Constant for every row sharing the same (season, period). Includes every team in the period (this team and its opponent).'
      - name: league_avg_pitching_points
        description: 'AVG(calculated_pitching_pts) over the league-week.'
      - name: league_avg_total_points
        description: 'AVG(calculated_points) over the league-week.'

  - name: fct_player_season_performance
    description: >
      v1.1.1 foundational brick of the player profile layer. Season-grain
      counterpart to fct_weekly_player_performance: collapses
      matchup_period while preserving the (season, team, player, slot)
      decomposition.

      Grain: one row per (season_year, team_id, player_id, lineup_slot).
      team_id is nullable -- NULL rows represent FA time (lineup_slot 'FA'
      pairs with NULL team_id by construction).

      Slot-bearing all-slots design (mirrors fct_weekly_player_performance,
      not the active-only spinoff): rows for active slots carry stat
      contributions credited to a fantasy team; rows for BE/IL/FA carry
      player MLB production NOT credited to a fantasy team that day.
      performance_status and wasted_bucket inherit the partition cleanly.

      Per BRAINTHOUGHTS [ARCH] "the player profile is an assembly of
      bricks, not a mega-model": this is brick #1. Stays pure baseball
      performance (counting stats sliced by team/season/slot; no rates,
      since rates cannot be summed across grains). Future bricks join in
      independently -- dim_player for identity/bio/eligibility, a
      transactions model for acquisition history (needs new extract),
      and a callout-counts model.

      Consumer rollups are plain GROUP BY collapses:
      player career = GROUP BY player_id;
      player career-by-team = GROUP BY player_id, team_id;
      player season = GROUP BY player_id, season_year;
      player season-by-team = GROUP BY player_id, season_year, team_id.
      Matchup-grain questions go to fct_weekly_player_performance (already
      at that grain).

      Active vs inactive vs total framings are consumer-side filters:
      total IRL production has no filter; rostered production filters
      team_id IS NOT NULL; fantasy-credited filters performance_status =
      'active'; per-team filters team_id = X (FA naturally absent).

      Display fields (team_name, team_abbrev, owner_name, player_name,
      display_name) are NOT grain keys. They're helpers selected as the
      value from the most recent matchup_period within the (season,
      entity) partition -- owners and team names can shift mid-season;
      latest-in-season reads naturally for downstream display.

      Materialization: view. Source is already a table; the rollup is
      small (collapses matchup_period out of a ~30K-row source); no
      incremental benefit.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - season_year
              - team_id
              - player_id
              - lineup_slot
    columns:
      - name: season_year
        description: 'Season year. Part of the grain.'
        tests:
          - not_null
      - name: team_id
        description: 'Fantasy team_id while the player was rostered to a team. NULL when the player was a FA during a given lineup_slot row (lineup_slot = ''FA'').'
      - name: player_id
        description: 'ESPN player_id. Part of the grain.'
        tests:
          - not_null
      - name: lineup_slot
        description: 'Fantasy lineup slot. Part of the grain. Active slots (C/1B/2B/3B/SS/IF/LF/CF/RF/OF/DH/UTIL/SP*/RP*/P) reflect fantasy-credited production; BE/IL/FA reflect MLB production that was not credited to a fantasy team that day.'
        tests:
          - not_null
      - name: performance_status
        description: '''active'' or ''inactive''. Functionally dependent on lineup_slot; inherited via GROUP BY from fct_weekly_player_performance.'
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['active', 'inactive']
      - name: wasted_bucket
        description: '''FA'', ''ROSTERED_INACTIVE'', or NULL. Inherited from fct_weekly_player_performance. NULL on active rows (where the wasted-bucket concept doesn''t apply).'
        tests:
          - accepted_values:
              arguments:
                values: ['FA', 'ROSTERED_INACTIVE']
                quote: true
                where: 'wasted_bucket is not null'
      - name: team_name
        description: 'Display helper, not a grain key. Latest-in-season value for this team_id within the row''s season_year. NULL on FA rows.'
      - name: team_abbrev
        description: 'Display helper, not a grain key. Latest-in-season value.'
      - name: owner_name
        description: 'Display helper, not a grain key. Latest-in-season value.'
      - name: player_name
        description: 'Display helper, not a grain key. Latest-in-season value for this player_id within the row''s season_year.'
      - name: display_name
        description: 'Display helper, not a grain key. Nickname-resolved player name; latest-in-season value.'
      - name: calculated_hitting_pts
        description: 'SUM of total_hitting_stat_pts from fct_weekly_player_performance. Catch-all hitting points under current-season scoring rules (cross-season comparable).'
      - name: calculated_pitching_pts
        description: 'SUM of total_pitching_stat_pts.'
      - name: calculated_points
        description: 'SUM of total_stat_pts -- combined hitting + pitching catch-all under current rules.'
      - name: platform_points
        description: 'SUM of player-level platform_points (kona''s appliedTotal). On active rows this is what the player contributed to the fantasy team''s score; on inactive/FA rows it is the player''s MLB-game fantasy points that were not credited to any team that day.'
      - name: platform_hitting_pts
        description: 'SUM of platform_hitting_pts (slot-based hitting split passthrough from the weekly fact).'
      - name: platform_pitching_pts
        description: 'SUM of platform_pitching_pts.'
      - name: negative_points
        description: 'SUM of per-day net-negative platform_points magnitudes; sum semantics aggregate cleanly across days and weeks.'
      - name: games_played
        description: 'SUM of MLB games_played from the weekly fact (where DH days carry games_played=2 upstream). Natural denominator for per-game analysis at season grain.'

  - name: fct_weekly_player_inactive_performance
    description: >
      Wide-format player-weekly fact for INACTIVE-slot performance (lineup_slot IN BE/IL/FA).
      Symmetric counterpart to fct_weekly_player_active_performance; together they cover the full universe of player-weeks at fct_weekly_player_performance.

      Grain: (season_year, matchup_period, player_id, wasted_bucket).
      wasted_bucket is part of the grain so a player who appears as ROSTERED_INACTIVE on team A AND as FA in the same matchup_period (rare: drop mid-week) gets two distinct rows.

      Carries counting + per-stat *_pts + calculated_* totals + player rate stats (informational).
      NO platform_* columns -- inactive contributions don't roll up to a team's ESPN home_score, so the symmetry with the active fact stops there.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - season_year
            - matchup_period
            - player_id
            - wasted_bucket
    columns:
      - name: season_year
        description: 'ESPN season year.'
        tests:
          - not_null
      - name: matchup_period
        description: 'Weekly matchup period.'
        tests:
          - not_null
      - name: team_id
        description: 'ESPN team identifier. NULL for the FA bucket (free agents have no fantasy team); set for the ROSTERED_INACTIVE bucket.'
      - name: player_id
        description: 'ESPN player identifier.'
        tests:
          - not_null
      - name: wasted_bucket
        description: '"FA" or "ROSTERED_INACTIVE". Grain dim distinguishing free agents from benched/IL players.'
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['FA', 'ROSTERED_INACTIVE']
      - name: calculated_points
        description: 'Rules-normalized total points the player would have produced if started. For inactive players, this is the "unrealized point production" / wasted-points concept.'
      - name: calculated_hitting_pts
        description: 'Hitting subtotal of calculated_points.'
      - name: calculated_pitching_pts
        description: 'Pitching subtotal of calculated_points.'
      - name: negative_points
        description: 'Magnitude (unsigned positive) of net-negative platform_points the player accrued while inactive.'

  - name: fct_weekly_team_inactive_performance
    description: >
      Team-grain rollup of inactive (BE/IL/FA) player performance.
      Symmetric counterpart to fct_weekly_team_active_performance for the inactive half of the player-weekly split.

      Two row flavors per (season_year, matchup_period):
        - N ROSTERED_INACTIVE rows (one per fantasy team; team_id set)
        - 1 FA row (league-wide; team_id NULL). The FA pool is not attributable to any single team.

      Carries counting + per-stat *_pts + calculated_* totals + the wasted_bucket dim + inactive_player_count.

      DOES NOT carry platform_points (no ESPN home_score equivalent for "the team's bench"), platform_hitting_pts / platform_pitching_pts (today's slot-driven hitting/pitching split miscategorizes bench pitchers; a position-driven version is a v1.x candidate), or team rates (bench IP isn't pitched -- rate semantics break).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - season_year
            - matchup_period
            - team_id
            - wasted_bucket
    columns:
      - name: season_year
        description: 'ESPN season year.'
        tests:
          - not_null
      - name: matchup_period
        description: 'Weekly matchup period.'
        tests:
          - not_null
      - name: team_id
        description: 'ESPN team identifier. NULL for the FA pool row (league-wide aggregate); set for ROSTERED_INACTIVE rows.'
      - name: wasted_bucket
        description: '"FA" or "ROSTERED_INACTIVE". Grain dim distinguishing the league-wide free-agent pool from per-team bench/IL waste.'
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['FA', 'ROSTERED_INACTIVE']
      - name: calculated_points
        description: 'Rules-normalized total of unrealized point production by inactive players (ROSTERED_INACTIVE: team-level bench/IL waste; FA: league-wide free-agent production unclaimed by any team).'
      - name: inactive_player_count
        description: 'Distinct players contributing to this bucket. Diagnostic for "how thin was this bench."'
      - name: negative_points
        description: 'Team rollup of inactive-player negative_points across the matchup_period.'

  - name: mart_draft_board
    description: >
      One wide row per draft pick: the pick (round / overall / keeper), the
      drafting team's labels, and the player's total season production
      (SUM of calculated_points, COALESCEd to 0 for never-played picks) --
      the draft-value join. Thin relational view over stg_draft; consumer
      surface for the Draft Recap tab.
      Grain: one row per (season_year, overall_pick).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - season_year
              - overall_pick
    columns:
      - name: season_year
        description: 'Season the draft belongs to.'
        tests:
          - not_null
      - name: overall_pick
        description: 'True overall selection number; the pick grain.'
        tests:
          - not_null
      - name: round_num
        description: 'Draft round.'
      - name: round_pick
        description: 'Pick within the round.'
      - name: keeper
        description: 'True for keeper picks (retained from the prior season).'
      - name: team_id
        description: 'Drafting fantasy team id.'
      - name: team_name
        description: 'Drafting team name (latest-in-season label).'
      - name: team_abbrev
        description: 'Drafting team abbreviation.'
      - name: owner_display
        description: 'Drafting team owner display (nickname > proper name), co-owners slash-joined.'
      - name: player_id
        description: 'ESPN stable numeric player identifier.'
      - name: player_name
        description: 'Display name (nickname-resolved), ESPN draft name as fallback.'
      - name: season_points
        description: 'Player total season calculated_points across every team / slot / status; 0 when the player never appeared in box scores.'
      - name: games_played
        description: 'Player total MLB games that season (DH days count 2); 0 when never played.'
