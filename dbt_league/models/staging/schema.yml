version: 2

models:
  - name: stg_box_scores
    description: >
      One row per player per scoring period, per league.
      Includes rostered players (with team_id and owner_name)
      and free agents (NULL team fields, lineup_slot='FA').
      A player_id is unique within a given (league_key, season_year, scoring_period) -- a player cannot simultaneously be on two fantasy rosters or be both rostered and FA within one league (the same MLB player CAN appear in multiple leagues).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - league_key
              - season_year
              - player_id
              - scoring_period
    columns:
      - name: league_key
        description: 'League registry key (config/leagues.yml), stamped into RAW at extract time. First-class dimension in every grain per the MLB-48 multi-league design.'
        tests:
          - not_null
      - name: season_year
        description: 'Year of MLB season opener.'
        tests:
          - not_null
      - name: scoring_period
        description: 'Daily ESPN scoring period number. Starts at 1 on league opening day.'
        tests:
          - not_null
      - name: matchup_period
        description: 'The weekly matchup period this scoring period belongs to.'
      - name: team_name
        description: 'ESPN fantasy team name. NULL for free agent rows.'
      - name: team_id
        description: 'ESPN stable numeric team identifier. NULL for free agent rows.'
      - name: team_abbrev
        description: 'Owner-set short code for the fantasy team. NULL for free agent rows. Used by output formatters for compact team labels in callouts.'
      - name: owner_name
        description: 'Team owner display name, extracted from the ESPN API. For co-managed teams, a slash-delimited list of first names. NULL for free agent rows.'
      - name: home_away
        description: 'Whether this player was on the home or away side of the fantasy matchup. NULL for free agent rows (FAs are not part of any matchup).'
      - name: player_name
        description: 'Player full name as reported by ESPN.'
      - name: player_id
        description: 'ESPN stable numeric player identifier.'
        tests:
          - not_null
      - name: position
        description: 'Player MLB position as reported by ESPN (e.g. SP, RP, 1B, DH). Typically 1 position; of little mechanical consequence.'
      - name: lineup_slot
        description: >
          The fantasy lineup slot this player occupied.
          Active slots are positions (1B, 2B, SS, OF, DH, UTIL, etc., plus SP/RP/P);
          BE = bench, IL = injured list, FA = free agent.
      - name: lineup_slot_category
        description: >
          Three-value bucket derived from lineup_slot.
          'pitching' = SP/RP/P, 'hitting' = any other active slot, 'inactive' = BE/IL/FA.
          Used downstream for the slot-stat-category compatibility filter (a hitter's hitting stats only count when slotted as a hitter, etc.). The filter is toggleable via the strict_slot_validity dbt var.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['pitching', 'hitting', 'inactive']
      - name: pro_team
        description: 'Player MLB team abbreviation as reported by ESPN.'
      - name: eligible_slots
        description: >
          VARIANT array of every fantasy lineup slot the player is eligible to fill (e.g. ['LF', 'OF', 'DH', 'UTIL', 'BE', 'IL'] for a corner outfielder).
          Sourced from the wrapper's Player object. kona returns this empty for rostered players.
          May contain flex-slot shapes like '2B/SS' or 'IF' that aren't position eligibilities per se; consumer (output formatters) filters to real-world positions for display.
      - name: points
        description: >
          Direct passthrough of ESPN's per-player platform-computed points for this scoring period (kona's appliedTotal).
          Slot-blind -- does not reflect slot-validity adjustments that ESPN's team-total scoring applies.
          Used as platform_points downstream.
      - name: breakdown
        description: 'Raw stat breakdown dict from ESPN. Keys are stat abbreviations (HR, RBI, K, etc). Used for stat-level league records.'
      - name: games_played
        description: 'Number of MLB games this player appeared in on this scoring period. 0 = did not play, 1 = single game, 2 = both legs of a doubleheader. Extracted from raw mRoster on doubleheader days (sums per-game splits the wrapper would otherwise overwrite).'
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1, 2]
      - name: display_name
        description: 'COALESCE of player_nicknames.nickname and player_name. Joined here so display_name propagates through every downstream model.'

  - name: stg_player_stat_breakdowns
    description: >
      One row per (league, season, scoring_period, team, player, stat_name) -- the breakdown VARIANT flattened into relational shape.
      No business filters applied here; staging stays a pure reshape.
      Business filters (active slots, counting stats) are applied at int_player_daily.
      Bench/IL rows are preserved so the inactive-performance facts can consume the same staging.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - league_key
              - season_year
              - scoring_period
              - player_id
              - stat_name
    columns:
      - name: league_key
        description: 'League registry key, carried from stg_box_scores.'
        tests:
          - not_null
      - name: season_year
        description: 'Year of MLB season opener.'
        tests:
          - not_null
      - name: scoring_period
        description: 'Daily ESPN scoring period number.'
        tests:
          - not_null
      - name: matchup_period
        description: 'The weekly matchup period this scoring period belongs to.'
      - name: team_id
        description: 'ESPN stable numeric team identifier. NULL for free agent rows; downstream models enforce not_null after the FA filter.'
      - name: team_name
        description: 'ESPN fantasy team name. NULL for free agent rows.'
      - name: owner_name
        description: 'Team owner display name. NULL for free agent rows.'
      - name: player_id
        description: 'ESPN stable numeric player identifier.'
        tests:
          - not_null
      - name: player_name
        description: 'Player full name as reported by ESPN.'
      - name: position
        description: 'Player MLB position as reported by ESPN.'
      - name: lineup_slot
        description: 'Fantasy lineup slot on this scoring period. Preserved so downstream models can filter active/bench/IL/FA.'
      - name: lineup_slot_category
        description: >
          Bucket derived from lineup_slot in stg_box_scores ('pitching' | 'hitting' | 'inactive').
          Carried through here so int_player_daily can filter slot-stat-category mismatches.
      - name: stat_name
        description: 'Stat abbreviation as a key in the breakdown VARIANT (HR, RBI, K, etc).'
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stat_classification')
                field: stat_name
      - name: stat_value
        description: 'Numeric value of the stat for this player on this scoring period.'
        tests:
          - not_null

  - name: stg_scoring_settings
    description: >
      Reshape raw scoring settings into one row per scored stat, per league.
      Surfaces only each league's CURRENT weights (max season_year with data, resolved per league); historical settings remain preserved in RAW.SCORING_SETTINGS but are not surfaced here.
      The current season's weights are applied universally -- including to historical stat breakdowns -- so cross-season scores are comparable under a common scale within a league.
      When multiple extractions exist for the same season, picks the most recent via ROW_NUMBER() on extracted_at.
      Grain: one row per (league_key, stat_name) (no season_year dimension; this is a per-league single-season reference table).
    columns:
      - name: league_key
        description: 'League registry key. Scoring weights are each league''s own rules -- every downstream weight join carries this key.'
        tests:
          - not_null
      - name: settings_season
        description: 'Season year these weights came from (the league''s latest loaded). Carried through for traceability.'
      - name: espn_stat_id
        description: 'ESPN internal numeric stat ID. Bridges raw API to seed-defined stat names.'
      - name: stat_name
        description: 'Human-readable stat abbreviation (HR, RBI, K, etc.) joined from stat_classification on espn_stat_id.'
      - name: stat_category
        description: 'hitting, pitching, fielding, or unknown -- passed through from stat_classification.'
      - name: points_per_unit
        description: 'Fantasy points awarded per unit of this stat under the current season''s scoring rules.'

  - name: stg_cbs__draft
    description: >
      CBS draft picks, reshaped from the parsed draft-results pages (MLB-90).
      A pure reshape: both the `round` and `team` view of every draft survive,
      playerless order-only rows included, because the two views disagree per
      season about what is knowable and discarding either here would destroy
      evidence. Selecting a view per season, dropping furniture, marrying
      2024's order skeleton to its player lists and stitching the 2025/26
      two-part drafts are assembly decisions and live in the intermediate
      layer -- the same staging/intermediate split the other CBS UI families
      use. Pick coordinates are NULL wherever the era's pages never recorded
      them (true order exists for 2025-26 only) and are deliberately not
      synthesised. player_cbs_id is VARCHAR and NULL across the plain-text
      early era; the two-way pseudo-ids 900/901 are real ids here.
      Grain: one row per (league_key, source_path, page_seq).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - league_key
              - source_path
              - page_seq
    columns:
      - name: league_key
        description: 'League registry key.'
        tests:
          - not_null
      - name: season_year
        description: 'Season the draft belongs to.'
        tests:
          - not_null
      - name: draft_key
        description: 'Stable per-draft key (e.g. "2026:2:Mega Draft"); a season can hold more than one draft.'
        tests:
          - not_null
      - name: view
        description: 'Which rendering the row came from: "round" (carries pick sequence) or "team" (per-franchise lists).'
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['round', 'team']
      - name: page_seq
        description: 'Sequential position of the row within its (draft_key, view); the ordering key the assembly layer reads.'
        tests:
          - not_null
      - name: round_num
        description: 'Draft round as PRINTED; NULL for the orderless era.'
      - name: round_pick
        description: 'Pick within the round as PRINTED; NULL for the orderless era.'
      - name: pick_no
        description: 'Overall pick number as PRINTED; NULL for the orderless era. Never synthesised.'
      - name: team_name_raw
        description: 'Drafting team name exactly as printed. No franchise id exists on a draft page; resolution is per-season and happens downstream.'
      - name: player_cbs_id
        description: 'CBS player id as VARCHAR; NULL across the plain-text early era. 900/901 are the Ohtani two-way pseudo-ids.'
      - name: player_name_raw
        description: 'Player name exactly as printed.'
      - name: is_playerless
        description: 'True for an order-only row: a pick slot printed with no player attached (all of 2009). A real row, not corruption.'
        tests:
          - not_null
      - name: page_total_fpts
        description: "The page's own total fantasy points. Reconciliation evidence only -- production is priced from the universal stats layer."
      - name: page_active_fpts
        description: "The page's own active fantasy points. Reconciliation evidence only."
      - name: source_path
        description: 'Repo-relative path of the captured page; the loader idempotency key.'
        tests:
          - not_null

  - name: stg_draft
    description: >
      One row per draft pick, flattened from the append-only RAW.DRAFT_PICKS
      snapshots (latest per season). Sourced from the espn-api wrapper's
      league.draft. keeper flags picks retained from the prior season (keeper
      league). Mirrors stg_team_owners over RAW.TEAM_OWNERS.
      Grain: one row per (league_key, season_year, overall_pick).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - league_key
              - season_year
              - overall_pick
    columns:
      - name: league_key
        description: 'League registry key.'
        tests:
          - not_null
      - name: season_year
        description: 'Season the draft belongs to.'
        tests:
          - not_null
      - name: overall_pick
        description: 'True overall selection number (1..N), snake order included.'
        tests:
          - not_null
      - name: round_num
        description: 'Draft round (1-based).'
      - name: round_pick
        description: 'Pick number within the round.'
      - name: player_id
        description: 'ESPN stable numeric player identifier.'
        tests:
          - not_null
      - name: player_name
        description: 'Player full name, resolved at extract time via the wrapper.'
      - name: team_id
        description: 'ESPN numeric id of the drafting fantasy team.'
      - name: keeper
        description: 'True when the pick was a keeper retained from the prior season.'

  - name: stg_transactions
    description: >
      One transaction event leg per row, flattened from the append-only
      RAW.TRANSACTIONS snapshots (latest per league + season) -- ESPN's
      full-season add/drop/trade log, captured from the communication message
      board (MLB-16). The lineup start/sit chatter (messageTypeId 188) that
      shares the feed is dropped; add (178), drop (179), and trade (224/239/244)
      legs are kept and normalized to directed player movement (a NULL team
      side means free agency). This is the platform-neutral event shape a
      future stg_cbs__transactions (over RAW.CBS_TRANSACTIONS) converges onto.
      Grain: one row per (league_key, season_year, transaction_id, player_id,
      source_message_type_id).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - league_key
              - season_year
              - transaction_id
              - player_id
              - source_message_type_id
    columns:
      - name: league_key
        description: 'League registry key.'
        tests:
          - not_null
      - name: season_year
        description: 'Season the transaction belongs to.'
        tests:
          - not_null
      - name: transaction_id
        description: 'ESPN message-board topic id; groups the legs of one transaction (the two sides of a trade, an add and its paired drop).'
        tests:
          - not_null
      - name: source_message_type_id
        description: 'Raw ESPN messageTypeId, kept for traceability: 178 add, 179 drop, 224/239/244 trade legs.'
        tests:
          - not_null
      - name: event_type
        description: 'Normalized event kind.'
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['add', 'drop', 'trade']
      - name: player_id
        description: 'ESPN stable numeric player identifier (the moved player).'
        tests:
          - not_null
      - name: event_ts
        description: 'When the transaction posted (from the message epoch-ms date).'
      - name: from_team_id
        description: 'Team the player left. NULL when arriving from free agency (always NULL on an add).'
      - name: to_team_id
        description: 'Team the player joined. NULL when departing to free agency (always NULL on a drop). For the 239 trade variant, resolved from `for` when `to` is the -1 sentinel.'
      - name: counterparty_team_id
        description: "Raw `for` team on the message: the trade counterparty on 239 legs, NULL otherwise."

  - name: stg_team_owners
    description: >
      Per-league, per-season team -> owner bridge, flattened from
      RAW.TEAM_OWNERS (latest snapshot per league + season). owner_id is
      the platform's stable owner key (ESPN member GUID) -- the join key
      dim_owner and the owner_nicknames seed use.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - league_key
              - season_year
              - team_id
              - owner_id
    columns:
      - name: league_key
        tests:
          - not_null
      - name: season_year
        tests:
          - not_null
      - name: team_id
        tests:
          - not_null
      - name: owner_id
        tests:
          - not_null

  - name: stg_matchup_scores
    description: >
      One row per (league_key, season_year, matchup_period, team_id): the
      team's FINAL ESPN platform score for the matchup, read from the
      wrapper's home_score / away_score fields at the last scoring period
      of the matchup (the field is cumulative through the queried period).
      Matchup-grain sibling of stg_box_scores -- the raw box-score JSON
      carries two grains, and each gets its own staging reshape. This is
      ESPN's authoritative team total (slot-aware, inclusive of
      commissioner adjustments); deliberately NOT derivable from player
      rows.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - league_key
              - season_year
              - matchup_period
              - team_id
    columns:
      - name: league_key
        tests:
          - not_null
      - name: season_year
        description: 'ESPN season year.'
        tests:
          - not_null
      - name: matchup_period
        description: 'Weekly matchup period.'
        tests:
          - not_null
      - name: team_id
        description: 'ESPN stable numeric team identifier for one side of the matchup.'
        tests:
          - not_null
      - name: platform_points
        description: 'The wrapper''s final team score for the matchup (home_score or away_score). Unrounded float; the team fact rounds to 1 decimal at consumption.'

  - name: stg_matchup_pairs
    description: >
      One row per (league_key, season_year, matchup_period, home_team_id,
      away_team_id): the weekly matchup spine (who played whom, with
      home/away sides) extracted from the raw box-score JSON. Pairs are
      collected across every scoring period of the matchup -- first
      appearance wins -- so a capture glitch on any single day cannot
      drop a pairing.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - league_key
              - season_year
              - matchup_period
              - home_team_id
              - away_team_id
    columns:
      - name: league_key
        tests:
          - not_null
      - name: season_year
        tests:
          - not_null
      - name: matchup_period
        tests:
          - not_null
      - name: home_team_id
        description: 'ESPN team id of the home side.'
        tests:
          - not_null
      - name: away_team_id
        description: 'ESPN team id of the away side.'
        tests:
          - not_null

  - name: stg_roster_settings
    description: >
      Long-form reshape of the raw rosterSettings payload (latest
      snapshot per league + season): one row per (league_key,
      season_year, setting_type, espn_id). setting_type
      'lineup_slot_count' rows carry lineupSlotCounts (lineup slot id ->
      configured starters); 'position_limit' rows carry positionLimits
      (MLB position id -> max rostered, -1 = ESPN "No Limit"). Pure
      reshape -- the slot-name map, display shaping, and active-slot
      flag live in dim_roster_slot_counts.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - league_key
              - season_year
              - setting_type
              - espn_id
    columns:
      - name: league_key
        tests:
          - not_null
      - name: season_year
        tests:
          - not_null
      - name: setting_type
        description: 'Which ESPN dictionary the row came from.'
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['lineup_slot_count', 'position_limit']
      - name: espn_id
        description: 'Lineup slot id or MLB position id, per setting_type.'
        tests:
          - not_null
      - name: setting_value
        description: 'Configured starters, or raw position limit (-1 = No Limit).'
        tests:
          - not_null

  - name: stg_cbs__team_owners
    description: >
      The CBS team -> owner bridge in stg_team_owners' exact grain, so the
      shared owner dimension chain (dim_owner -> dim_team_owner) serves
      both platforms. Seed-curated identity (CBS serves no owner ids;
      'cbs-' slugs minted in cbs_team_owners, names on the shared
      owner_nicknames seed). CURRENT-ERA ONLY: rows stamp the latest
      captured season -- historical custody is MLB-64's chain-of-custody
      work, which grows this staging per-season with no shape change.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - league_key
              - season_year
              - team_id
              - owner_id
    columns:
      - name: team_id
        description: 'CBS franchise_id (the facts'' team_id).'
        tests:
          - not_null
      - name: owner_id
        description: 'Minted ''cbs-'' slug; FK into owner_nicknames via dim_owner.'
        tests:
          - not_null

  - name: stg_cbs__standings
    description: >
      CBS adapter (#2) F7 standings -- the platform-DELIVERED period-end
      standings a non-H2H points league serves in place of matchup-derived
      ones. One row per (league_key, season_year, period, team_id): a team's
      cumulative season-to-date points and rank at the close of each scoring
      period. Read straight from raw.cbs_standings (one captured file per
      period, content-verified at capture); latest snapshot per period wins.
      Currently 2026 only (the CBS API is current-season); historical seasons
      arrive from the parsed UI pages (MLB-53) into the same shape.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - league_key
              - season_year
              - period
              - team_id
    columns:
      - name: league_key
        description: 'League registry key (config/leagues.yml), stamped into RAW at extract time. First-class dimension in every grain per the MLB-48 multi-league design.'
        tests:
          - not_null
      - name: season_year
        description: 'MLB season year the standings describe.'
        tests:
          - not_null
      - name: period
        description: 'CBS scoring-period number (1-indexed). The standings history key -- each captured file echoes the period it served.'
        tests:
          - not_null
      - name: team_id
        description: 'CBS stable numeric fantasy-team id (rename-proof; the dim_franchise continuity key, MLB-64).'
        tests:
          - not_null
      - name: team_name
        description: 'Fantasy team name as of this period (can change across a season; the mart takes the latest for display).'
      - name: division_name
        description: 'CBS division label. Cosmetic in a points league (the overall rank is league-wide); carried for display.'
      - name: standings_rank
        description: 'League-wide rank (1 = first) at the close of this period. Ties can leave gaps in the sequence.'
        tests:
          - not_null
      - name: points
        description: 'Cumulative season-to-date fantasy points -- the platform''s own season FPTS total, the standings currency of a points league. Grows period over period (asserted first<=last at capture).'
        tests:
          - not_null

  - name: stg_cbs__player_season_stats
    description: >
      CBS adapter (#2) player-season performance, LONG form and
      canonical-bridged: one row per (league_key, season_year, player_id,
      stat_name). The season-grain half of F1 -- the record book's raw
      material. Each player object's native CBS stat keys are unpivoted and
      bridged cbs_key -> canonical_key (cbs_stat_map) -> stat_name (dim_stat),
      so CBS emits the SAME stat_name vocabulary the ESPN DAG speaks and the
      shared dim_stat metadata applies. Unmapped keys drop at the INNER JOINs.
      Hitter + pitcher universes share the model (params.position); a player
      scores in one universe (zero real-id overlap 2004-2025), so
      (player_id, season_year, stat_name) is unique. Season FPTS bridges to
      PLATFORM_POINTS; the display key INN drops (OUTS carries the innings
      signal); the two-way sentinels (900/901) are absent from the universes.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - league_key
              - season_year
              - player_id
              - stat_name
    columns:
      - name: league_key
        description: 'League registry key.'
        tests:
          - not_null
      - name: season_year
        description: 'MLB season year (2004-2025 from the API archive).'
        tests:
          - not_null
      - name: player_id
        description: 'CBS stable numeric player id.'
        tests:
          - not_null
      - name: player_name
        description: 'Player name as CBS reported it that season.'
      - name: universe
        description: '''hitting'' or ''pitching'' -- which season universe the row came from (params.position). Context, not grain (a player is in one).'
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['hitting', 'pitching']
      - name: stat_name
        description: 'The bridged ESPN-namespace stat name (HR, K, OUTS, IRSTR, PLATFORM_POINTS...). FK to dim_stat.'
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_stat')
                field: stat_name
      - name: stat_category
        description: 'hitting | pitching | fielding | total, from dim_stat.'
      - name: stat_value
        description: 'The season value (counting total, rate, or season FPTS). Thousands separators stripped; non-numeric values dropped upstream. NOTE the population: the CBS season archive is free-agent-only (the MLB-70 pivot''s reason) -- this model anchors reconciliation, it is NOT the record book''s stats source.'
        tests:
          - not_null

  - name: stg_cbs__rosters
    description: >
      CBS adapter (#2) F3 daily rosters -- the perishable fantasy layer the
      capture program exists to save (dies at rollover; exists only for
      captured dates, 2026 season). One row per (league_key, roster_date,
      team_id, player_id): the deployed slot (roster_pos) and the
      started-vs-benched split (roster_status A/RS) -- in a daily-lineup
      points league the active set IS the lineup. Latest load per date
      wins. Consumers: the CBS almanac's team tabs (latest date); MLB-63's
      active-set membership reconstruction (full range).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - league_key
              - roster_date
              - team_id
              - player_id
    columns:
      - name: league_key
        description: 'League registry key.'
        tests:
          - not_null
      - name: season_year
        description: 'Season the snapshot belongs to.'
        tests:
          - not_null
      - name: roster_date
        description: 'The date this roster snapshot describes (the point= param, verified by content at capture).'
        tests:
          - not_null
      - name: team_id
        description: 'CBS stable numeric fantasy-team id.'
        tests:
          - not_null
      - name: team_name
        description: 'Fantasy team name as of the snapshot.'
      - name: team_abbr
        description: 'CBS team abbreviation.'
      - name: division_name
        description: 'CBS division label (cosmetic in a points league).'
      - name: player_id
        description: 'CBS stable numeric player id (two-way pseudo-ids included). Joins the calculated_ lens via int_cbs__player_season_stats / the crosswalk.'
        tests:
          - not_null
      - name: player_name
        description: 'Player name as CBS serves it.'
      - name: roster_pos
        description: 'Deployed slot on this date (C/1B/2B/.../OF/U/P/RS...).'
      - name: roster_status
        description: 'A = active (started) | RS = reserve (benched) -- the daily scoring split.'
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['A', 'RS']
      - name: eligible_positions
        description: 'CBS eligible-positions display string (context).'
      - name: pro_team
        description: 'MLB team abbreviation at snapshot time (context).'

  - name: stg_cbs__ui_standings
    description: >
      Season FINAL standings from the parsed UI history (MLB-53), one row
      per (league_key, season_year, franchise_id), 2001-2025. Carries the
      champions list (is_champion), the league-shape timeline
      (teams_in_season), and the per-season name -> franchise_id map every
      other UI family resolves against (names drift AND get reused across
      franchises -- Foster's Folly is id 13 through 2019 and id 30 from
      2021 -- so never join names across seasons).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - league_key
              - season_year
              - franchise_id
    columns:
      - name: league_key
        tests: [not_null]
      - name: season_year
        tests: [not_null]
      - name: franchise_id
        description: 'CBS stable franchise id (from the team-overview hrefs) -- the provenance SPINE per the 2026-07-12 design; owner-lineage overlays ride MLB-64.'
        tests: [not_null]
      - name: team_name
        description: 'The franchise''s name THAT season.'
        tests: [not_null]
      - name: standings_rank
        tests: [not_null]
      - name: is_champion
        description: 'rank = 1 -- the first officially crowned champions in league history.'
      - name: total_points
        tests: [not_null]
      - name: teams_in_season
        description: 'League shape: 16 except 15 (2002) and 12 (2020).'

  - name: stg_cbs__ui_rosters
    description: >
      Year-end roster ANCHORS (MLB-55), one row per raw anchor row with
      franchise identity resolved through the per-season name map --
      CONFIRMED membership, the states the MLB-63 walk-back starts from.
      Own%/Start% are GLOBAL-CBS and ABSOLUTE (verified: rostered players
      below the 1-in-16 local floor); est_start_share = start/own is the
      conditional activity estimator for the no-lineup-log era (NULL when
      own = 0 -- undefined, lowest confidence). Anything built on it must
      carry an estimated-vs-confirmed provenance flag. Row preservation
      pinned by assert_cbs_ui_rosters_rowcount_preserved.
    columns:
      - name: league_key
        tests: [not_null]
      - name: season_year
        tests: [not_null]
      - name: franchise_id
        tests: [not_null]
      - name: player_name
        description: 'Display-ordered name (First Last), flipped from the page''s ''Last, First''. Identity resolution to ids is a later pass; the walk-back joins names per (season, franchise).'
        tests: [not_null]
      - name: roster_status
        description: 'Year-end A (active) / RS (reserve).'
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['A', 'RS']
      - name: est_start_share
        description: 'start_pct/own_pct capped at 1 -- the estimated share of rostered time spent ACTIVE, for eras without lineup logs. An ESTIMATE, never confirmed data.'

  - name: stg_cbs__ui_transactions
    description: >
      The league's full movement record normalized (MLB-54): one row per
      player-action 2001-2026, era verb vocabulary mapped to move types
      (add | drop | trade_in | activate | reserve | slot_move), slot
      transitions and trade counterparties extracted, chronology parsed
      (the 2001-era log is date-grain; effective_date can precede the
      timestamp -- retroactive edits). Unmapped phrases land NULL and fail
      the tests loudly. THE FIDELITY MAP: 2001-2003 + 2021+ carry lineup
      verbs (day-grain active sets); 2004-2020 membership moves only.
      row_seq walks newest-first: ascending = walk-back order.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - league_key
              - season_year
              - row_seq
              - entry_seq
    columns:
      - name: league_key
        tests: [not_null]
      - name: season_year
        tests: [not_null]
      - name: txn_date
        description: 'The transaction''s log date (timestamp''s date part; the 2001-era log is date-only).'
        tests: [not_null]
      - name: effective_date
        description: 'The scoring-effective date where the era states one.'
      - name: franchise_id
        description: 'The acting team: the modern /teams/{id} link (same id space as the franchise map, verified) else name-resolved per season. NULL where neither resolves (2026 trades name-resolve only after final standings exist; mid-season renames can miss the year-end map).'
      - name: player_cbs_id
        description: 'CBS player id where the era links it (~2013+, 33.5k rows) -- joins the calculated_ lens directly.'
      - name: move_type
        description: 'The normalized move. Slot moves are ACTIVE-lineup repositioning; trade_in is the receiving side (both directions exist, sharing txn_row_key).'
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['add', 'drop', 'trade_in', 'activate', 'reserve', 'slot_move']
      - name: action_raw
        description: 'The era''s verbatim phrase (''Signed'', ''Moved from DH to 1B''...). The normalizer''s audit trail.'
        tests: [not_null]

  - name: stg_mlb__fielding_seasons
    description: >
      Season-grain games-by-position from the fielding yearByYear sweep,
      typed and mapped to the CBS position vocabulary (LF/CF/RF/OF -> OF,
      P/SP/RP -> P; PH/PR-class codes map NULL). Platform-neutral like the
      other stg_mlb__ models. Raw split grain -- a traded player carries one
      split per team per season, so (mlbam_id, season_year, position) is NOT
      unique; consumers SUM to their grain (int_cbs__eligibility_windows).
      Full careers ride here including pre-league seasons, which the
      'played 20 games LAST year' test needs for the league's own first
      seasons.
    columns:
      - name: mlbam_id
        tests:
          - not_null
      - name: cbs_position
        description: 'CBS slot-vocabulary position, or NULL for non-position codes (dropped by consumers).'
        tests:
          - accepted_values:
              arguments:
                values: ['C', '1B', '2B', '3B', 'SS', 'OF', 'DH', 'P']
              config:
                where: "cbs_position is not null"

  - name: stg_mlb__game_positions
    description: >
      Per-game positions played (loader family 'gamepos' re-walking the
      gamelog files for the split-level positionsPlayed; pitching games
      constant P), typed and mapped to the CBS position vocabulary. The DATE
      half of the eligibility derivation: season-grain fielding says how
      many games at a position, this says WHEN the Nth happened
      (after-achievement semantics -- eligible from the 10th game this
      year). One game can emit multiple rows that are one game at slot
      vocabulary (LF then CF mid-game; a position player's mop-up P inning
      rides in from both group files) -- consumers count DISTINCT game_pk,
      never raw rows. Platform-neutral.
    columns:
      - name: mlbam_id
        tests:
          - not_null
      - name: game_pk
        tests:
          - not_null
      - name: cbs_position
        tests:
          - accepted_values:
              arguments:
                values: ['C', '1B', '2B', '3B', 'SS', 'OF', 'DH', 'P']
              config:
                where: "cbs_position is not null"

  - name: stg_mlb__player_game
    description: >
      The universal baseball layer at game grain (MLB-70/MLB-62), LONG form
      and canonical-keyed: one row per (mlbam_id, stat_group, game,
      canonical_key) from the MLB Stats API gamelogs. Platform-NEUTRAL -- no
      league_key; this is the what-a-player-did spine every league's fantasy
      layer (membership + scoring rules) joins onto. statsapi keys map via
      the mlb_stat_map seed, (statsapi_key, stat_group)-keyed because the
      API reuses names across disciplines (pitching hits = hits allowed).
      Speaks canonical_key, NOT ESPN stat_name: the universal layer carries
      stats the ESPN bridge doesn't (inherited_runners feeds the IRSTR
      derivation); consumers bridge via dim_stat.canonical_key. Non-mapped
      dispositions (rate strings, the inningsPitched notation, summary,
      duplicates, no-canonical keys) drop at the INNER JOIN.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - mlbam_id
              - stat_group
              - game_pk
              - game_date
              - game_index
              - canonical_key
    columns:
      - name: mlbam_id
        description: 'MLBAM player id -- the universal layer''s player key. Crosswalks to CBS ids via stg_cbs__mlbam_crosswalk.'
        tests:
          - not_null
      - name: season_year
        description: 'MLB season year (full careers of crosswalked players; 1991-present, sparse pre-2008).'
        tests:
          - not_null
      - name: stat_group
        description: 'statsapi discipline group of this game line. Scopes the key mapping AND the two-way identity split (MLB-68: hitting rows feed the (Batter) pseudo-id, pitching rows the (Pitcher) one).'
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['hitting', 'pitching']
      - name: game_date
        description: 'Game date as statsapi reports it.'
        tests:
          - not_null
      - name: game_pk
        description: 'MLB game id. Doubleheader legs get distinct game_pks (game_number tells 1 from 2). One known feed quirk: a single (mlbam_id, stat_group, game_pk) appears twice -- two same-date partial lines of one game -- kept verbatim, distinguished by game_index; additive sums stay correct.'
        tests:
          - not_null
      - name: game_number
        description: 'Game number within the day (doubleheader marker).'
      - name: game_index
        description: 'Load-order index within the (player, season, group) gamelog file; the verbatim-grain tiebreak.'
        tests:
          - not_null
      - name: team_id
        description: 'MLBAM team id the player appeared for in this game (era-true -- midseason trades switch it game-over-game).'
      - name: team_name
        description: 'MLB team name for team_id.'
      - name: opponent_team_id
        description: 'MLBAM opponent team id.'
      - name: opponent_team_name
        description: 'MLB opponent team name.'
      - name: is_home
        description: 'True when the player''s team was home.'
      - name: is_win
        description: 'True when the player''s team won the game.'
      - name: canonical_key
        description: 'FK to canonical_stats -- the platform-neutral stat slug (mlb_stat_map bridge).'
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('canonical_stats')
                field: canonical_key
      - name: stat_category
        description: 'hitting | pitching | general, from the seed (matches canonical_stats). games_played is the one ''general'' key: 1 on every gamelog row of BOTH groups -- sum it group-scoped or a batting pitcher''s games double.'
      - name: stat_value
        description: 'The per-game value. Mapped keys are integer-typed in the feed; cast defensively via try_to_double.'
        tests:
          - not_null

  - name: stg_cbs__mlbam_crosswalk
    description: >
      The CBS player id -> MLBAM id bridge, staged from the team-aware
      crosswalk build (extract/mlb_crosswalk.py, 0 collisions since
      2026-07-10). PLATFORM-level, not league-level -- no league_key;
      league scoping enters where membership and scoring rules join.
      stat_group_scope implements MLB-68: CBS splits a two-way player into
      discipline pseudo-ids suffixed '(Batter)'/'(Pitcher)' (Ohtani 900/901,
      both -> MLBAM 660271, the one sanctioned shared pair); the scope
      column turns the suffix into a join predicate so hitting gamelogs
      feed the batter id and pitching gamelogs the pitcher id, while
      unsuffixed players (scope NULL) take both groups.
    tests:
      - dbt_utils.expression_is_true:
          arguments:
            # '%_COLLISION', not '%\_COLLISION': neither engine gives LIKE a
            # default escape character, so the backslash was never escaping
            # anything on Snowflake -- `_` was already matching any single
            # char there. DuckDB read the same literal as a REAL backslash,
            # so the predicate was always false and the test passed
            # vacuously. This spells Snowflake's actual behaviour, which
            # both engines now share. (Every _COLLISION value carries a
            # literal underscore, so the same 10 rows match either way.)
            expression: "not (match_method like '%_COLLISION' and cbs_player_id not like 'ui-only-%')"
    columns:
      - name: cbs_player_id
        description: 'CBS stable numeric player id (string-typed as CBS serves it). Two-way pseudo-ids included.'
        tests:
          - not_null
          - unique
      - name: cbs_player_name
        description: 'Player name as CBS spells it, including the two-way discipline suffix.'
      - name: mlbam_id
        description: 'MLBAM player id. NOT unique: the two-way split maps two CBS pseudo-ids onto one MLBAM id.'
        tests:
          - not_null
      - name: mlbam_name
        description: 'Player name as statsapi spells it.'
      - name: match_method
        description: 'How the crosswalk matched this player; ui_-prefixed methods mark the name-keyed UI-history population. A _COLLISION suffix on a REAL CBS id would mean an unreviewed shared id survived the build (fails the model-level expression test loudly); on ui_ rows collisions are expected -- era spellings of one player -- and staging already dedupes them to one identity per mlbam.'
      - name: stat_group_scope
        description: 'NULL = this CBS id takes both stat groups (the normal case). ''hitting''/''pitching'' = discipline pseudo-id; only that group''s gamelog rows feed it.'
        tests:
          - accepted_values:
              arguments:
                values: ['hitting', 'pitching']

  - name: stg_cbs__scoring_settings
    description: >
      CBS adapter (#2) scoring rules -- the F4 weights that price the
      calculated_ lens (MLB-62). One row per scored category from the
      platform's own scoring_rules feed (raw.cbs_config), current season's
      snapshot only, applied universally across seasons (the ESPN
      stg_scoring_settings convention). canonical_key is the SCORING
      PRIMITIVE a points engine multiplies: the INN row is translated to
      outs_recorded at points/3 (CBS pays 1 pt/out -- verified 587/587
      against 2025 season FPTS where floor(INN) reconciles only 559/587),
      with the verbatim feed values riding in cbs_key/feed_points. QS and
      IRSTR pass through as canonicals with no statsapi feed key -- engines
      DERIVE their per-game values. The cbs_stat_map seed's points_2026
      mirrors this feed; assert_cbs_scoring_feed_matches_seed keeps them
      in lockstep.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - league_key
              - cbs_key
    columns:
      - name: league_key
        description: 'League registry key, from the raw config row.'
        tests:
          - not_null
      - name: settings_season
        description: 'Season of the surfaced rules snapshot (max season with a scoring_rules capture, latest snapshot wins).'
        tests:
          - not_null
      - name: cbs_key
        description: 'The category key exactly as the rules feed names it (R, TB, INN, IRSTR...).'
        tests:
          - not_null
      - name: rules_group
        description: 'CBS''s own grouping of the category.'
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Batting', 'Pitching']
      - name: canonical_key
        description: 'The scoring primitive (canonical_stats slug) an engine multiplies. outs_recorded for the INN row; quality_starts / inherited_runners_stranded are engine-derived.'
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('canonical_stats')
                field: canonical_key
      - name: stat_name
        description: 'ESPN-namespace stat name where the vocabulary bridges (dim_stat convergence); NULL where it doesn''t.'
      - name: stat_category
        description: 'hitting | pitching, from cbs_stat_map. The universe/group scope guard downstream joins use.'
        tests:
          - not_null
      - name: points_per_unit
        description: 'The EFFECTIVE weight per unit of the scoring primitive (feed_points/3 for INN -> outs). Negative for penalty categories (HA/BBI/ER).'
        tests:
          - not_null
      - name: feed_points
        description: 'The verbatim points value as the rules feed lists it (3/inning for INN).'
        tests:
          - not_null
