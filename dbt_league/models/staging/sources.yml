version: 2

sources:
  - name: raw
    database: ESPN_FANTASY
    schema: RAW
    # Freshness: the four settings-style snapshots carry an extracted_at
    # load timestamp and are re-extracted at least once per season (they're
    # event-driven, not weekly), so their thresholds are seasonal -- warn at
    # ~7 months means "a new season started and the settings were never
    # re-pulled." box_scores is the weekly-cadence table but has no load
    # timestamp column yet, so it carries no freshness config (adding
    # extracted_at to the box-score extract is the enabling change).
    #
    # MLB-57: every raw table carries league_key -- the registry key
    # (config/leagues.yml) the extract stamps on each row it loads.
    # Payloads stay platform-shaped and verbatim; league_key is load
    # metadata. Legacy rows were backfilled to the default ESPN league by
    # tools/migrate_raw_league_key.py.
    tables:
      - name: box_scores
        description: "Raw ESPN Fantasy box score JSON, one row per scoring period. Each row contains all matchups for that day with full player lineups and stat breakdowns."
      - name: scoring_settings
        description: "Raw ESPN Fantasy scoring settings JSON, append-only. Each row is a snapshot of the league's scoring weights for a season, captured at extraction time. The staging model picks the latest snapshot per season."
        config:
          loaded_at_field: extracted_at
          freshness:
            warn_after: {count: 210, period: day}
            error_after: {count: 420, period: day}
      - name: roster_settings
        description: "Raw ESPN Fantasy roster settings JSON, append-only. Each row is a snapshot of lineup slot counts, position maximums, and related roster constraints for a season."
        config:
          loaded_at_field: extracted_at
          freshness:
            warn_after: {count: 210, period: day}
            error_after: {count: 420, period: day}
      - name: team_owners
        description: "Raw ESPN team -> owner mapping, append-only. Each row is a VARIANT array of {team_id, owner_id, first_name, last_name} for a season, captured from league.teams[].owners. owner_id is the stable ESPN member GUID the box-score extract discards; this is the bridge that lets the owner_nicknames seed join the data. Staging picks the latest snapshot per season."
        config:
          loaded_at_field: extracted_at
          freshness:
            warn_after: {count: 210, period: day}
            error_after: {count: 420, period: day}
      - name: draft_picks
        description: "Raw ESPN draft board, append-only. Each row is a VARIANT array of pick dicts {overall_pick, round_num, round_pick, player_id, player_name, team_id, keeper} for a season, serialized from the espn-api wrapper's league.draft (player names + drafting team resolved at extract time). keeper flags picks retained from the prior season (keeper league). Staging picks the latest snapshot per season."
        config:
          loaded_at_field: extracted_at
          freshness:
            warn_after: {count: 210, period: day}
            error_after: {count: 420, period: day}
      - name: transactions
        description: "Raw ESPN transaction board, append-only (MLB-16). Each row is a VARIANT array of verbatim ACTIVITY_TRANSACTIONS topic objects for a season, paged to exhaustion from the communication endpoint (view=kona_league_communication) -- ESPN's durable full-season add/drop/trade log for baseball (the mTransactions2 view is a current-scoring-period decoy). Each topic nests messages carrying messageTypeId (178 add, 179 drop, 224/239/244 trade legs, 188 lineup), targetId (playerId), and from/to/for team ids. stg_transactions interprets the vocabulary. Current-season only (prior seasons unreachable via leagueHistory's topics filter). Staging picks the latest snapshot per season."
        config:
          loaded_at_field: extracted_at
          freshness:
            warn_after: {count: 210, period: day}
            error_after: {count: 420, period: day}

      # CBS raw archives (MLB-59 loader, extract/cbs_load.py) -- same
      # warehouse, same RAW schema, platform-prefixed tables. Payloads land
      # VERBATIM in a `payload` VARIANT with envelope-lineage columns
      # (endpoint, params, captured_at, http_status, source_path); every row
      # carries league_key. Staging (stg_cbs__*) is the convergence boundary.
      # No freshness config: the fantasy-layer tables are captured on the
      # weekly runbook, the history tables are a one-time backfill; captured_at
      # exists but seasonal thresholds don't fit a mixed-cadence archive.
      - name: cbs_standings
        description: "Raw CBS period-end standings (league/standings/overall?period=N), one row per scoring period. payload.body.overall_standings.divisions[].teams[] carries cumulative season-to-date rank + points. The platform-delivered F7 feed -- a non-H2H points league has no matchups to derive standings from."
      - name: cbs_season_stats
        description: "Raw CBS season-grain player stats (league/stats?timeframe=YYYY), one row per season universe file. params.position distinguishes the hitter universe (absent) from the pitcher universe (position=P). payload.body.league_stats.players[] carries flat native stat keys + the platform's own season FPTS -- the MLB-62 reconciliation anchor."
      - name: cbs_gamelogs
        description: "Raw CBS per-game player stat lines (players/gamelog), exploded to one row per game entry. game VARIANT = {game_date, opponent, ..., stats:{native per-game keys}}. Appearance-grain for pitchers, team-schedule-grain for hitters (G flags real appearances). No per-game FPTS -- MLB-62 recomputes from scoring weights."
      - name: cbs_rosters
        description: "Raw CBS 2026 daily rosters (league/rosters?point=YYYYMMDD&team_id=all), one row per date. payload.body.rosters.teams[].players[] carries the deployed slot (roster_pos) and the started/sat split (roster_status A/RS) -- the perishable fantasy layer, F3."
      - name: cbs_config
        description: "Raw CBS config snapshots (details/teams/owners/league_rules/scoring_rules), one row per snapshot with a config_kind column. scoring_rules.categories carries the F4 scoring weights (keyed on the stat name); teams/owners carry F8 team + owner identity."
      - name: cbs_transactions
        description: "Raw CBS 2026 transaction-log snapshots (league/transaction-list/log), one row per snapshot. The rolling add/drop/trade window -- F10, current-season only at the API (full history rides the UI capture, MLB-47)."

      # Universal baseball layer (MLB-70, extract/mlb_stats.py + mlb_load.py)
      # -- the platform-NEUTRAL stats spine sourced from the public MLB Stats
      # API (statsapi.mlb.com). These tables carry NO league_key by design:
      # they are the shared what-a-player-did layer that every league's
      # fantasy layer (membership + scoring rules) joins onto. The pivot's
      # reason: CBS's league/stats history is free-agent-only (0/480
      # currently-rostered players present), so the baseball layer must come
      # from a complete source.
      - name: mlb_gamelogs
        description: "Raw MLB Stats API per-game logs, one row PER GAME per (player, season, stat_group) -- the deliberate explosion; each game's stat split lands verbatim in the game VARIANT ({stat, team, opponent, isHome, isWin, date, game.gamePk}). 595K+ rows, 2,227 players, full careers of every crosswalked CBS player (sparse pre-2008). stat_group 'hitting'|'pitching' scopes each row's stat keys -- the MLB-68 two-way split rides it."
      - name: mlb_season_stats
        description: "Raw MLB Stats API season aggregates (yearByYear), one row per (player, season, stat_group). Carries the season team -- the crosswalk's team-evidence source -- and serves as the gamelog-completeness cross-check (season totals vs per-game sums)."
      # Parsed UI history (extract/cbs_ui_parse.py over the MLB-47 captured
      # pages) -- the fantasy-layer history the API denies, structured.
      # Idempotent by source_path; verbatim-leaning (era phrases land raw).
      - name: cbs_ui_standings
        description: "Season FINAL standings parsed from the year-by-year dashboard pages, 2001-2025 (the in-progress season's card is empty). One row per (season, franchise): rank, batting/pitching/total points, behind. Carries the per-season team_name -> franchise_id map (from the single-quoted team-overview hrefs) that every other UI family resolves against -- names drift AND get reused across franchises, so the map is per-season by design."
      - name: cbs_ui_rosters
        description: "Year-end roster anchors parsed from the roster-report pages, 2003-2025, ALL teams (the early-era single-team capture gap was closed 2026-07-12 by re-sweep). One row per (season, team, player): name, primary pos, MLB team/status, GLOBAL Own%/Start% (absolute across all CBS leagues -- verified: rostered players appear below the 1-in-16 local floor), year-end A/RS status, deployed slot, era-dependent eligibility. franchise_id is NULL in raw (filename ids are lies; league-wide pages carry names only) -- staging resolves it."
      - name: cbs_ui_transactions
        description: "The full transaction history parsed from the start_row-paginated reports, 2001-2026: 52,369 player-actions across 24,388 transactions. Era action phrases land RAW (Added/Dropped/Signed/Released/Traded from X/Activated/Benched/Reserved/Moved ...); staging normalizes to move types. Modern rows carry CBS player ids + /teams/{id}; trades are one transaction id across two per-side rows. Window-overlap duplicates were merged at parse (the capture's stride overlapped page boundaries until bgFan rows were counted)."
      - name: cbs_mlbam_crosswalk
        description: "CBS player id -> MLBAM id bridge (extract/mlb_crosswalk.py, rebuilt in place). Name+season+team-aware scoring against the statsapi season listings; 0 collisions since 2026-07-10. The one sanctioned shared pair is Ohtani: CBS's two-way pseudo-ids 900 '(Batter)' / 901 '(Pitcher)' both map to MLBAM 660271, disambiguated by the name suffix (MLB-68)."
