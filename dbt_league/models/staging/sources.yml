version: 2

sources:
  - name: raw
    database: ESPN_FANTASY
    schema: RAW
    # Freshness: the four settings-style snapshots carry an extracted_at
    # load timestamp and are re-extracted at least once per season (they're
    # event-driven, not weekly), so their thresholds are seasonal -- warn at
    # ~7 months means "a new season started and the settings were never
    # re-pulled." box_scores is the weekly-cadence table but has no load
    # timestamp column yet, so it carries no freshness config (adding
    # extracted_at to the box-score extract is the enabling change).
    #
    # MLB-57: every raw table carries league_key -- the registry key
    # (config/leagues.yml) the extract stamps on each row it loads.
    # Payloads stay platform-shaped and verbatim; league_key is load
    # metadata. Legacy rows were backfilled to the default ESPN league by
    # tools/migrate_raw_league_key.py.
    tables:
      - name: box_scores
        description: "Raw ESPN Fantasy box score JSON, one row per scoring period. Each row contains all matchups for that day with full player lineups and stat breakdowns."
      - name: scoring_settings
        description: "Raw ESPN Fantasy scoring settings JSON, append-only. Each row is a snapshot of the league's scoring weights for a season, captured at extraction time. The staging model picks the latest snapshot per season."
        config:
          loaded_at_field: extracted_at
          freshness:
            warn_after: {count: 210, period: day}
            error_after: {count: 420, period: day}
      - name: roster_settings
        description: "Raw ESPN Fantasy roster settings JSON, append-only. Each row is a snapshot of lineup slot counts, position maximums, and related roster constraints for a season."
        config:
          loaded_at_field: extracted_at
          freshness:
            warn_after: {count: 210, period: day}
            error_after: {count: 420, period: day}
      - name: team_owners
        description: "Raw ESPN team -> owner mapping, append-only. Each row is a VARIANT array of {team_id, owner_id, first_name, last_name, display_name} for a season, captured from league.teams[].owners. Public leagues may withhold first/last while serving display_name. owner_id is the stable ESPN member GUID the box-score extract discards; this is the bridge that lets the owner_nicknames seed join the data. Staging picks the latest snapshot per season."
        config:
          loaded_at_field: extracted_at
          freshness:
            warn_after: {count: 210, period: day}
            error_after: {count: 420, period: day}
      - name: draft_picks
        description: "Raw ESPN draft board, append-only. Each row is a VARIANT array of pick dicts {overall_pick, round_num, round_pick, player_id, player_name, team_id, keeper} for a season, serialized from the espn-api wrapper's league.draft (player names + drafting team resolved at extract time). keeper flags picks retained from the prior season (keeper league). Staging picks the latest snapshot per season."
        config:
          loaded_at_field: extracted_at
          freshness:
            warn_after: {count: 210, period: day}
            error_after: {count: 420, period: day}
      - name: transactions
        description: "Raw ESPN transaction board, append-only (MLB-16). Each row is a VARIANT array of verbatim ACTIVITY_TRANSACTIONS topic objects for a season, paged to exhaustion from the communication endpoint (view=kona_league_communication) -- ESPN's durable full-season add/drop/trade log for baseball (the mTransactions2 view is a current-scoring-period decoy). Each topic nests messages carrying messageTypeId (178 add, 179 drop, 224/239/244 trade legs, 188 lineup), targetId (playerId), and from/to/for team ids. stg_transactions interprets the vocabulary. Current-season only (prior seasons unreachable via leagueHistory's topics filter). Staging picks the latest snapshot per season."
        config:
          loaded_at_field: extracted_at
          freshness:
            warn_after: {count: 210, period: day}
            error_after: {count: 420, period: day}

      # Settings blocks the extract had always fetched and discarded, plus
      # the team-season standings served alongside them (MLB-227). ONE TABLE
      # PER BLOCK deliberately: these could share a SETTINGS table and do
      # not, because a human troubleshooting roster slots and a human
      # troubleshooting the playoff bracket are on different errands.
      # Payloads are verbatim; interpretation lives in stg_*.
      - name: schedule_settings
        description: "Raw ESPN scheduleSettings JSON, append-only. Divisions (ids are NOT contiguous and names carry trailing whitespace), matchup period counts, and the playoff structure -- playoffTeamCount, playoffSeedingRule, playoffReseed. matchupPeriods is a degenerate identity map in ESPN's own payload ({'1': [1], ...}), so it yields a true total period count and nothing else: no membership, no dates, no per-period length. Staging picks the latest snapshot per season."
        config:
          loaded_at_field: extracted_at
          freshness:
            warn_after: {count: 210, period: day}
            error_after: {count: 420, period: day}
      - name: transaction_coverage
        description: >
          Raw transaction-capture verdict, append-only, one payload per
          (league, season, extract): {outcome, topic_count, http_status,
          attempts} (MLB-243). Outcome is SERVED_NONEMPTY / SERVED_EMPTY /
          UNAUTHORIZED / NOT_SERVED. EXISTS BECAUSE AN ABSENCE OF
          TRANSACTION ROWS IS AMBIGUOUS: a quiet league and a refused feed
          both produce none, and only the first is evidence. A served-empty
          row is what proves zero activity; an unauthorized row never does.
          Written on every outcome, including the failures -- that is the
          whole point.
        config:
          loaded_at_field: extracted_at
          freshness:
            warn_after: {count: 210, period: day}
            error_after: {count: 420, period: day}
      - name: draft_settings
        description: "Raw ESPN draftSettings JSON, append-only. Draft type, date, pick order and keeper count (5 in 2026, 0 in 2025 -- the league became a keeper league between seasons). Distinct from draft_picks, which is the resulting board. No staging model yet; captured because the payload was already being fetched."
        config:
          loaded_at_field: extracted_at
          freshness:
            warn_after: {count: 210, period: day}
            error_after: {count: 420, period: day}
      - name: acquisition_settings
        description: "Raw ESPN acquisitionSettings JSON, append-only. Waiver rules, acquisition limits and budget. No staging model yet; captured because the payload was already being fetched."
        config:
          loaded_at_field: extracted_at
          freshness:
            warn_after: {count: 210, period: day}
            error_after: {count: 420, period: day}
      - name: trade_settings
        description: "Raw ESPN tradeSettings JSON, append-only. Trade deadline, review period and veto rules. No staging model yet; captured because the payload was already being fetched."
        config:
          loaded_at_field: extracted_at
          freshness:
            warn_after: {count: 210, period: day}
            error_after: {count: 420, period: day}
      - name: team_standings
        description: "Raw ESPN per-team season standings (mTeam view), append-only. Each row is a VARIANT array of verbatim team objects for a season, carrying divisionId, playoffSeed, rankCalculatedFinal and the full record block. playoffSeed is a 1..N regular-season rank assigned to non-qualifiers too, and it is NOT rankCalculatedFinal -- 2025's champion was the 7 seed. Both are captured because ESPN seeds division winners ahead of the field, so neither is reconstructable from a record sort. rankCalculatedFinal is 0 until a season closes, then backfillable on re-fetch. Staging picks the latest snapshot per season."
        config:
          loaded_at_field: extracted_at
          freshness:
            warn_after: {count: 210, period: day}
            error_after: {count: 420, period: day}

      # The platform's own matchup-period membership (MLB-235). Its own
      # table rather than part of schedule_settings because the two have
      # different cadences: scheduleSettings is a once-a-season block, this
      # one gains a closed period every week.
      - name: matchup_schedule
        description: >
          Raw ESPN mMatchupScore snapshot, append-only: {seasonId, status,
          schedule} captured verbatim (never the schedule array alone --
          status.currentMatchupPeriod IS the closed-period policy, and
          seasonId is the only cross-check on the season a row was filed
          under that the loader did not stamp itself). The KEYS of
          schedule[].home/away.pointsByScoringPeriod are the scoring periods
          belonging to each matchupPeriodId -- the platform-owned membership
          that makes matchup length, and therefore is_abnormal, derivable
          without the hand-maintained matchup_schedule seed. Distinct from
          schedule_settings, whose matchupPeriods is a degenerate identity
          map carrying no membership. MEMBERSHIP IS RETROSPECTIVE: the
          current matchup period is still filling in and reads short, so
          only periods below status.currentMatchupPeriod are eligible.
          Scoring-period IDS ONLY -- ESPN serves no start/end dates here.
          That is not the same as the calendar being unavailable: the ids are
          DAILY, so mlb_season_calendar's anchor turns them into start/end
          dates by ordinary day arithmetic (MLB-235 rung 4B-2). Captured
          automatically on every box-score run (rung 4B-1) because selection
          reads it, so this table is present-and-empty only until the first
          run; no freshness thresholds for that reason, same as box_scores.
          Staging picks the latest snapshot per league + season.

      # The opener anchor (MLB-235 rung 4B-2). NOT ESPN, and deliberately not
      # folded into matchup_schedule -- that snapshot is ESPN's three blocks
      # verbatim, and a second vendor's measurement inside it would make
      # "what did ESPN serve" unanswerable from the row.
      - name: mlb_season_calendar
        description: >
          MLB's own public season record for one year, narrowed and
          provenance-bearing: {seasonId, regularSeasonStartDate,
          regularSeasonEndDate, source, anchor_field} from
          statsapi.mlb.com/api/v1/seasons?sportId=1&season=YYYY. Append-only.
          regularSeasonStartDate IS ESPN scoring period 1, which is the anchor
          that makes every matchup-period date derivable without the
          hand-maintained matchup_schedule seed -- measured, not assumed:
          2025-03-18 and 2026-03-25, reproducing the seed on all 44 closed
          periods of both seasons. It is the REGULAR-season start on purpose:
          MLB opens with a special or standalone game before the conventional
          full-slate Opening Day, and not the same way twice (2025 the Tokyo
          Series, 2026 a single Yankees-Giants night in San Francisco), while
          seasonStartDate is spring training. The row carries a league_key
          because the snapshot shape is uniform, but the calendar is a fact
          about BASEBALL, not a league: staging keys it on season_year alone.
          Present-and-empty until a run reaches MLB's API; dates then stay
          NULL rather than being guessed.

      # CBS raw archives (MLB-59 loader, extract/cbs_load.py) -- same
      # warehouse, same RAW schema, platform-prefixed tables. Payloads land
      # VERBATIM in a `payload` VARIANT with envelope-lineage columns
      # (endpoint, params, captured_at, http_status, source_path); every row
      # carries league_key. Staging (stg_cbs__*) is the convergence boundary.
      # No freshness config: the fantasy-layer tables are captured on the
      # weekly runbook, the history tables are a one-time backfill; captured_at
      # exists but seasonal thresholds don't fit a mixed-cadence archive.
      - name: cbs_standings
        description: "Raw CBS period-end standings (league/standings/overall?period=N), one row per scoring period. payload.body.overall_standings.divisions[].teams[] carries cumulative season-to-date rank + points. The platform-delivered F7 feed -- a non-H2H points league has no matchups to derive standings from."
      - name: cbs_season_stats
        description: "Raw CBS season-grain player stats (league/stats?timeframe=YYYY), one row per season universe file. params.position distinguishes the hitter universe (absent) from the pitcher universe (position=P). payload.body.league_stats.players[] carries flat native stat keys + the platform's own season FPTS -- the MLB-62 reconciliation anchor."
      - name: cbs_gamelogs
        description: "Raw CBS per-game player stat lines (players/gamelog), exploded to one row per game entry. game VARIANT = {game_date, opponent, ..., stats:{native per-game keys}}. Appearance-grain for pitchers, team-schedule-grain for hitters (G flags real appearances). No per-game FPTS -- MLB-62 recomputes from scoring weights."
      - name: cbs_rosters
        description: "Raw CBS 2026 daily rosters (league/rosters?point=YYYYMMDD&team_id=all), one row per date. payload.body.rosters.teams[].players[] carries the deployed slot (roster_pos) and the started/sat split (roster_status A/RS) -- the perishable fantasy layer, F3."
      - name: cbs_config
        description: "Raw CBS config snapshots (details/teams/owners/league_rules/scoring_rules), one row per snapshot with a config_kind column. scoring_rules.categories carries the F4 scoring weights (keyed on the stat name); teams/owners carry F8 team + owner identity."
      - name: cbs_transactions
        description: "Raw CBS 2026 transaction-log snapshots (league/transaction-list/log), one row per snapshot. The rolling add/drop/trade window -- F10, current-season only at the API (full history rides the UI capture, MLB-47)."

      # Universal baseball layer (MLB-70, extract/mlb_stats.py + mlb_load.py)
      # -- the platform-NEUTRAL stats spine sourced from the public MLB Stats
      # API (statsapi.mlb.com). These tables carry NO league_key by design:
      # they are the shared what-a-player-did layer that every league's
      # fantasy layer (membership + scoring rules) joins onto. The pivot's
      # reason: CBS's league/stats history is free-agent-only (0/480
      # currently-rostered players present), so the baseball layer must come
      # from a complete source.
      - name: mlb_gamelogs
        description: "Raw MLB Stats API per-game logs, one row PER GAME per (player, season, stat_group) -- the deliberate explosion; each game's stat split lands verbatim in the game VARIANT ({stat, team, opponent, isHome, isWin, date, game.gamePk}). 595K+ rows, 2,227 players, full careers of every crosswalked CBS player (sparse pre-2008). stat_group 'hitting'|'pitching' scopes each row's stat keys -- the MLB-68 two-way split rides it."
      - name: mlb_season_stats
        description: "Raw MLB Stats API season aggregates (yearByYear), one row per (player, season, stat_group). Carries the season team -- the crosswalk's team-evidence source -- and serves as the gamelog-completeness cross-check (season totals vs per-game sums)."
      - name: mlb_fielding
        description: "Raw MLB Stats API fielding yearByYear splits, one row per (player, season, TEAM, position): games/gamesStarted at that position. The games-by-position eligibility input (CBS's captured rule prices positions by last-year/this-year games played there). ALL career seasons ride in one call -- pre-league years included, which the season-Y 'played 20 games last year' test needs for the league's own first seasons. Traded players carry one row per team; consumers SUM across teams."
      - name: mlb_game_positions
        description: "Per-game positions re-walked from the SAME gamelog files as mlb_gamelogs (loader family 'gamepos'; no re-fetch): one row per (player, season, game, position) from the split-level positionsPlayed the gamelogs walker never projected, pitching games constant P. Dates the in-season eligibility achievement ('10 games this year' becomes eligible ON the 10th game's date). Pinch-hit-only appearances emit no rows -- correct, they don't advance position counters. A position player's mop-up pitching appears from BOTH group files on one game_pk; consumers dedupe on game_pk."
      # Parsed UI history (extract/cbs_ui_parse.py over the MLB-47 captured
      # pages) -- the fantasy-layer history the API denies, structured.
      # Idempotent by source_path; verbatim-leaning (era phrases land raw).
      - name: cbs_ui_standings
        description: "Season FINAL standings parsed from the year-by-year dashboard pages, 2001-2025 (the in-progress season's card is empty). One row per (season, franchise): rank, batting/pitching/total points, behind. Carries the per-season team_name -> franchise_id map (from the single-quoted team-overview hrefs) that every other UI family resolves against -- names drift AND get reused across franchises, so the map is per-season by design."
      - name: cbs_ui_rosters
        description: "Year-end roster anchors parsed from the roster-report pages, 2003-2025, ALL teams (the early-era single-team capture gap was closed 2026-07-12 by re-sweep). One row per (season, team, player): name, primary pos, MLB team/status, GLOBAL Own%/Start% (absolute across all CBS leagues -- verified: rostered players appear below the 1-in-16 local floor), year-end A/RS status, deployed slot, era-dependent eligibility. franchise_id is NULL in raw (filename ids are lies; league-wide pages carry names only) -- staging resolves it."
      - name: cbs_ui_transactions
        description: "The full transaction history parsed from the start_row-paginated reports, 2001-2026: 55,980 player-actions across ~25,700 transactions (2026 full-season swept 2026-07-12). Era action phrases land RAW (Added/Dropped/Signed/Released/Traded from X/Activated/Benched/Reserved/Moved ...); staging normalizes to move types. Modern rows carry CBS player ids + /teams/{id}; trades are one transaction id across two per-side rows. Window-overlap duplicates were merged at parse (the capture's stride overlapped page boundaries until bgFan rows were counted). DUAL-SOURCE VERIFIED against the API transaction log on 2026, the one year with two independent sources: 746/748 moves match exactly on (franchise, player id, move type, effective date); the 2 misses are one PRE-SEASON trade the UI report structurally omits -- a class the walk-back's opening-roster recovery absorbs correctly (pre-season acquisitions surface as anchored-no-acquisition season-start openings on the right team)."
      - name: cbs_draft
        description: "Draft picks parsed from the draft-results pages, 2009-2026 (MLB-90; the parse itself predates the load -- cbs_draft_parse.py held the rows as NDJSON until the modeling shape was signed off). Lands VERBATIM: 8,596 rows covering BOTH the round and team views of each draft, playerless order-only rows included, because per-season the two views disagree about what is trustworthy -- true pick order exists for 2025-26 only, 2011-2023 classes are orderless, and nothing survives pre-2011 beyond 2009's order-without-players. Staging picks one view per season and drops the furniture; landing that choice here would bake a judgement into RAW and discard the other view's evidence. No franchise id on these pages (team_name_raw only) and player_cbs_id is NULL across the plain-text early era."
      - name: cbs_ui_mlbam_xwalk
        description: "The UI-history population's name -> MLBAM crosswalk (MLB-63 coverage extension, mlb_crosswalk.py --ui-population): year-end-roster display names matched by the same evidence machinery, statsapi index extended to 2001 for careers that ended before the archive era. 2,736 of 2,753 names (99.4%); collisions are EXPECTED here (era spellings of one player). NO CBS ids exist for this population -- staging admits only mlbams the real crosswalk lacks, under synthetic 'ui-only-' ids (the prefix marks identity provenance: this player exists in the UI history ONLY, no platform id anywhere)."
      - name: cbs_mlbam_crosswalk
        description: "CBS player id -> MLBAM id bridge (extract/mlb_crosswalk.py, rebuilt in place). Name+season+team-aware scoring against the statsapi season listings; 0 collisions since 2026-07-10. The one sanctioned shared pair is Ohtani: CBS's two-way pseudo-ids 900 '(Batter)' / 901 '(Pitcher)' both map to MLBAM 660271, disambiguated by the name suffix (MLB-68)."
