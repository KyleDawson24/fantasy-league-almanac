# Repo-local dbt profile for the DuckDB target (MLB-10).
#
# WHY IT LIVES IN A SUBDIRECTORY: dbt auto-discovers a `profiles.yml`
# sitting in the project root (dbt_league/) and would silently shadow
# ~/.dbt/profiles.yml for every invocation, including the Snowflake ones
# the weekly run depends on. Nesting it one level down means dbt never
# finds it by accident -- it is reachable only via an explicit
# `--profiles-dir dbt_league/profiles`, which is what tools/duckdb_run.sh
# passes. The Snowflake `dev`/`demo` targets stay exactly where they are,
# in ~/.dbt/profiles.yml, untouched by the port.
#
# WHY THE FILE IS NAMED ESPN_FANTASY.duckdb: `sources.yml` pins
# `database: ESPN_FANTASY` / `schema: RAW`, and DuckDB takes its catalog
# name from the database file's stem. Naming the file to match means
# source() resolves to the same fully-qualified name on both engines and
# not one line of model YAML moves for the port. Same reasoning for
# `schema: ANALYTICS` below -- models land at ESPN_FANTASY.ANALYTICS.<x>
# on DuckDB exactly as they do on Snowflake, which is what lets the
# output layer swap connections in phase 5 without rewriting its SQL.
#
# Paths are relative to the CWD, and the house rule is that everything
# runs from the repo root (CLAUDE.md, single-checkout world). Override
# with DBT_DUCKDB_PATH to point at a different league's database.

dbt_league:
  target: duckdb
  outputs:
    duckdb: &duckdb_base
      type: duckdb
      path: "{{ env_var('DBT_DUCKDB_PATH', 'data/duckdb/ESPN_FANTASY.duckdb') }}"
      database: ESPN_FANTASY
      schema: ANALYTICS
      threads: 4
      extensions:
        - json

      # Safety knobs, set FIRST rather than as a reaction to trouble.
      # The MLB-9 spike's OOM retries ballooned the Windows pagefile ~26 GB
      # and took C: from ~16 GB free to 1.7 GB; the audit's operational
      # finding #3 is explicit that a consumer-hardware dev loop pins the
      # memory limit and caps the spill directory up front. The cap is
      # deliberately modest -- the full 244-node chain built green at 6 GB
      # with an observed ~1.7 GB spill peak, so this is headroom, not a
      # squeeze. DBT_DUCKDB_MEMORY_LIMIT lets the 8 GB-laptop diligence
      # pass (MLB-109's "runs on a stranger's machine" claim) re-run the
      # same build under tighter settings without editing this file.
      # temp_directory is deliberately NOT pinned. DuckDB refuses to switch
      # it once the current one has been used ("Cannot switch temporary
      # directory after the current one has been used"), which turns any
      # build that has already spilled into a hard failure on the next
      # model. Its default for a file-backed database is <dbfile>.tmp --
      # i.e. already inside the gitignored data/duckdb/ -- so pinning it
      # bought nothing and cost that. The size cap still applies.
      settings: &duckdb_settings
        memory_limit: "{{ env_var('DBT_DUCKDB_MEMORY_LIMIT', '6GB') }}"
        max_temp_directory_size: "{{ env_var('DBT_DUCKDB_TEMP_LIMIT', '6GB') }}"
        # ENGINE worker threads -- NOT the same knob as dbt's `--threads`,
        # and the difference is load-bearing. `--threads` sets dbt's model
        # concurrency only; the adapter forwards this `settings:` block and
        # nothing else, so with `--threads 1` the engine still reported
        # `current_setting('threads') = 32` on this box (measured
        # 2026-07-31). Every memory figure taken before this line existed
        # was therefore measured at 32 workers, each carrying its own
        # buffers -- which is a memory floor made of parallelism, not of
        # the data. Pinned here so the cap means what it appears to mean;
        # sweepable for the threads-vs-peak ladder.
        #
        # DEFAULT RULED 1 (MLB-172, 2026-07-31). The sweep found 4 fastest
        # -- 74/74 in 499-613s against 987s at 2 and 1120s at 1 -- but that
        # was measured on a 32-CORE box, where 4 threads is an eighth of the
        # machine. On a 4-core laptop, 4 threads is ALL cores, which is the
        # same shape as the 32-worker case that just failed two models. The
        # fast number does not transfer to the hardware this target exists
        # to serve, so the default is the safe one and the knob is
        # documented. Revisiting the default is MLB-172's call, not a
        # per-session tuning decision.
        threads: "{{ env_var('DBT_DUCKDB_THREADS', '1') }}"
        # The reshape layer is wide and materializes as tables; row order
        # is never load-bearing (every model that cares carries an explicit
        # ORDER BY), so letting DuckDB parallelize freely is free speed --
        # but see the thread note above: "freely" is not free of memory.
        preserve_insertion_order: false

    # Measurement-only target. Identical to `duckdb` plus DuckDB's own
    # profiling, so the release metric can be the ENGINE's peak rather than
    # a sampled one: `system_peak_buffer_memory` is what `memory_limit`
    # actually caps, and no external sampler can see the buffer pool -- RSS
    # is not it. Both counters are SYSTEM-level and CUMULATIVE for the
    # connection (verified: a trivial query after a heavy one still reports
    # the heavy one's peak), so the last profile a run writes holds the
    # whole-run peak.
    #
    # A separate target because there is no value of `enable_profiling`
    # that means "off", and normal runs should not pay for a JSON write per
    # query. Select it with `--target duckdb_profiled`.
    #
    # `enable_profiling` MUST be listed before `profiling_output`: DuckDB
    # validates the output file's extension against the current profiling
    # format, so setting the path first fails with a parser error.
    duckdb_profiled:
      <<: *duckdb_base
      settings:
        <<: *duckdb_settings
        custom_profiling_settings: '{"SYSTEM_PEAK_BUFFER_MEMORY":"true","SYSTEM_PEAK_TEMP_DIR_SIZE":"true"}'
        enable_profiling: json
        profiling_output: "{{ env_var('DBT_DUCKDB_PROFILE_OUT', 'duckdb_profile.json') }}"
