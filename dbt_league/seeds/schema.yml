version: 2

seeds:
  - name: stat_classification
    description: >
      Seed-driven catalog of every stat the pipeline knows about. Single
      source of truth for stat metadata: identity (stat_name, ESPN ID),
      classification (category, derived vs counting), display (display_name,
      abbrev), and record-surfacing rules (polarity, is_record_candidate,
      auto_tracked).

      The seed drives multiple downstream consumers:
      (1) mart_stat_leaderboard's Jinja UNPIVOT loop iterates over rows
      where is_record_candidate=true, emitting one CTE-row per stat into
      the unioned mart.
      (2) Python output scripts read display_name / abbrev / polarity /
      auto_tracked via the lru_cached accessors in output/stat_catalog.py.
      (3) The records-section consumer-side filter (should_track_record)
      uses polarity + auto_tracked to decide what surfaces as a
      tracked record.

      Adding or modifying a stat is a CSV edit + reseed; no Python or
      mart-SQL change required. Reseed with
      `dbt seed --full-refresh -s stat_classification` (plain `dbt seed`
      may treat the existing table as already-loaded and skip).
    columns:
      - name: stat_name
        description: >
          Primary key. Matches the key in the raw box-scores breakdown
          VARIANT, so stays in ESPN's namespace where possible: '1B' / '2B'
          / '3B' for singles/doubles/triples, '64' for shutouts (no
          English label from ESPN), 'HBP_P' for pitcher hit-by-pitch
          (renamed at extract to disambiguate from batter HBP). Derived
          stats (SB_CS, W_L, SV_BLSV) and score totals (CALCULATED_*,
          PLATFORM_*) are project-defined and don't have an ESPN stat_id.
        tests:
          - not_null
          - unique
      - name: espn_stat_id
        description: 'ESPN numeric stat ID from the raw breakdown VARIANT. NULL for derived stats and score totals not in ESPN''s catalog.'
      - name: stat_category
        description: '''hitting'' | ''pitching'' | ''fielding'' | ''unknown'' | ''total''. Drives the slot-stat-category compatibility filter at int_player_daily (a hitter''s hitting stats only count when slotted as a hitter, etc.). ''total'' covers the score-column rows (CALCULATED_*, PLATFORM_*).'
        tests:
          - accepted_values:
              arguments:
                values: ['hitting', 'pitching', 'fielding', 'unknown', 'total']
      - name: espn_stat_label
        description: 'ESPN''s English label for the stat (e.g., "Strikeouts (Pitcher)"). Carried as traceability metadata; downstream consumers use display_name and abbrev instead. NULL for derived stats and score totals (no ESPN-side equivalent).'
      - name: display_name
        description: 'Project-owned display label used by output formatters. Read via stat_catalog.get_display_map(). Diverges from espn_stat_label where the project wants different wording (e.g., "K/9" instead of "Strikeouts Per 9 Innings").'
      - name: abbrev
        description: 'Compact display form for tight rendering contexts. Read via stat_catalog.get_abbrev_map(). Frequently matches stat_name but can differ (e.g., display "K/9" for stat_name "K_PER_9").'
      - name: is_counting
        description: 'True for stats that have a wide column on int_player_daily and propagate as SUM rollups up the DAG. False for rate stats (computed at fact layer via macros), ESPN internal flags that aren''t scored, and score-total rows.'
      - name: is_derived
        description: 'True for stats computed from other counting stats via an inline SQL expression rather than a direct ESPN breakdown value. Currently: PA, SB_CS, W_L, SV_BLSV. When true, derivation_expr is non-empty and the mart Jinja loop inlines the expression.'
      - name: derivation_expr
        description: 'SQL expression computing the derived value from fct counting columns (e.g., "ab + b_bb + hbp + sf" for PA). Non-empty only when is_derived=true. Read at mart compile time by the seed-driven Jinja UNPIVOT loop.'
      - name: auto_tracked
        description: 'True for stats tracked regardless of the league''s scoring settings -- universal counting stats and project-defined derivations meaningful for cross-season records even without a points_per_unit weight. Distinct from stats that are tracked because they appear in scoring_settings (those flow through the polarity rule via points_per_unit-derived polarity). Currently flagged: H, TB, XBH, SF, ER, PA. Implementation bypasses the polarity rule at team grain so both ''most'' and ''fewest'' directions surface.'
      - name: is_record_candidate
        description: 'Appears in mart_stat_leaderboard. The Jinja UNPIVOT loop iterates rows where this is true, emitting one ranked CTE per stat. Setting false on a stat drops it from the leaderboard without touching SQL.'
      - name: polarity
        description: '''positive'' | ''negative'' | ''neutral''. Drives consumer-side Best/Worst labeling and which record directions surface. For positive stats (HR, K), ''most'' = Best. For negative stats (ER, WHIP), ''most'' = Worst. Neutral stats don''t surface as records. Polarity merges scoring-settings sign and project-defined overrides at seed-edit time; consumers read via stat_catalog.get_polarity_map().'
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['positive', 'negative', 'neutral']
      - name: qualifier_stat
        description: 'v1.1.1 rate-stat min-volume qualifier: name of the denominator column (e.g. ''ab'', ''outs'') gating whether a rate stat qualifies as a record. NULL on every non-rate stat.'
      - name: qualifier_min
        description: 'Minimum qualifier_stat volume below which the rate doesn''t qualify as a record (e.g. 225 AB for hitting rates, 150 outs = 50 IP for pitching rates). mart_stat_leaderboard skips the threshold filter when NULL.'
      - name: notes
        description: 'Free-text context for unusual rows -- mislabels, scoring-weight discoveries, deprecated stats, ESPN internal flags. Often references the Phase X documentation where the row''s history was hashed out.'
      - name: canonical_key
        description: >
          The ESPN->canonical bridge (MLB-4 / the CBS convergence): the
          platform-neutral canonical_stats slug this ESPN stat maps into, so a
          second platform (CBS via cbs_stat_map -> canonical_key -> this
          stat_name) can converge onto the same DAG that speaks ESPN
          stat_names. Populated for real baseball stats with a canonical
          counterpart; NULL for ESPN-internal flags, project score/rate rows,
          and stats with no canonical yet (PA, cycle, net-stats). The one
          non-ESPN row here (IRSTR) exists purely so CBS's scored strand
          category survives the int_player_daily INNER JOIN.
        tests:
          - relationships:
              arguments:
                to: ref('canonical_stats')
                field: canonical_key

  - name: matchup_schedule
    description: >
      Per-week calendar metadata: start/end dates, abnormal-week flag, and
      playoff round identification. One row per (season_year, matchup_period).
      Drives format_week_label() in the output layer ("Week 5" vs
      "Semi-Finals") and is_abnormal exclusion across leaderboard CTEs.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - season_year
              - matchup_period
    columns:
      - name: season_year
        description: 'MLB season year.'
        tests:
          - not_null
      - name: matchup_period
        description: 'ESPN weekly matchup number (1-indexed; opening week is 1).'
        tests:
          - not_null
      - name: start_date
        description: 'First MLB scoring period day in this matchup_period.'
      - name: end_date
        description: 'Last MLB scoring period day in this matchup_period.'
      - name: is_abnormal
        description: 'Flag for matchup periods that should be excluded from records (All-Star break, weather-shortened weeks, opening week with extended date range). Every leaderboard CTE filters on is_abnormal = false.'
        tests:
          - not_null
      - name: abnormal_reason
        description: 'Free-text explanation when is_abnormal=true. Empty otherwise.'
      - name: is_playoff
        description: 'Flag for playoff weeks. Triggers playoff_round substitution in format_week_label() output.'
        tests:
          - not_null
      - name: playoff_round
        description: '"Round 1" / "Semi-Finals" / "Finals" when is_playoff=true; NULL otherwise.'

  - name: owner_nicknames
    description: >
      Display name resolution for team owners -- THE preferred-names
      source across platforms (Kyle, 2026-07-13). Maps an owner id to a
      preferred_name override; defaults to first_name when preferred_name
      is empty. One row per league member.

      Owner ids by platform: ESPN member GUIDs (platform-served via
      stg_team_owners); CBS 'cbs-' slugs minted in the cbs_team_owners
      seed (CBS serves no owner identity -- names here are the ONLY name
      source for CBS owners, normalized from the year-end report's free
      text: 'JACK KLINE' -> Joel Kimball).

      Joined into dim_owner (v1.2 owner-display work): owner_display =
      preferred_name when set, else proper-cased "First Last". The raw
      ESPN-side owner_name on stg_box_scores still flows through the
      facts unchanged; owner_display is the curated alternative.
    columns:
      - name: owner_id
        description: 'Owner id: ESPN GUID or CBS ''cbs-'' slug. Stable across seasons.'
        tests:
          - not_null
          - unique
      - name: first_name
        description: 'First name (ESPN: as registered; CBS: normalized from the year-end report). Drives the multi-owner comma display on CBS boards.'
      - name: last_name
        description: 'Last name.'
      - name: preferred_name
        description: 'Override for first_name when the owner prefers a different rendering (nickname, alternate spelling). Empty means fall back to first_name.'

  - name: cbs_franchises
    description: >
      The CBS franchise registry: one row per franchise_id ever seen in
      the UI standings (34 ids, 2001-2025 + the 2026 actives), with the
      CURATED display abbrev and the franchise's latest name for
      reference. Curated because CBS's own team_abbr capture is unusable
      as an identity ('T2' and 'T3' each appear twice; 'AH'/'KR' are
      stale pre-rename values). Known id-discontinuity pairs
      (Foster's Folly 13/30, Kimball Drives 22/28, Bent Spokes 14/17,
      Victory Circle Firecrackers 26/31) deliberately SHARE an abbrev --
      they are one franchise to the humans; MLB-64's continuity overlay
      formalizes it. Abbrevs are display proposals -- tweak freely.
    columns:
      - name: league_key
        tests:
          - not_null
      - name: franchise_id
        tests:
          - not_null
      - name: abbrev
        description: >
          Short display code for boards and matrices (2-4 chars,
          ESPN-abbrev style). NOT unique by design (continuity pairs
          share). THE collection point for owner abbrev preferences
          (Kyle, 2026-07-13): edit freely as managers weigh in (e.g. the
          numbers team -> MATT, its owner's first name, a good default
          for ambiguous names; Junk Drawer All-Stars -> JUNK). A shared abbrev
          is DISPLAY ONLY -- it does NOT aggregate the franchises'
          records; true franchise continuity is MLB-64's overlay.
        tests:
          - not_null
      - name: franchise_name
        description: 'Latest known name, for human reference when editing this seed. Display names come from the season-keyed sources, not here.'

  - name: cbs_team_owners
    description: >
      The CBS franchise -> owner bridge, CURRENT ERA ONLY (the era the
      seed can attest -- historical custody is MLB-64). Minted 'cbs-'
      owner_id slugs join the shared owner_nicknames seed for names.
      Co-owned teams carry multiple rows (Junk Drawer All-Stars: Barry Sexton +
      Solomon Delgado). Sourced from the 2025 year-end report's owner
      strings; every ACTIVE franchise must have at least one row (the
      boards render Owner from it).
    columns:
      - name: league_key
        tests:
          - not_null
      - name: franchise_id
        tests:
          - not_null
      - name: owner_id
        description: 'FK into owner_nicknames.'
        tests:
          - not_null

  - name: player_nicknames
    description: >
      Override display names for specific MLB players. Joined at
      stg_box_scores to populate display_name = COALESCE(nickname,
      player_name), which then propagates through every downstream model.
      Typically used for memorable nicknames ("Big Dumper" for Cal Raleigh)
      that the league refers to colloquially.
    columns:
      - name: player_id
        description: 'ESPN stable numeric player identifier.'
        tests:
          - not_null
          - unique
      - name: player_name
        description: 'Player''s real name. Stored for human reference when editing the seed; not actually joined downstream (the join is by player_id).'
      - name: nickname
        description: 'Display override. When set, becomes display_name on stg_box_scores and propagates through all subsequent models.'

  - name: canonical_stats
    description: >
      The canonical stat catalog (MLB-4 / MLB-60): platform-neutral stat
      keys every platform vocabulary maps INTO. Keys are project-owned
      readable slugs (Per Offline Chat 2026-07-08) -- not any platform's
      vocabulary and not Baseball-Reference's. bref_key rides as a
      nullable ALIGNMENT column: populated for stats with a real-world
      identity (the join surface for external data), NULL for
      fantasy-layer constructs (quality_starts, holds,
      inherited_runners_stranded, platform_fantasy_points) -- which is
      the honest split a bref-primary-key scheme would have papered
      over. Room for an mlbam_key sibling later. The ESPN vocabulary
      remaps onto this catalog under MLB-4; CBS maps via cbs_stat_map.
    columns:
      - name: canonical_key
        description: 'Primary key. Project-owned readable slug (doubles, earned_runs, quality_starts).'
        tests:
          - not_null
          - unique
      - name: display_name
        description: 'Human label for consumer surfaces.'
        tests:
          - not_null
      - name: stat_category
        description: 'hitting | pitching | fielding | general | scoring. Fielding is a first-class category here (CBS reports it; ESPN''s league doesn''t) -- the convergence surface widens when a platform needs it.'
        tests:
          - accepted_values:
              arguments:
                values: ['hitting', 'pitching', 'fielding', 'general', 'scoring']
      - name: bref_key
        description: 'Baseball-Reference column abbreviation for stats with a real-world identity; the alignment point for any external-data join. NULL = fantasy-layer construct with no bref counterpart. bref table context disambiguates reused abbreviations (batting SO vs pitching SO) together with stat_category.'
      - name: is_derived
        description: 'True for rates/composites computed from other canonical stats rather than accumulated.'

  - name: cbs_stat_map
    description: >
      CBS vocabulary -> canonical stat keys (MLB-60): every stat
      abbreviation observed in the CBS archives (gamelog + season-stats
      key census over the loaded warehouse rows, 2004-2025) plus every
      scored category in the 2026 scoring_rules snapshot. Full-vocabulary
      accounting: keys that are NOT crosswalked stats are still rows,
      dispositioned as metadata (the GP-by-position family -- staging's
      era-true position signal), derived_composite (CBS display
      arithmetic like SDT = H - HR), vestigial (present-but-always-zero
      keys), or unknown. `.ytd` running-counter keys are excluded by
      rule: derived, dropped-or-validated at staging, never crosswalked.

      Pitching landed (2026-07-09, MLB-45): the position=P universe sweep
      filled the feed's pitching vocabulary -- all 11 scored pitching
      categories now carry gamelog|season observation, plus ~45 unscored
      pitching keys (counting, rates, batting-allowed lines). Two
      corrections the pitcher data forced: PPos and MLBST were reclassed
      from vestigial to metadata (populated SP/RP and roster-status on
      pitcher rows -- they only read null on hitters), and BFP/K-BB/W-L/
      SHD went from vestigial to real (mapped/derived_composite). The
      scored IRSTR is a DIRECT feed key (not IR-IRS): it reconciles 2025
      season FPTS 587/587 exactly, the MLB-62 recompute anchor.
    columns:
      - name: cbs_key
        description: 'Primary key. The stat abbreviation exactly as CBS spells it in feeds/rules.'
        tests:
          - not_null
          - unique
      - name: canonical_key
        description: 'FK to canonical_stats. Populated iff disposition=mapped.'
        tests:
          - relationships:
              arguments:
                to: ref('canonical_stats')
                field: canonical_key
      - name: stat_category
        description: 'hitting | pitching | fielding | general | scoring | metadata | unknown.'
        tests:
          - accepted_values:
              arguments:
                values: ['hitting', 'pitching', 'fielding', 'general', 'scoring', 'metadata', 'unknown']
      - name: disposition
        description: 'mapped (crosswalked to a canonical stat) | metadata (position-signal columns staging consumes directly) | derived_composite (CBS display arithmetic; derive in marts if wanted) | vestigial (present but always zero/constant in every captured row) | unknown (undocumented; decode before consuming).'
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['mapped', 'metadata', 'derived_composite', 'vestigial', 'unknown']
      - name: in_scoring_rules_2026
        description: 'True for the 16 categories the 2026 scoring_rules snapshot scores. Era rules may differ; MLB-62''s reconciliation residuals are the detector.'
      - name: points_2026
        description: 'points-per-unit from the 2026 scoring_rules snapshot; NULL when unscored.'
      - name: appears_in
        description: 'Pipe-joined surfaces the key was observed on: gamelog | season | scoring_rules.'
      - name: needs_confirmation
        description: 'True where the mapping or formula is a best-effort read of undocumented CBS vocabulary; confirm before a consumer leans on it.'

  - name: mlb_stat_map
    description: >
      MLB Stats API vocabulary -> canonical stat keys (MLB-62): every stat
      key observed in the loaded MLB_GAMELOGS game:stat payloads (full
      2026-07-11 census, both stat groups), dispositioned. The composite
      key is (statsapi_key, stat_group) because the API reuses key names
      across disciplines with different meanings: pitching hits = hits
      allowed, pitching baseOnBalls = walks issued, pitching strikeOuts =
      the scored K. Counting keys land as 'mapped'; feed-computed rate
      strings (avg/era/whip, VARCHAR in the payload) as 'rate' -- recompute
      downstream from counting stats; inningsPitched as 'notation'
      (decimal-thirds display -- outs is the integer primitive CBS's INN
      scoring pays); the pitching hitByPitch as 'duplicate' (identical to
      hitBatsmen on every loaded row); keys with no canonical counterpart
      as 'no_canonical'. Unlike cbs_stat_map there is no scored-flag
      column: scoring weights are CBS's (stg_cbs__scoring_settings), not
      the baseball layer's.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - statsapi_key
              - stat_group
    columns:
      - name: statsapi_key
        description: 'The stat key exactly as statsapi.mlb.com spells it in gameLog splits (camelCase).'
        tests:
          - not_null
      - name: stat_group
        description: 'Which statsapi group the key was observed under -- the discipline scope of the mapping.'
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['hitting', 'pitching']
      - name: canonical_key
        description: 'FK to canonical_stats. Populated iff disposition=mapped.'
        tests:
          - relationships:
              arguments:
                to: ref('canonical_stats')
                field: canonical_key
      - name: stat_category
        description: 'The mapped canonical''s category (hitting | pitching | general). Matches canonical_stats; gamesPlayed is the ''general'' row in both groups.'
        tests:
          - accepted_values:
              arguments:
                values: ['hitting', 'pitching', 'general']
      - name: disposition
        description: 'mapped (crosswalked to a canonical stat) | rate (feed-computed rate string; recompute downstream) | notation (display formatting of a mapped primitive) | duplicate (identical twin of a mapped key) | display (human-readable summary) | no_canonical (counting key with no canonical counterpart).'
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['mapped', 'rate', 'notation', 'duplicate', 'display', 'no_canonical']
      - name: notes
        description: 'Scoring role, derivation inputs, verification notes.'

  - name: player_alias
    description: >
      Hard name aliases for the identity resolver (MLB-81): renames whose forms
      share no normalized token, so the crosswalk's cbs_name/mlbam_name and the
      generated variants can't bridge them (Fausto Carmona -> Roberto Hernandez;
      Mike/Michael Stanton -> Giancarlo). Baseball-truth and platform-independent
      -- these feed dim_player_identity's candidate set and apply to every
      platform. One row = one (name_key -> mlbam) assertion; the resolver's
      season + game-presence gate keeps same-name different-people apart (the
      reliever Stanton vs Giancarlo), so no season columns are needed yet (add
      them here if a genuinely overlapping alias ever surfaces). Reseed with
      `dbt seed --full-refresh -s player_alias`.
    columns:
      - name: name_key
        description: 'cbs_name_key()-normalized old/variant name form (e.g. ''fausto carmona'').'
        tests:
          - not_null
          - unique
      - name: mlbam_id
        description: 'The MLBAM id that name form actually denotes.'
        tests:
          - not_null
      - name: note
        description: 'Why the alias exists + how the season/presence gate keeps any same-name other person apart.'
