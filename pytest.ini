[pytest]
# Scope discovery to tests/ so we don't pick up the gitignored research
# scripts at repo root (test_espn.py, test_kona_returns.py, etc.) -- those
# make live API calls and aren't meant to be part of CI.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Default suite is fast pure-function tests. Golden-output tests hit
# Snowflake (each test runs an output script via subprocess) and take
# 30-60s each -- they're behavioral safety nets, not continuous-loop
# regressions. Tagged `warehouse`; excluded by default.
#
# Run them explicitly:
#   pytest tests/ -m warehouse         (only golden/warehouse tests)
#   pytest tests/ -m ""                (everything, ignoring marker filter)
markers =
    warehouse: integration test requiring a live Snowflake connection
addopts = -m "not warehouse" -ra
